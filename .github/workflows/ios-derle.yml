# Her PR'da ve main'e her gönderimde: uygulamayı iOS Simulator için derler,
# sonra simülatörde açıp Sanat Atlası'nın gerçekten yüklendiğini ekran görüntüsüyle gösterir.
name: iOS derleme

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: derle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derle:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Ben kâhinini canlı sitenin modülleriyle karşılaştır
        if: github.head_ref == 'is/C4-ben' || github.event_name == 'workflow_dispatch'
        run: |
          npm install --prefix "$RUNNER_TEMP/ben-kahin" --no-audit --no-fund playwright@1.56.1
          NODE_PATH="$RUNNER_TEMP/ben-kahin/node_modules" BEN_CHROMIUM="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" node Testler/kahin/ben.mjs > "$RUNNER_TEMP/ben-cevaplar.json"
          node -e "require('node:assert/strict').deepEqual(require(process.argv[1]), require(process.argv[2]))" "./Paketler/NoraCekirdek/Tests/NoraCekirdekTests/Ornekler/ben/cevaplar.json" "$RUNNER_TEMP/ben-cevaplar.json"

      - name: Galeri kâhinini canlı sitede doğrula
        if: github.head_ref == 'is/G2-galeri'
        run: |
          npm install --prefix "$RUNNER_TEMP/galeri-kahin" --no-audit --no-fund playwright@1.56.1
          NODE_PATH="$RUNNER_TEMP/galeri-kahin/node_modules" GALERI_CHROMIUM="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" node Testler/kahin/galeri.mjs > "$RUNNER_TEMP/galeri.json"
          node -e "require('node:assert/strict').deepEqual(require(process.argv[1]), require(process.argv[2]))" "./Paketler/NoraCekirdek/Tests/NoraCekirdekTests/Ornekler/galeri/cevaplar.json" "$RUNNER_TEMP/galeri.json"

      - name: Bugün kâhini ve iPhone 15 Pro görünüş ölçüleri
        if: github.head_ref == 'is/G4-bugun'
        run: |
          npm install --prefix "$RUNNER_TEMP/bugun-kahin" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/bugun-kahin/node_modules/.bin/playwright" install webkit
          NODE_PATH="$RUNNER_TEMP/bugun-kahin/node_modules" node Testler/kahin/bugun.mjs > "$RUNNER_TEMP/bugun.json"
          node -e "const a=require(process.argv[1]), b=require(process.argv[2]); const yuvarla=x=>JSON.stringify(x,(_,v)=>typeof v==='number'?Number(v.toFixed(8)):v); require('node:assert/strict').equal(yuvarla(a),yuvarla(b))" "./Paketler/NoraCekirdek/Tests/NoraCekirdekTests/Ornekler/bugun/cevaplar.json" "$RUNNER_TEMP/bugun.json"

      - name: Çalış kâhinini canlı sitenin modülleriyle karşılaştır
        if: github.head_ref == 'is/C2-calis' || github.event_name == 'workflow_dispatch'
        run: |
          npm install --prefix "$RUNNER_TEMP/calis-kahin" --no-audit --no-fund playwright@1.56.1
          NODE_PATH="$RUNNER_TEMP/calis-kahin/node_modules" CALIS_CHROMIUM="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" node Testler/kahin/calis.mjs > "$RUNNER_TEMP/calis-cevaplar.json"
          node -e "const assert = require('node:assert/strict'); const yuvarla = (v) => typeof v === 'number' && !Number.isInteger(v) ? Number(v.toFixed(11)) : Array.isArray(v) ? v.map(yuvarla) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, yuvarla(x)])) : v; assert.deepEqual(yuvarla(require(process.argv[1])), yuvarla(require(process.argv[2])));" "./Paketler/NoraCekirdek/Tests/NoraCekirdekTests/Ornekler/calis/cevaplar.json" "$RUNNER_TEMP/calis-cevaplar.json"

      - name: Xcode sürümü
        run: xcodebuild -version

      - name: Çekirdek testleri (site verisi, ilerleme, kabuk, günün tablosu, hatırlatma planı)
        run: swift test --package-path Paketler/NoraCekirdek

      - name: Köprü betiği testleri (tekrar takvimi)
        run: node --test Testler/tekrarTakvimi.test.mjs

      - name: Simülatör için derle
        run: |
          set -o pipefail
          xcodebuild build \
            -project NoraSanat.xcodeproj -scheme NoraSanat -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            | tee derleme.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" derleme.log

      - name: Uygulamanın içi (widget, Ayarlar sayfası, URL şeması)
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/NoraSanat.app
          ls "$APP/PlugIns/NoraSanatWidget.appex"
          ls "$APP/Settings.bundle/Root.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleURLTypes:0:CFBundleURLSchemes:0" "$APP/Info.plist" | grep -qx norasanat
          /usr/libexec/PlistBuddy -c "Print NSExtension:NSExtensionPointIdentifier" "$APP/PlugIns/NoraSanatWidget.appex/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/PlugIns/NoraSanatWidget.appex/Info.plist"

      - name: Uygulamayı ekran işlerine ver
        run: ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/NoraSanat.app uygulama.zip

      - uses: actions/upload-artifact@v4
        with:
          name: uygulama
          path: uygulama.zip
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: derleme
          path: derleme.log

  # T8: ekran görüntüleri grup grup, ayrı macOS makinelerinde aynı anda (tek sırada ~55 dk sürüyordu).
  # Gruplar ve adımları: Testler/ci/ekran.sh. Görüntüler ekranlar-<grup> arşivinde.
  ekran:
    needs: derle
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # en uzun gruplar önce (aynı anda çalışan macOS makinesi sınırlı)
        grup: [galeri-1, galeri-2, calis, yolculuk, genel, ben, bugun]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: uygulama

      - name: Simülatörde aç ve ekran görüntüsü al (${{ matrix.grup }})
        run: |
          ditto -x -k uygulama.zip "$RUNNER_TEMP/uygulama"
          Testler/ci/ekran.sh "${{ matrix.grup }}" "$RUNNER_TEMP/uygulama/NoraSanat.app"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekranlar-${{ matrix.grup }}
          path: ekranlar
