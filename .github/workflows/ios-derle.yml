# Her PR'da ve main'e her gönderimde: uygulamayı iOS Simulator için derler,
# sonra simülatörde açıp Sanat Atlası'nın gerçekten yüklendiğini ekran görüntüsüyle gösterir.
name: iOS derleme

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: derle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derle:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Ben kâhinini canlı sitenin modülleriyle karşılaştır
        if: github.head_ref == 'is/C4-ben' || github.event_name == 'workflow_dispatch'
        run: |
          npm install --prefix "$RUNNER_TEMP/ben-kahin" --no-audit --no-fund playwright-core@1.56.1
          NODE_PATH="$RUNNER_TEMP/ben-kahin/node_modules" BEN_CHROMIUM="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" node Testler/kahin/ben.mjs > "$RUNNER_TEMP/ben-cevaplar.json"
          node -e "require('node:assert/strict').deepEqual(require(process.argv[1]), require(process.argv[2]))" "./Paketler/NoraCekirdek/Tests/NoraCekirdekTests/Ornekler/ben/cevaplar.json" "$RUNNER_TEMP/ben-cevaplar.json"

      - name: Xcode sürümü
        run: xcodebuild -version

      - name: Çekirdek testleri (site verisi, ilerleme, kabuk, günün tablosu, hatırlatma planı)
        run: swift test --package-path Paketler/NoraCekirdek

      - name: Köprü betiği testleri (tekrar takvimi)
        run: node --test Testler/tekrarTakvimi.test.mjs

      - name: Simülatör için derle
        run: |
          set -o pipefail
          xcodebuild build \
            -project NoraSanat.xcodeproj -scheme NoraSanat -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            | tee derleme.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" derleme.log

      - name: Uygulamanın içi (widget, Ayarlar sayfası, URL şeması)
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/NoraSanat.app
          ls "$APP/PlugIns/NoraSanatWidget.appex"
          ls "$APP/Settings.bundle/Root.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleURLTypes:0:CFBundleURLSchemes:0" "$APP/Info.plist" | grep -qx norasanat
          /usr/libexec/PlistBuddy -c "Print NSExtension:NSExtensionPointIdentifier" "$APP/PlugIns/NoraSanatWidget.appex/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/PlugIns/NoraSanatWidget.appex/Info.plist"

      - name: Simülatörde aç ve ekran görüntüsü al
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          aday=[]
          for rt,devs in d.items():
              m=re.search(r"iOS-(\d+)-(\d+)",rt)
              if not m: continue
              for x in devs:
                  if "iPhone" in x["name"]:
                      aday.append(((int(m.group(1)),int(m.group(2))),"Pro Max" in x["name"],x["name"],x["udid"]))
          aday.sort()
          print(aday[-1][3])')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=build/Build/Products/Debug-iphonesimulator/NoraSanat.app
          xcrun simctl install "$UDID" "$APP"
          PAKET=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          mkdir -p ekranlar
          /usr/libexec/PlistBuddy -c "Print" "$APP/Info.plist" > ekranlar/Info.plist.txt
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl launch "$UDID" "$PAKET"
          sleep 25
          xcrun simctl io "$UDID" screenshot ekranlar/1-acilis.png
          # İkinci açılış: önbellekten (service worker) gelmeli
          xcrun simctl terminate "$UDID" "$PAKET"
          xcrun simctl launch "$UDID" "$PAKET"
          sleep 12
          xcrun simctl io "$UDID" screenshot ekranlar/2-ikinci-acilis.png
          # Widget'ın üç boyutu, gerçek veriyle (yalnız Debug'da olan önizleme ekranı)
          xcrun simctl terminate "$UDID" "$PAKET"
          xcrun simctl launch "$UDID" "$PAKET" -widgetOnizleme
          sleep 20
          xcrun simctl io "$UDID" screenshot ekranlar/3-widget.png
          # T2: ilerleme köprüsü. Önce Swift'ten okuyup bir deneme yazar (7-8. konular, bugüne 12 kart)...
          xcrun simctl terminate "$UDID" "$PAKET"
          xcrun simctl launch "$UDID" "$PAKET" -ekran ilerleme -ilerlemeYaz
          sleep 30
          xcrun simctl io "$UDID" screenshot ekranlar/5-ilerleme-ozeti.png
          # ...sonra site kendi #/ilerleme sayfasında bunu göstermeli (kayıt kalıcı)
          sleep 3
          xcrun simctl terminate "$UDID" "$PAKET"
          xcrun simctl launch "$UDID" "$PAKET" -yalnizSite -adres "#/ilerleme"
          sleep 20
          xcrun simctl io "$UDID" screenshot ekranlar/6-site-ilerleme.png
          # T3: temanın renk ve yazı örnekleri (Gece, Gündüz; altta sitenin canlı teması)
          xcrun simctl terminate "$UDID" "$PAKET"
          xcrun simctl launch "$UDID" "$PAKET" -ekran tema
          sleep 20
          xcrun simctl io "$UDID" screenshot ekranlar/7-tema.png
          # T3: yerli sekme denemesi: Galeri yerli sayılır; #/gozat'a gidilince site gizlenir, yerli çubuk görünür
          xcrun simctl terminate "$UDID" "$PAKET"
          xcrun simctl launch "$UDID" "$PAKET" -yerliSekme galeri -adres "#/gozat"
          sleep 15
          xcrun simctl io "$UDID" screenshot ekranlar/8-yerli-sekme.png
          # T4: aynı adreste sitenin kendi çubuğu (8 ile yan yana: çubuk aynı yerde, aynı görünüşte olmalı)
          xcrun simctl terminate "$UDID" "$PAKET"
          xcrun simctl launch "$UDID" "$PAKET" -adres "#/gozat"
          sleep 15
          xcrun simctl io "$UDID" screenshot ekranlar/8b-site-cubuk.png
          # T4: yerli çubuğun hızlı ayarlar yaprağı (sitedeki dişli dil)
          xcrun simctl terminate "$UDID" "$PAKET"
          xcrun simctl launch "$UDID" "$PAKET" -yerliSekme galeri -adres "#/gozat" -hizliAcik
          sleep 15
          xcrun simctl io "$UDID" screenshot ekranlar/8c-hizli-ayar.png
          # G1: tam ekran görüntüleyici (ayrıntı noktası olan ilk eser; katalog ve görsel ağdan gelir)
          xcrun simctl terminate "$UDID" "$PAKET"
          xcrun simctl launch "$UDID" "$PAKET" -ekran goruntuleyici
          sleep 30
          xcrun simctl io "$UDID" screenshot ekranlar/9-goruntuleyici.png
          # C1b: pekiştirme kartı. Kart hazır olduğunda görüntüsünü al. Yükleme ve hata ekranı başarı sayılmaz.
          xcrun simctl terminate "$UDID" "$PAKET"
          VERI=$(xcrun simctl get_app_container "$UDID" "$PAKET" data)
          rm -f "$VERI/tmp/pekistirme-hazir"
          xcrun simctl launch "$UDID" "$PAKET" -ekran pekistir
          for _ in {1..90}; do
            test -f "$VERI/tmp/pekistirme-hazir" && break
            sleep 1
          done
          test -f "$VERI/tmp/pekistirme-hazir"
          sleep 4
          xcrun simctl io "$UDID" screenshot ekranlar/10-pekistirme.png
          # C4: gerçek ilerleme ile yerli Ben ekranı ve ayarları
          cat > "$RUNNER_TEMP/ben-ekran.swift" <<'SWIFT'
          import Foundation
          import Vision
          let istek = VNRecognizeTextRequest()
          istek.recognitionLanguages = ["tr-TR", "en-US"]
          try VNImageRequestHandler(url: URL(fileURLWithPath: CommandLine.arguments[1])).perform([istek])
          let metin = (istek.results ?? []).compactMap { $0.topCandidates(1).first?.string }.joined(separator: " ")
          print(metin)
          let soz = CommandLine.arguments[2]
          exit(metin.range(of: soz, options: [.caseInsensitive, .diacriticInsensitive]) == nil ? 1 : 0)
          SWIFT
          xcrun swiftc "$RUNNER_TEMP/ben-ekran.swift" -o "$RUNNER_TEMP/ben-ekran"
          for SAYFA in ilerleme ayarlar; do
            xcrun simctl terminate "$UDID" "$PAKET"
            xcrun simctl launch "$UDID" "$PAKET" -yerliSekme ben -adres "#/$SAYFA" -benSayfa "$SAYFA"
            SOZ="Kursun neresindesin"
            if [ "$SAYFA" = ayarlar ]; then SOZ="Gündüz rengi"; fi
            for DENEME in {1..18}; do
              sleep 5
              xcrun simctl io "$UDID" screenshot "ekranlar/ben-$SAYFA.png"
              if "$RUNNER_TEMP/ben-ekran" "ekranlar/ben-$SAYFA.png" "$SOZ"; then break; fi
              if [ "$DENEME" = 18 ]; then exit 1; fi
            done
          done
          # Widget'a dokunma: norasanat://… uygulamayı açmalı. HEP EN SONDA KALSIN: simülatörün "Open in…" onay
          # penceresi kapanmadan ekranda kalır ve sonraki ekran görüntülerinin üstüne biner.
          xcrun simctl terminate "$UDID" "$PAKET"
          xcrun simctl launch "$UDID" "$PAKET"
          sleep 10
          xcrun simctl openurl "$UDID" "norasanat://calis"
          sleep 6
          xcrun simctl io "$UDID" screenshot ekranlar/4-url-calis.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekranlar
          path: |
            ekranlar
            derleme.log
