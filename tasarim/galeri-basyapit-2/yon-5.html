<!doctype html>
<html lang="tr" data-tema="gece" data-donem="ronesans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galeri · Başyapıtlar · Yön 5 — Büyüteçten Tabloya (Yapışkan Dönem)</title>
    <style>
      @font-face {
        font-family: 'Bodoni Moda';
        src: url('../../NoraSanat/YaziTipleri/BodoniModa.ttf') format('truetype');
        font-weight: 400 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Bodoni Moda';
        src: url('../../NoraSanat/YaziTipleri/BodoniModa-Italic.ttf') format('truetype');
        font-weight: 400 900;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader.ttf') format('truetype');
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader-Italic.ttf') format('truetype');
        font-weight: 200 800;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Archivo';
        src: url('../../NoraSanat/YaziTipleri/Archivo.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      :root,
      :root[data-tema='gece'] {
        --bg: #121110;
        --bg-rgb: 18, 17, 16;
        --surface: #1c1a18;
        --surface-2: #24211e;
        --border: #2e2b28;
        --border-ince: rgba(235, 229, 218, 0.09);
        --ink: #ebe5da;
        --ink-rgb: 235, 229, 218;
        --ink-2: #aca498;
        --ink-3: #8a8379;
        --pirinc: #c9a45c;
        --pirinc-rgb: 201, 164, 92;
        --tab-bg: rgba(20, 18, 16, 0.84);
        --overlay-btn: rgba(18, 17, 16, 0.64);
        --doku: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.04;
        --hale-karisim: normal;
        --hale-1-op: 0.36;
        --hale-2-op: 0.24;
        --kart-golge: 0 22px 48px rgba(0, 0, 0, 0.46);
        --sekme-golge: 0 10px 30px rgba(0, 0, 0, 0.48);
        --sayfa-zemin: #0c0b0a;
        color-scheme: dark;
      }

      :root[data-tema='gunduz'] {
        --bg: #ece8e1;
        --bg-rgb: 236, 232, 225;
        --surface: #f7f5f1;
        --surface-2: #efebe3;
        --border: #d6d0c6;
        --border-ince: rgba(31, 27, 23, 0.08);
        --ink: #1f1b17;
        --ink-rgb: 31, 27, 23;
        --ink-2: #4c463f;
        --ink-3: #686057;
        --pirinc: #8c661c;
        --pirinc-rgb: 140, 102, 28;
        --tab-bg: rgba(244, 240, 234, 0.88);
        --overlay-btn: rgba(247, 245, 241, 0.84);
        --doku: radial-gradient(rgba(31, 27, 23, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.045;
        --hale-karisim: multiply;
        --hale-1-op: 0.24;
        --hale-2-op: 0.16;
        --kart-golge: 0 20px 42px rgba(20, 17, 14, 0.14);
        --sekme-golge: 0 10px 28px rgba(20, 17, 14, 0.12);
        --sayfa-zemin: #e2ddd4;
        color-scheme: light;
      }

      :root {
        --serif: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
        --sans: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --okuma: 'Newsreader', 'Iowan Old Style', Georgia, serif;
        --hale-1-rgb: 54, 108, 86;
        --hale-2-rgb: 172, 126, 62;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--sayfa-zemin);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow-x: clip;
      }

      /* Önizleme üst çubuğu */
      .onizleme-ust {
        position: sticky;
        top: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 18px;
        background: var(--tab-bg);
        border-bottom: 1px solid var(--border);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
      }
      .onizleme-ust .baslik-grup { display: flex; flex-direction: column; gap: 1px; }
      .onizleme-ust .ust-not { font: 600 12px/1.2 var(--sans); color: var(--pirinc); }
      .onizleme-ust strong { font: 500 18px/1.15 var(--serif); letter-spacing: -0.01em; }
      .tema-kabi {
        display: inline-flex;
        padding: 3px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
      }
      .tema-kabi button {
        min-height: 36px;
        min-width: 64px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        font: 600 12.5px/1 var(--sans);
        cursor: pointer;
      }
      .tema-kabi button[aria-pressed='true'] { background: var(--ink); color: var(--bg); }

      .sahne { display: flex; justify-content: center; padding: 24px 0 48px; }

      .telefon {
        position: relative;
        width: 390px;
        min-height: 844px;
        background-color: var(--bg);
        background-image: var(--doku);
        background-size: 3px 3px;
        border-radius: 40px;
        border: 1px solid var(--border);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
        overflow-x: clip;
        isolation: isolate;
      }

      html.cek-kipi, html.cek-kipi body { background: var(--bg); }
      html.cek-kipi .onizleme-ust { display: none; }
      html.cek-kipi .sahne { padding: 0; display: block; }
      html.cek-kipi .telefon { border-radius: 0; border: 0; box-shadow: none; width: 390px; }
      html.cek-kipi .alt-cubuk-sar { position: relative; }

      /* Üç katmanlı zemin */
      .zemin-hale {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        mix-blend-mode: var(--hale-karisim);
        background:
          radial-gradient(ellipse 320px 340px at 14% 10%, rgba(var(--hale-1-rgb), var(--hale-1-op)), transparent 72%),
          radial-gradient(ellipse 280px 320px at 88% 72%, rgba(var(--hale-2-rgb), var(--hale-2-op)), transparent 74%);
        transition: opacity 0.55s ease;
      }
      .zemin-desen {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background-color: var(--ink);
        opacity: var(--desen-opaklik);
        -webkit-mask-image: var(--desen-url);
        mask-image: var(--desen-url);
        -webkit-mask-size: 96px 96px;
        mask-size: 96px 96px;
        -webkit-mask-repeat: repeat;
        mask-repeat: repeat;
        transition: opacity 0.45s ease;
      }

      .icerik { position: relative; z-index: 1; padding-bottom: 92px; }

      /* iOS durum çubuğu & Galeri üst */
      .durum-cubugu {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 26px 6px;
        font: 600 14px/1 var(--sans);
        color: var(--ink);
      }
      .durum-simgeler { display: flex; align-items: center; gap: 6px; }

      .galeri-ust {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 24px 10px;
      }
      .galeri-ust h1 {
        margin: 0;
        font: 500 28px/1.05 var(--serif);
        letter-spacing: -0.015em;
        color: var(--ink);
      }
      .arama-hapi {
        flex: 1;
        min-width: 0;
        height: 44px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        color: var(--ink-2);
        font: 400 14px/1 var(--sans);
        text-align: left;
        cursor: pointer;
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
      }
      .arama-hapi span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .kalp-dugme {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        color: var(--pirinc);
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      /* Bölüm sekmeleri */
      .bolum-kabi-sar { padding: 0 24px 8px; }
      .bolum-kabi {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        padding: 4px;
        border-radius: 999px;
        background: var(--tab-bg);
        border: 1px solid var(--border);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
      }
      .bolum-sekme {
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        font: 500 13.5px/1 var(--sans);
        cursor: pointer;
        padding: 0 4px;
      }
      .bolum-sekme.secili { background: var(--ink); color: var(--bg); font-weight: 600; }

      /* =====================================================================
         YAPIŞKAN DÖNEM SEKMELERİ (BÖLÜM SEKMELERİNİN HEMEN ALTINDA, CAM ZEMİNLİ)
         ===================================================================== */
      .donem-cubuk {
        position: sticky;
        top: 57px;
        z-index: 25;
        background: var(--tab-bg);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
        border-bottom: 1px solid var(--border-ince);
        margin-bottom: 18px;
      }
      html.cek-kipi .donem-cubuk { top: 0; }
      .donem-serit {
        position: relative;
        display: flex;
        gap: 20px;
        overflow-x: auto;
        scrollbar-width: none;
        padding: 0 24px;
      }
      .donem-serit::-webkit-scrollbar { display: none; }
      .donem-sekme {
        flex: none;
        min-height: 44px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--ink-2);
        font: 500 14.5px/1 var(--sans);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        white-space: nowrap;
        transition: color 0.22s ease;
      }
      .donem-sekme small { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
      .donem-sekme.secili {
        color: var(--ink);
        font-weight: 600;
      }
      /* Kayarak geçen 2 px pirinç çizgi */
      .donem-cizgi {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 2px;
        background: var(--pirinc);
        border-radius: 2px;
        pointer-events: none;
        transition:
          transform 0.36s cubic-bezier(0.22, 1, 0.36, 1),
          width 0.36s cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* Sayfa gövdesi — dönem değişiminde yumuşak geçiş */
      .sayfa-govde {
        transition:
          opacity 0.26s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .sayfa-govde.gecis {
        opacity: 0;
        transform: translateY(10px);
      }

      /* Bölümler — az şey, çok boşluk */
      .bolum { padding: 0 24px; }
      .bolum-ara { margin-top: 38px; }
      .bolum-ust { margin-bottom: 16px; }
      .bolum-ust h2 {
        margin: 0 0 4px;
        font: 500 26px/1.12 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .bolum-ust p {
        margin: 0;
        font: 400 13.5px/1.35 var(--sans);
        color: var(--ink-2);
      }

      /* =====================================================================
         BÖLÜM 1: 16:10 CANLI MERCEK (İLK EKRANA FERAHÇA SIĞAR)
         ===================================================================== */
      .mercek-tuval {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 10;
        border-radius: 24px;
        overflow: hidden;
        background: #0e0d0c;
        box-shadow: var(--kart-golge);
        cursor: pointer;
      }
      .mercek-resim {
        position: absolute;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
        transition:
          width 0.85s cubic-bezier(0.22, 1, 0.36, 1),
          height 0.85s cubic-bezier(0.22, 1, 0.36, 1),
          left 0.85s cubic-bezier(0.22, 1, 0.36, 1),
          top 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .mercek-nisan {
        position: absolute;
        inset: 16px;
        pointer-events: none;
        opacity: 0.54;
        transition: opacity 0.35s ease;
      }
      .mercek-tuval.tam-kip .mercek-nisan { opacity: 0; }
      .mercek-nisan span {
        position: absolute;
        width: 12px;
        height: 12px;
        border-color: rgba(235, 229, 218, 0.65);
        border-style: solid;
      }
      .mercek-nisan .k1 { top: 0; left: 0; border-width: 1.5px 0 0 1.5px; border-top-left-radius: 3px; }
      .mercek-nisan .k2 { top: 0; right: 0; border-width: 1.5px 1.5px 0 0; border-top-right-radius: 3px; }
      .mercek-nisan .k3 { bottom: 0; left: 0; border-width: 0 0 1.5px 1.5px; border-bottom-left-radius: 3px; }
      .mercek-nisan .k4 { bottom: 0; right: 0; border-width: 0 1.5px 1.5px 0; border-bottom-right-radius: 3px; }

      .mercek-katman {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.45s ease 0.22s;
      }
      .mercek-tuval.tam-kip .mercek-katman {
        opacity: 1;
        pointer-events: auto;
      }
      .odak-cerceve {
        position: absolute;
        border: 1.5px solid rgba(235, 229, 218, 0.92);
        border-radius: 10px;
        box-shadow: 0 0 0 1px rgba(18, 17, 16, 0.55), 0 0 22px rgba(201, 164, 92, 0.34);
        pointer-events: none;
        transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .tablo-nokta {
        position: absolute;
        width: 44px;
        height: 44px;
        margin-left: -22px;
        margin-top: -22px;
        border: 0;
        background: transparent;
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
      }
      .tablo-nokta i {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: rgba(18, 17, 16, 0.78);
        border: 1.5px solid rgba(235, 229, 218, 0.9);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.48);
        transition: transform 0.25s ease, background 0.25s ease;
      }
      .tablo-nokta.aktif i {
        transform: scale(1.25);
        background: #c9a45c;
        border-color: #f7f5f1;
      }

      .tuval-alt-golge {
        position: absolute;
        inset: auto 0 0;
        height: 76px;
        background: linear-gradient(0deg, rgba(16, 15, 14, 0.66), transparent);
        pointer-events: none;
      }
      .uzaklas-dugme {
        position: absolute;
        right: 10px;
        bottom: 10px;
        min-height: 44px;
        padding: 0 13px;
        border-radius: 999px;
        background: rgba(20, 18, 16, 0.74);
        border: 1px solid rgba(235, 229, 218, 0.24);
        color: #f3eee4;
        font: 600 13px/1 var(--sans);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        -webkit-backdrop-filter: blur(20px) saturate(1.5);
        backdrop-filter: blur(20px) saturate(1.5);
      }
      .uzaklas-dugme:active { transform: scale(0.97); }
      .ayrinti-konum {
        position: absolute;
        left: 14px;
        bottom: 16px;
        font: 500 13px/1.2 var(--sans);
        color: rgba(243, 238, 228, 0.9);
        pointer-events: none;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.68);
      }

      /* Tablo altı: doğrudan zemin üstünde, kutusuz ve çizgisiz */
      .mercek-metin { padding: 16px 2px 0; }
      .mercek-soru {
        margin: 0 0 10px;
        font: 400 18px/1.42 var(--okuma);
        color: var(--ink);
      }
      .mercek-ad {
        margin: 0 0 3px;
        font: 500 28px/1.08 var(--serif);
        letter-spacing: -0.015em;
        color: var(--ink);
      }
      .mercek-kunye {
        margin: 0 0 16px;
        font: 400 13.5px/1.35 var(--sans);
        color: var(--ink-2);
      }

      .ana-dugme {
        width: 100%;
        min-height: 52px;
        padding: 8px 20px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--bg);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        cursor: pointer;
        text-align: left;
      }
      .ana-dugme:active { transform: scale(0.99); }
      .ana-dugme-sol { display: flex; flex-direction: column; gap: 2px; }
      .ana-dugme-sol b { font: 600 15px/1.15 var(--sans); }
      .ana-dugme-sol span { font: 500 12.5px/1.2 var(--sans); opacity: 0.72; }

      /* =====================================================================
         BÖLÜM 2: "GÖZÜN HANGİSİNE TAKILDI?" — 4 BÜYÜK PENCERE (2×2)
         ===================================================================== */
      .pencere-izgara {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .pencere-kart {
        padding: 0;
        border: 0;
        background: transparent;
        text-align: left;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .pencere-kart:active .pencere-kirpim { transform: scale(0.98); }
      .pencere-kirpim {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 20px;
        overflow: hidden;
        background: var(--surface);
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.22);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      :root[data-tema='gunduz'] .pencere-kirpim {
        box-shadow: 0 10px 22px rgba(20, 17, 14, 0.11);
      }
      .pencere-kart.secili .pencere-kirpim {
        box-shadow: 0 0 0 2px var(--pirinc), 0 14px 28px rgba(0, 0, 0, 0.28);
      }
      .pencere-kirpim img { position: absolute; display: block; }
      .pencere-ad {
        font: 500 15.5px/1.2 var(--okuma);
        color: var(--ink);
        padding: 0 2px;
      }
      .pencere-kart.secili .pencere-ad { color: var(--pirinc); }

      /* =====================================================================
         BÖLÜM 3: BU DÖNEMİN BAŞYAPITLARI — ŞERİT + AÇILAN DİZİN
         ===================================================================== */
      .eser-serit {
        display: flex;
        gap: 14px;
        overflow-x: auto;
        scroll-snap-type: x proximity;
        scroll-padding-left: 24px;
        scrollbar-width: none;
        padding: 2px 24px 8px;
        margin: 0 -24px;
      }
      .eser-serit::-webkit-scrollbar { display: none; }
      .serit-kart {
        flex: none;
        width: 152px;
        padding: 0;
        border: 0;
        background: transparent;
        text-align: left;
        cursor: pointer;
        scroll-snap-align: start;
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }
      .serit-cerceve {
        display: block;
        position: relative;
        width: 152px;
        height: 190px;
        border-radius: 16px;
        overflow: hidden;
        background: var(--surface);
        margin-bottom: 9px;
      }
      .serit-cerceve img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .serit-rozetler {
        position: absolute;
        left: 8px;
        bottom: 8px;
        display: inline-flex;
        gap: 4px;
      }
      .ikon-rozet {
        width: 24px;
        height: 24px;
        border-radius: 999px;
        background: rgba(18, 17, 16, 0.72);
        color: #c9a45c;
        display: grid;
        place-items: center;
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
      }
      .serit-ad {
        font: 500 16px/1.22 var(--okuma);
        color: var(--ink);
        margin-bottom: 2px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .serit-alt {
        font: 400 12.5px/1.3 var(--sans);
        color: var(--ink-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Tek satırlık açılır "Bütün başyapıtlar · N" */
      .dizin-acici {
        width: 100%;
        min-height: 48px;
        margin-top: 20px;
        padding: 0 2px;
        border: 0;
        border-top: 1px solid var(--border-ince);
        background: transparent;
        color: var(--ink);
        font: 500 14.5px/1 var(--sans);
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
      }
      .dizin-acici span { color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; }
      .dizin-acici svg { transition: transform 0.25s ease; }
      .dizin-acici[aria-expanded='true'] svg { transform: rotate(180deg); }

      .dizin-panel {
        display: none;

      function kirpim(n, oran, kutu, { pay = 1.15, enCok = 4.2 } = {}) {
        const r = oran > 0 ? oran : 1;
        const k = kutu > 0 ? kutu : 1;
        const sinir = (v, alt, ust) => Math.min(ust, Math.max(alt, v));
        const doldur = Math.max(1, 1 / (r * k));
        const sigdir = Math.min(1 / (Math.max(n.w, 0.01) * pay), 1 / (Math.max(n.h, 0.01) * r * k * pay));
        const w = Math.max(doldur, Math.min(sigdir, Math.max(doldur, enCok)));
        const h = w * r * k;
        return {
          w: Math.round(w * 10000) / 100,
          h: Math.round(h * 10000) / 100,
          l: Math.round(sinir(0.5 - (n.x + n.w / 2) * w, 1 - w, 0) * 10000) / 100,
          t: Math.round(sinir(0.5 - (n.y + n.h / 2) * h, 1 - h, 0) * 10000) / 100,
        };
      }

      function tamYerlesim(oran, kutu) {
        const imgAspect = 1 / oran;
        if (imgAspect > kutu) {
          const w = 100;
          const h = (kutu / imgAspect) * 100;
          return { w, h, l: 0, t: (100 - h) / 2 };
        }
        const h = 100;
        const w = (imgAspect / kutu) * 100;
        return { w, h, l: (100 - w) / 2, t: 0 };
      }

      const KUTU_ORANI = 16 / 10;
      const HEPSI_PENCERE_IDLER = ['nedimeler', 'arnolfini', 'salincak', 'yildizligece'];

      const durum = {
        donem: '',
        aktifEserId: 'elciler',
        aktifNokta: 0,
        tamKip: false,
        dizinAcik: false,
      };

      const elTuval = document.getElementById('mercekTuval');
      const elImg = document.getElementById('mercekImg');
      const elKatman = document.getElementById('mercekKatman');
      const elGovde = document.getElementById('sayfaGovde');

      const eserBul = (id) => ESERLER.find((e) => e.id === id) || ESERLER[0];

      // Seçili döneme göre: 1 hero + 4 pencere + kalan şerit (0 tekrar!)
      function donemDagit(donemId) {
        if (!donemId) {
          const hero = eserBul('elciler');
          const pencereler = HEPSI_PENCERE_IDLER.map((id) => {
            const e = eserBul(id);
            return { e, noktaIdx: e.oneNokta || 0 };
          });
          const kullanilan = new Set([hero.id, ...HEPSI_PENCERE_IDLER]);
          // Şeritte farklı dönemlerden zengin bir seçki (tümü benzersiz)
          const seritSira = ['judith', 'medusa', 'incikupeli', 'sutcu', 'agit', 'venus', 'monalisa', 'gezgin', 'izlenim', 'dalga', 'opucuk', 'ciglik', 'matta', 'musrifogul', 'gecedevriyesi', 'caravaggio-judith', 'muneccimler', 'uzunboyunlu', 'arkadya', 'marat', 'basak'];
          const serit = seritSira.filter((id) => !kullanilan.has(id)).map(eserBul);
          return { hero, pencereler, serit, tumu: ESERLER };
        }

        const havuz = ESERLER.filter((e) => e.donem === donemId);
        const hero = havuz[0] || ESERLER[0];
        const diger = havuz.slice(1);

        // 4 pencere: mümkün olduğunca farklı eserlerden; dönem az örnekliyse aynı dönemin diğer ayrıntılarından
        const pencereler = [];
        for (const e of diger.slice(0, 4)) {
          pencereler.push({ e, noktaIdx: e.oneNokta || 0 });
        }
        if (pencereler.length < 4) {
          for (const e of havuz) {
            for (let i = 0; i < e.noktalar.length && pencereler.length < 4; i++) {
              if (e.id === hero.id && i === (hero.oneNokta || 0)) continue;
              if (pencereler.some((p) => p.e.id === e.id && p.noktaIdx === i)) continue;
              pencereler.push({ e, noktaIdx: i });
            }
          }
        }

        // Şerit: hero + pencerelerde hiç görünmeyen kalan eserler (hiç yoksa dönemin geri kalanı)
        const pencereEserIds = new Set([hero.id, ...pencereler.map((p) => p.e.id)]);
        const kalan = havuz.filter((e) => !pencereEserIds.has(e.id));
        const serit = kalan.length ? kalan : (diger.length ? diger : havuz);
        return { hero, pencereler, serit, tumu: havuz };
      }

      function zeminGuncelle(donem, hale) {
        document.documentElement.dataset.donem = donem;
        document.getElementById('zeminDesen').style.setProperty('--desen-url', `url('../../NoraSanat/Ekranlar/Galeri/Desenler/desen-${donem}@3x.png')`);
        if (hale) {
          document.documentElement.style.setProperty('--hale-1-rgb', hale[0]);
          document.documentElement.style.setProperty('--hale-2-rgb', hale[1]);
        }
      }

      function cizgiKonumla(anlik = false) {
        const serit = document.getElementById('donemSerit');
        const cizgi = document.getElementById('donemCizgi');
        const secili = serit.querySelector('.donem-sekme.secili');
        if (!secili || !cizgi) return;
        if (anlik) cizgi.style.transition = 'none';
        cizgi.style.width = `${secili.offsetWidth}px`;
        cizgi.style.transform = `translateX(${secili.offsetLeft}px)`;
        if (anlik) {
          cizgi.offsetHeight; // reflow
          cizgi.style.transition = '';
        }
      }

      function donemleriCiz(anlik = false) {
        const serit = document.getElementById('donemSerit');
        serit.innerHTML =
          DONEMLER.map((d) => `<button type="button" class="donem-sekme${durum.donem === d.id ? ' secili' : ''}" data-donem-id="${d.id}"><span>${d.ad}</span><small>${d.toplam}</small></button>`).join('') +
          `<span class="donem-cizgi" id="donemCizgi" aria-hidden="true"></span>`;
        const aktif = serit.querySelector('.donem-sekme.secili');
        if (aktif && !anlik) {
          serit.scrollTo({ left: Math.max(0, aktif.offsetLeft - 64), behavior: 'smooth' });
        } else if (aktif && anlik) {
          serit.scrollLeft = Math.max(0, aktif.offsetLeft - 64);
        }
        cizgiKonumla(anlik);
      }

      function mercekCiz() {
        const e = eserBul(durum.aktifEserId);
        const n = e.noktalar[durum.aktifNokta] || e.noktalar[0];
        zeminGuncelle(e.donem, e.hale);

        elImg.src = e.img;
        elImg.alt = `${e.baslik} — ${n.ad}`;

        const yer = durum.tamKip
          ? tamYerlesim(e.oran, KUTU_ORANI)
          : kirpim(n, e.oran, KUTU_ORANI, { pay: 1.15, enCok: 4.2 });

        elImg.style.width = `${yer.w}%`;
        elImg.style.height = `${yer.h}%`;
        elImg.style.left = `${yer.l}%`;
        elImg.style.top = `${yer.t}%`;

        elTuval.classList.toggle('tam-kip', durum.tamKip);
        document.getElementById('ayrintiKonum').textContent = n.ad;
        document.getElementById('uzaklasYazi').textContent = durum.tamKip ? 'Ayrıntıya yakınlaş' : 'Tabloya uzaklaş';

        document.getElementById('mercekSoru').textContent =
          !durum.tamKip && durum.aktifNokta === (e.oneNokta || 0) ? e.soru : n.metin;
        document.getElementById('mercekAd').textContent = e.baslik;
        document.getElementById('mercekKunye').textContent = `${e.sanatci} · ${e.yil}`;

        const parcalar = [];
        if (e.hikaye) parcalar.push('Hikâye');
        parcalar.push(`${e.noktalar.length} ayrıntı`);
        parcalar.push(`~${e.ykDk} dk`);
        if (e.dersDk) parcalar.push(`+${e.dersDk} dk ders`);
        document.getElementById('mercekDugmeAlt').textContent = parcalar.join(' · ');

        const tam = tamYerlesim(e.oran, KUTU_ORANI);
        const fx = tam.l + n.x * tam.w;
        const fy = tam.t + n.y * tam.h;
        const fw = n.w * tam.w;
        const fh = n.h * tam.h;

        elKatman.innerHTML =
          `<div class="odak-cerceve" style="left:${fx}%;top:${fy}%;width:${fw}%;height:${fh}%"></div>` +
          e.noktalar.map((pt, i) => {
            const px = tam.l + (pt.x + pt.w / 2) * tam.w;
            const py = tam.t + (pt.y + pt.h / 2) * tam.h;
            return `<button type="button" class="tablo-nokta${i === durum.aktifNokta ? ' aktif' : ''}" data-nokta="${i}" style="left:${px}%;top:${py}%" aria-label="${pt.ad}"><i></i></button>`;
          }).join('');

        document.querySelectorAll('.pencere-kart').forEach((btn) => {
          btn.classList.toggle(
            'secili',
            btn.dataset.pencereId === durum.aktifEserId && Number(btn.dataset.pencereNokta) === durum.aktifNokta,
          );
        });
      }

      function sayfayiCiz() {
        const dBilgi = DONEMLER.find((x) => x.id === durum.donem) || DONEMLER[0];
        const { hero, pencereler, serit, tumu } = donemDagit(durum.donem);

        // Eğer aktif eser bu dönemde değilse dönemin öne çıkanına geç
        if (!tumu.some((x) => x.id === durum.aktifEserId)) {
          durum.aktifEserId = hero.id;
          durum.aktifNokta = hero.oneNokta || 0;
          durum.tamKip = false;
        }

        // 4 büyük pencere
        document.getElementById('pencereAlt').textContent = durum.donem
          ? `${dBilgi.ad} ayrıntılarından birine dokun.`
          : 'Bir ayrıntıya dokun, tablosuna açılsın.';

        document.getElementById('pencereIzgara').innerHTML = pencereler.map(({ e, noktaIdx }) => {
          const n = e.noktalar[noktaIdx] || e.noktalar[0];
          const k = kirpim(n, e.oran, 1, { pay: 1.45, enCok: 3.6 });
          return `<button type="button" class="pencere-kart" data-pencere-id="${e.id}" data-pencere-nokta="${noktaIdx}">
            <span class="pencere-kirpim">
              <img src="${e.img}" alt="${n.ad}" style="width:${k.w}%;height:${k.h}%;left:${k.l}%;top:${k.t}%" />
            </span>
            <span class="pencere-ad">${n.ad}</span>
          </button>`;
        }).join('');

        // Bu dönemin başyapıtları şeridi
        document.getElementById('seritAlt').textContent = durum.donem
          ? `${dBilgi.ad} · ${dBilgi.yuzyil} · ${dBilgi.toplam} eser`
          : '264 eser · 9 dönem';

        document.getElementById('eserSerit').innerHTML = serit.map((e) => `
          <button type="button" class="serit-kart" data-ac="${e.id}">
            <span class="serit-cerceve">
              <img src="${e.img}" alt="${e.baslik}" />
              <span class="serit-rozetler" aria-hidden="true">
                ${e.hikaye ? `<span class="ikon-rozet" title="Hikâye"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>` : ''}
                <span class="ikon-rozet" title="${e.noktalar.length} ayrıntı"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg></span>
              </span>
            </span>
            <div class="serit-ad">${e.baslik}</div>
            <div class="serit-alt">${e.sanatci} · ${e.yil}</div>
          </button>
        `).join('');
        document.getElementById('eserSerit').scrollLeft = 0;

        // Açılır dizin başlığı ve sayısı
        document.getElementById('dizinBaslik').textContent = durum.donem ? `${dBilgi.ad} başyapıtları` : 'Bütün başyapıtlar';
        document.getElementById('dizinSayi').textContent = `${dBilgi.toplam} eser`;
        dizinCiz(tumu);

        mercekCiz();
      }

      function dizinCiz(havuzOpt) {
        const panel = document.getElementById('dizinPanel');
        panel.classList.toggle('acik', durum.dizinAcik);
        document.getElementById('dizinAcici').setAttribute('aria-expanded', String(durum.dizinAcik));
        if (!durum.dizinAcik) {
          panel.innerHTML = '';
          return;
        }
        const havuz = havuzOpt || (durum.donem ? ESERLER.filter((e) => e.donem === durum.donem) : ESERLER);
        panel.innerHTML = havuz.map((e) => `
          <button type="button" class="dizin-satir" data-ac="${e.id}">
            <span class="dizin-kare"><img src="${e.img}" alt="${e.baslik}" /></span>
            <span class="dizin-orta">
              <b>${e.baslik}</b>
              <span>${e.sanatci} · ${e.yil}</span>
            </span>
            <span class="dizin-sag${e.hikaye ? ' pirinc' : ''}">${e.hikaye ? 'Hikâye' : `${e.noktalar.length} ayrıntı`}</span>
          </button>
        `).join('');
      }

      function donemeGec(yeniDonem, animasyonlu = true) {
        if (durum.donem === yeniDonem && animasyonlu) return;
        durum.donem = yeniDonem;
        const { hero } = donemDagit(yeniDonem);
        durum.aktifEserId = hero.id;
        durum.aktifNokta = hero.oneNokta || 0;
        durum.tamKip = false;

        // Sekme vurgusu ve pirinç çizgi hareketi
        const serit = document.getElementById('donemSerit');
        serit.querySelectorAll('.donem-sekme').forEach((b) => b.classList.toggle('secili', b.dataset.donemId === yeniDonem));
        const aktif = serit.querySelector('.donem-sekme.secili');
        if (aktif) serit.scrollTo({ left: Math.max(0, aktif.offsetLeft - 64), behavior: animasyonlu ? 'smooth' : 'auto' });
        cizgiKonumla(!animasyonlu);

        if (!animasyonlu) {
          sayfayiCiz();
          return;
        }

        // İçerik yumuşakça solarak yenilenir
        elGovde.classList.add('gecis');
        setTimeout(() => {
          sayfayiCiz();
          requestAnimationFrame(() => elGovde.classList.remove('gecis'));
        }, 180);
      }

      function cekmeceAc(id) {
        const e = eserBul(id);
        document.getElementById('cekmeceResim').src = e.img;
        document.getElementById('cekmeceResim').alt = e.baslik;
        document.getElementById('cekmeceUst').textContent = `${e.akim} · ${e.hikaye ? 'Hikâye · ' : ''}${e.noktalar.length} ayrıntı · ~${e.ykDk} dk${e.dersDk ? ` · +${e.dersDk} dk ders` : ''}`;
        document.getElementById('cekmeceBaslik').textContent = e.baslik;
        document.getElementById('cekmeceMeta').textContent = `${e.sanatci} · ${e.yil} · ${e.muze}`;
        document.getElementById('cekmeceOzet').textContent = e.ozet;
        document.getElementById('cekmecePerde').classList.add('acik');
      }

      // Etkileşimler
      document.getElementById('donemSerit').addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-donem-id]');
        if (b) donemeGec(b.dataset.donemId, true);
      });

      document.getElementById('uzaklasBtn').addEventListener('click', (ev) => {
        ev.stopPropagation();
        durum.tamKip = !durum.tamKip;
        mercekCiz();
      });

      elTuval.addEventListener('click', (ev) => {
        const pt = ev.target.closest('[data-nokta]');
        if (pt) {
          durum.aktifNokta = Number(pt.dataset.nokta);
          durum.tamKip = false;
          mercekCiz();
          return;
        }
        if (ev.target.closest('#uzaklasBtn')) return;
        durum.tamKip = !durum.tamKip;
        mercekCiz();
      });

      document.getElementById('pencereIzgara').addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-pencere-id]');
        if (!b) return;
        durum.aktifEserId = b.dataset.pencereId;
        durum.aktifNokta = Number(b.dataset.pencereNokta || 0);
        durum.tamKip = false;
        mercekCiz();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      document.getElementById('eserSerit').addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-ac]');
        if (b) cekmeceAc(b.dataset.ac);
      });

      document.getElementById('dizinAcici').addEventListener('click', () => {
        durum.dizinAcik = !durum.dizinAcik;
        dizinCiz();
      });

      document.getElementById('dizinPanel').addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-ac]');
        if (b) cekmeceAc(b.dataset.ac);
      });

      document.getElementById('mercekAcBtn').addEventListener('click', () => cekmeceAc(durum.aktifEserId));
      document.getElementById('cekmeceKapat').addEventListener('click', () => document.getElementById('cekmecePerde').classList.remove('acik'));
      document.getElementById('cekmecePerde').addEventListener('click', (ev) => {
        if (ev.target.id === 'cekmecePerde') ev.target.classList.remove('acik');
      });

      function temaAyarla(t) {
        document.documentElement.dataset.tema = t;
        document.querySelectorAll('[data-tema-sec]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.temaSec === t)));
      }
      document.querySelectorAll('[data-tema-sec]').forEach((b) => b.addEventListener('click', () => temaAyarla(b.dataset.temaSec)));

      const p = new URLSearchParams(location.search);
      if (p.get('tema') === 'gunduz') temaAyarla('gunduz');
      if (p.get('cek') === '1') document.documentElement.classList.add('cek-kipi');
      const basDonem = p.get('donem') || '';
      if (basDonem && DONEMLER.some((d) => d.id === basDonem)) {
        durum.donem = basDonem;
        const { hero } = donemDagit(basDonem);
        durum.aktifEserId = hero.id;
        durum.aktifNokta = hero.oneNokta || 0;
      }
      if (p.get('tam') === '1') durum.tamKip = true;

      donemleriCiz(true);
      sayfayiCiz();
      window.addEventListener('resize', () => cizgiKonumla(true));
      document.fonts && document.fonts.ready.then(() => cizgiKonumla(true));
    </script>
  </body>
</html>
