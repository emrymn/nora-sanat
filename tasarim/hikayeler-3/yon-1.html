<!DOCTYPE html>
<html lang="tr" data-tema="gece">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nora Sanat · Yön 1 — Klasik Dergi</title>
<link rel="stylesheet" href="ortak.css">
<style>
/* ===== YÖN 1 · KLASİK DERGİ (Editoryal Kültür Dergisi) ===== */

/* Ana ekran üst bar (sade başlık + tek büyüteç + sağ üst Ben) */
.dergi-ust {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: 54px 16px 14px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg);
  border-bottom: 1px solid var(--notr-kenar);
}
.dergi-ad {
  font-family: var(--serif);
  font-size: 30px;
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1;
  margin: 0;
}
.dergi-ust-sag {
  display: flex;
  align-items: center;
  gap: 8px;
}

.dergi-akis {
  padding: 20px 22px 116px;
}

/* Dergi yazı maddesi (alt alta sade akış, kategori/çip yok) */
.yazi-oge {
  display: block;
  width: 100%;
  border: 0;
  background: transparent;
  padding: 0 0 32px;
  margin: 0 0 32px;
  border-bottom: 1px solid var(--notr-kenar);
  text-align: left;
  color: var(--ink);
  cursor: pointer;
}
.yazi-oge:last-child { border-bottom: 0; margin-bottom: 0; }

.yazi-kapak-kutu {
  border-radius: 14px;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--notr-kenar);
  margin-bottom: 16px;
}
.yazi-kapak-kutu img {
  width: 100%;
  aspect-ratio: 16 / 10;
  object-fit: cover;
  object-position: center 22%;
  display: block;
}
.yazi-oge.ilk .yazi-kapak-kutu img {
  aspect-ratio: 4 / 3;
}

.yazi-ust-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
}
.yazi-sanatci {
  font-size: 13px;
  font-weight: 600;
  color: var(--pirinc);
}
.yazi-durum {
  font-size: 12px;
  font-weight: 600;
  color: var(--pirinc);
}
.yazi-durum.biten { color: var(--right); }
.yazi-baslik {
  font-family: var(--serif);
  font-size: 27px;
  font-weight: 500;
  line-height: 1.14;
  letter-spacing: -0.015em;
  margin: 0 0 8px;
  color: var(--ink);
}
.yazi-oge.ilk .yazi-baslik {
  font-size: 31px;
}
.yazi-alt {
  font-family: var(--okuma);
  font-size: 16px;
  line-height: 1.5;
  color: var(--ink-2);
  margin: 0 0 12px;
}
.yazi-sure {
  font-size: 12.5px;
  color: var(--ink-3);
}
.yazi-iz {
  margin-top: 12px;
}

/* Okuma ekranı: Klasik dergi makalesi */
.makale-ic {
  padding: 106px 24px 120px;
}
.makale-bas {
  text-align: center;
  margin-bottom: 24px;
}
.makale-baslik {
  font-family: var(--serif);
  font-size: 33px;
  font-weight: 500;
  line-height: 1.1;
  letter-spacing: -0.015em;
  margin: 8px 0 12px;
  color: var(--ink);
}
.makale-alt {
  font-family: var(--okuma);
  font-style: italic;
  font-size: 17px;
  line-height: 1.52;
  color: var(--ink-2);
  margin: 0 0 16px;
}
.makale-meta-satir {
  font-size: 13px;
  color: var(--ink-3);
  margin-bottom: 18px;
}
.makale-dinle-sar {
  display: flex;
  justify-content: center;
  margin-bottom: 26px;
}
.makale-kapak {
  margin: 0 0 28px;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--notr-kenar);
  background: var(--surface);
}
.makale-kapak img {
  width: 100%;
  height: auto;
  display: block;
}

/* İlk paragrafta dergi baş harfi (drop cap) */
.p-blok.ilk-p::first-letter {
  font-family: var(--serif);
  float: left;
  font-size: 54px;
  line-height: 0.86;
  padding: 5px 9px 0 0;
  color: var(--pirinc);
  font-weight: 500;
}

.bolum-ayrac {
  margin: 40px 0 16px;
  padding-top: 24px;
  border-top: 1px solid var(--notr-kenar);
}
.bolum-baslik {
  font-family: var(--serif);
  font-size: 25px;
  font-weight: 500;
  line-height: 1.18;
  letter-spacing: -0.01em;
  margin: 5px 0 0;
  color: var(--ink);
}
.eser-fig .eser-kutu {
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--notr-kenar);
  background: var(--surface);
}
</style>
</head>
<body class="vitrin-mod">

<div class="vitrin-bar">
  <span class="vitrin-etiket">Yön 1 · Klasik Dergi</span>
  <div class="vitrin-grup">
    <button class="vitrin-btn aktif" data-ekran="ana">Ana ekran</button>
    <button class="vitrin-btn" data-ekran="okuma-basi">Okuma (başı)</button>
    <button class="vitrin-btn" data-ekran="okuma-eser">Okuma (eser)</button>
    <button class="vitrin-btn" data-ekran="dinleme">Dinleme</button>
    <button class="vitrin-btn" data-ekran="son">Yazının sonu</button>
    <button class="vitrin-btn" data-ekran="mini">Küçük çalar</button>
  </div>
  <div class="vitrin-grup">
    <button class="vitrin-btn aktif" data-tema-sec="gece">Gece</button>
    <button class="vitrin-btn" data-tema-sec="gunduz">Gündüz</button>
  </div>
</div>

<div class="telefon">
  <div class="zemin-katman">
    <div class="zemin-doku"></div>
    <div class="zemin-hale"></div>
    <div class="zemin-desen" id="zemin-desen"></div>
  </div>

  <div class="durum-cubugu">
    <span>9:41</span>
    <div class="durum-simgeler">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0M4.2 7a5.6 5.6 0 0 1 7.6 0"/><circle cx="8" cy="10.2" r="1.2" fill="currentColor" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.8" y="1" width="20.5" height="10" rx="2.6" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/><rect x="2.6" y="2.8" width="15.5" height="6.4" rx="1.4" fill="currentColor"/><path d="M23 4.2v3.6" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
  </div>

  <!-- 1. ANA EKRAN: DERGİ AKIŞI -->
  <section class="ekran acik" id="ekran-ana" aria-label="Hikâyeler akışı">
    <div class="kaydir" id="ana-kaydir">
      <header class="dergi-ust">
        <h1 class="dergi-ad">Hikâyeler</h1>
        <div class="dergi-ust-sag">
          <button class="btn-cam kare" id="btn-ara-ac" aria-label="Ara"></button>
          <button class="btn-cam kare" id="btn-ben-ust" aria-label="Ben"></button>
        </div>
      </header>
      <div class="dergi-akis" id="dergi-akis"></div>
    </div>

    <!-- Yön 1 Sekme Çubuğu: 5 ferah sekme altta + Ben sağ üstte -->
    <nav class="sekme-sarici" aria-label="Ana gezinme">
      <div class="sekme-cubuk" id="sekme-ana"></div>
    </nav>
  </section>

  <!-- 2. OKUMA + OKUMA İÇİ DİNLEME + YAZININ SONU -->
  <section class="ekran" id="ekran-okuma" aria-label="Hikâye okuma">
    <div class="okuma-ust" id="okuma-ust">
      <button class="btn-cam kare" id="btn-geri" aria-label="Yazılara dön"></button>
      <div class="okuma-ust-ad" id="okuma-ust-ad"></div>
      <button class="btn-cam kare" id="btn-ust-dinle" aria-label="Dinle"></button>
    </div>

    <div class="kaydir" id="okuma-kaydir">
      <article class="makale-ic" id="makale-ic"></article>
    </div>

    <!-- Okuma İçi İnce Fola Çalar Çubuğu -->
    <div class="ic-calar" id="ic-calar" aria-label="Fola ses çaları">

        <span class="ic-calar-bolum" id="ic-calar-bolum"></span>
        <span class="ic-calar-sure" id="ic-calar-sure">6:14 / 23:00</span>
      </div>
      <div class="ic-calar-alt">
        <button class="c-btn" id="c-hiz">1×</button>

        <button class="c-btn oynat" id="c-oynat" aria-label="Oynat veya duraklat"></button>

  <!-- 3. BAŞKA SEKMDE KÜÇÜK ÇALAR (Galeri üstünde) -->
  <section class="ekran" id="ekran-mini" aria-label="Galeri ve küçük çalar">
    <div class="diger-sahne">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div class="ust-yazi">Koleksiyon ve başyapıtlar</div>
          <h2 style="font-family:var(--serif);font-size:32px;font-weight:500;margin:4px 0 0;">Galeri</h2>
        </div>
        <button class="btn-cam kare" id="btn-mini-ben" aria-label="Ben"></button>
      </div>
      <div class="diger-izgara" id="mini-izgara"></div>
    </div>

    <div class="mini-calar" id="mini-calar" role="button" tabindex="0">
      <div class="mini-ust">
        <img class="mini-kapak" id="mini-kapak" alt="">
        <div class="mini-metin">
          <div class="mini-baslik" id="mini-baslik"></div>
          <div class="mini-alt" id="mini-alt"></div>
        </div>
        <div class="mini-eylem">
          <button class="mini-btn oynat" id="mini-oynat" aria-label="Oynat veya duraklat"></button>
          <button class="mini-btn" id="mini-kapat" aria-label="Kapat"></button>
        </div>
      </div>
      <div class="mini-iz"><i id="mini-dol" style="width:28%"></i></div>
    </div>

    <nav class="sekme-sarici" aria-label="Ana gezinme">
      <div class="sekme-cubuk" id="sekme-mini"></div>
    </nav>
  </section>

  <!-- SADE ARAMA -->
  <div class="arama-katman" id="arama-katman">
    <div class="arama-satir-ust">
      <div class="arama-kutu">
        <span id="arama-ikon"></span>
        <input type="text" id="arama-giris" placeholder="Yazı veya sanatçı ara…">
      </div>
      <button class="btn-cam" id="btn-ara-kapat" style="padding:0 14px;">Vazgeç</button>
    </div>
    <div class="arama-liste" id="arama-liste"></div>
  </div>

  <div class="home-bar"></div>
</div>

<script src="hikaye-verisi.js"></script>
<script>
(() => {
  const B = window.NORA_BLOG;
  const YAZILAR = window.NORA_YAZILAR;

  let aktifYaziId = B.urlParam('yazi', 'rembrandt-van-rijn');
  let aktifTema = B.urlParam('tema', 'gece');
  let aktifGorunum = B.urlParam('ekran', 'ana');

  // Okuma içi dinleme durumu
  let dinlemeAcik = false;
  let oynuyor = false;
  let aktifPIdx = 3;
  let hizlar = [0.85, 1, 1.25, 1.5];
  let hizIdx = 1;
  let pListesi = [];
  let timer = null;

  function zeminGuncelle(y) {
    document.documentElement.style.setProperty('--hale-rgb', y.hale);
    document.getElementById('zemin-desen').style.backgroundImage = `url('../../NoraSanat/Ekranlar/Galeri/Desenler/${y.desen}')`;
  }

  function temaUygula(t) {
    aktifTema = t;
    document.documentElement.setAttribute('data-tema', t);
    document.querySelectorAll('[data-tema-sec]').forEach(b => b.classList.toggle('aktif', b.dataset.temaSec === t));
  }

  function sekmeCiz(elId, secili) {
    const sekmeler = [
      { id: 'bugun', ad: 'Bugün', ikon: 'bugun' },
      { id: 'hikayeler', ad: 'Hikâyeler', ikon: 'hikayeler' },
      { id: 'calis', ad: 'Çalış', ikon: 'calis' },
      { id: 'galeri', ad: 'Galeri', ikon: 'galeri' },
      { id: 'yolculuk', ad: 'Yolculuk', ikon: 'yolculuk' },
    ];
    const el = document.getElementById(elId);
    el.innerHTML = sekmeler.map(s => `
      <button class="sekme-oge ${s.id === secili ? 'secili' : ''}" data-s="${s.id}">
        ${B.svg(s.ikon, 21, s.id === secili ? 1.8 : 1.5)}
        <span>${s.ad}</span>
      </button>
    `).join('');
    el.querySelectorAll('.sekme-oge').forEach(b => {
      b.onclick = () => {
        if (b.dataset.s === 'hikayeler') gorunumAc('ana');
        else gorunumAc('mini');
      };
    });
  }

  // Ana ekran: sade alt alta dergi yazıları
  function anaCiz() {
    const akis = document.getElementById('dergi-akis');
    akis.innerHTML = YAZILAR.map((y, idx) => {
      const durumHtml = y.durum === 'yarim'
        ? `<span class="yazi-durum">${y.kalanDk} dk kaldı</span>`
        : y.durum === 'biten'
          ? `<span class="yazi-durum biten">Okundu</span>`
          : '';
      const izHtml = y.durum === 'yarim'
        ? `<div class="yazi-iz"><div class="cizgi-iz"><div class="cizgi-dol" style="width:${Math.round(y.ilerleme * 100)}%"></div></div></div>`
        : '';
      return `
        <button class="yazi-oge ${idx === 0 ? 'ilk' : ''}" data-id="${y.id}">
          <div class="yazi-kapak-kutu"><img src="${y.kapak}" alt="${y.sanatci}"></div>
          <div class="yazi-ust-meta">
            <span class="yazi-sanatci">${y.sanatci} · ${y.yillar}</span>
            ${durumHtml}
          </div>
          <h2 class="yazi-baslik">${y.baslik}</h2>
          <p class="yazi-alt">${y.altBaslik}</p>
          <div class="yazi-sure">${y.okumaDk} dk okuma · ${y.dinlemeDk} dk dinleme</div>
          ${izHtml}
        </button>
      `;
    }).join('');
    akis.querySelectorAll('.yazi-oge').forEach(btn => {
      btn.onclick = () => {
        aktifYaziId = btn.dataset.id;
        aktifPIdx = 2;
        dinlemeKapat();
        gorunumAc('okuma-basi');
      };
    });
  }

  // Okuma ekranı: tek sütun klasik dergi makalesi
  function makaleCiz() {
    const y = B.bul(aktifYaziId);
    zeminGuncelle(y);
    document.getElementById('okuma-ust-ad').textContent = y.sanatci;
    pListesi = B.paragraflar(y);

    let pSayac = 0;
    const paragrafHtml = (metin, ilkMi = false) => {
      const idx = pSayac++;
      // İlk cümleyi ince vurgu için işaretle
      const cumleler = metin.match(/[^.!?]+[.!?]+/g) || [metin];
      const islenmis = cumleler.map((c, ci) => `<span class="${ci === 0 ? 'cumle-aktif' : ''}">${c}</span>`).join(' ');
      return `<p class="p-blok ${ilkMi ? 'ilk-p' : ''}" data-pidx="${idx}">${islenmis}</p>`;
    };

    const girisHtml = y.giris.map((p, i) => paragrafHtml(p, i === 0)).join('');
    const bolHtml = y.bolumler.map(b => {
      const pVeEser = b.paragraflar.map((p, pi) => {
        let out = paragrafHtml(p);
        const es = b.eserler[pi];
        if (es) {
          out += `
            <figure class="eser-fig">
              <div class="eser-kutu"><img src="${es.gorsel}" alt="${es.ad}"></div>
              <figcaption class="eser-aciklama">
                <div class="eser-baslik-satir">
                  <span class="eser-tr-ad">${es.ad}</span>
                  <span class="eser-yil">${es.yil}</span>
                </div>
                ${es.muze ? `<div class="eser-muze">${es.muze}</div>` : ''}
                ${es.bag ? `<p class="eser-bag"><b>Bu dönemle bağı</b>${es.bag}</p>` : ''}
              </figcaption>
            </figure>
          `;
        }
        return out;
      }).join('');
      return `
        <div class="bolum-ayrac">
          <div class="ust-yazi">${b.yillar}</div>
          <h2 class="bolum-baslik">${b.baslik}</h2>
        </div>
        ${pVeEser}
      `;
    }).join('');

    const kapanisHtml = y.kapanis.map(p => paragrafHtml(p)).join('');

    const bagHtml = y.baglantili.map(b => `
      <button class="bag-kart" data-gec="${b.id}">
        <img src="${b.kapak}" alt="${b.sanatci}">
        <div class="bag-kart-ic">
          <div class="bag-kart-rol">${b.rol} · ${b.sanatci}</div>
          <div class="bag-kart-baslik">${b.baslik}</div>
          <div class="bag-kart-meta">${b.yillar} · ${b.okumaDk} dk okuma</div>
        </div>
      </button>
    `).join('');

    const kaynakHtml = (y.kaynaklar || []).slice(0, 5).map(k => `<li>${k.baslik}</li>`).join('');

    document.getElementById('makale-ic').innerHTML = `
      <div class="makale-bas">
        <div class="ust-yazi">${y.sanatci} · ${y.yillar}</div>
        <h1 class="makale-baslik">${y.baslik}</h1>
        <p class="makale-alt">${y.altBaslik}</p>
        <div class="makale-meta-satir">${y.okumaDk} dk okuma · ${y.dinlemeDk} dk dinleme</div>
        <div class="makale-dinle-sar">
          <button class="btn-dolu" id="btn-yazi-dinle">${B.svg('kulaklik', 17, 1.8)}<span>Dinle · ${y.dinlemeDk} dk</span></button>
        </div>
      </div>
      <div class="makale-kapak"><img src="${y.kapak}" alt="${y.sanatci}"></div>
      ${girisHtml}
      ${bolHtml}
      <div class="bolum-ayrac"><div class="ust-yazi">Kapanış</div></div>
      ${kapanisHtml}
      <section class="son-bolum" id="yazi-sonu">
        <h3 class="son-baslik">Bağlantılı yazılar</h3>
        <div class="bag-kart-liste">${bagHtml}</div>
        <div style="margin-top:34px;">
          <div class="ust-yazi">Kaynaklar</div>
          <ul class="kaynak-liste">${kaynakHtml}</ul>
        </div>
      </section>
    `;

    document.getElementById('btn-yazi-dinle').onclick = () => dinlemeAc(true);
    document.querySelectorAll('[data-gec]').forEach(btn => {
      btn.onclick = () => {
        aktifYaziId = btn.dataset.gec;
        aktifPIdx = 2;
        dinlemeKapat();
        gorunumAc('okuma-basi');
      };
    });
    // Herhangi bir paragrafa tıklayıp o paragraftan dinlemeye geçebilme
    document.querySelectorAll('.p-blok').forEach(p => {
      p.onclick = () => {
        if (!dinlemeAcik) return;
        aktifPIdx = Number(p.dataset.pidx);
        dinlemeDurumCiz(true);
      };
    });

    const kay = document.getElementById('okuma-kaydir');
    const ust = document.getElementById('okuma-ust');
    kay.onscroll = () => ust.classList.toggle('yapiskan', kay.scrollTop > 130);
    miniVeriGuncelle();
  }

  function dinlemeDurumCiz(kaydirilsin = false) {
    const y = B.bul(aktifYaziId);
    const ic = document.getElementById('makale-ic');
    const bar = document.getElementById('ic-calar');
    ic.classList.toggle('dinleme-acik', dinlemeAcik);
    bar.classList.toggle('gorunur', dinlemeAcik);

    // Tek dolu düğme kuralı: dinleme çubuğu açıkken oynat düğmesi dolu, yazı başındaki düğme cam olur
    const basDinle = document.getElementById('btn-yazi-dinle');
    if (basDinle) {
      basDinle.className = dinlemeAcik ? 'btn-cam' : 'btn-dolu';
      basDinle.innerHTML = `${B.svg('kulaklik', 17, 1.8)}<span>${dinlemeAcik ? 'Dinleniyor' : `Dinle · ${y.dinlemeDk} dk`}</span>`;
    }

    document.querySelectorAll('.p-blok').forEach(el => {
      el.classList.toggle('okunan', dinlemeAcik && Number(el.dataset.pidx) === aktifPIdx);
    });

    const aktifP = pListesi[aktifPIdx] || pListesi[0];
    const oran = Math.min(98, Math.max(6, Math.round(((aktifPIdx + 1) / Math.max(1, pListesi.length)) * 100)));
    const topSn = y.dinlemeDk * 60;
    const gecen = Math.round(topSn * oran / 100);
    document.getElementById('ic-calar-bolum').textContent = aktifP ? aktifP.bolum : y.baslik;
    document.getElementById('ic-calar-sure').textContent = `${B.formatDk(gecen)} / ${B.formatDk(topSn)}`;
    document.getElementById('ic-calar-dol').style.width = `${oran}%`;
    document.getElementById('c-oynat').innerHTML = B.svg(oynuyor ? 'duraklat' : 'oynat', 19, 1.8);
    document.getElementById('mini-oynat').innerHTML = B.svg(oynuyor ? 'duraklat' : 'oynat', 18, 1.8);

    if (dinlemeAcik && kaydirilsin) {
      const hedef = document.querySelector(`.p-blok[data-pidx="${aktifPIdx}"]`);
      const kap = document.getElementById('okuma-kaydir');
      if (hedef && kap) {
        const rel = hedef.getBoundingClientRect().top - kap.getBoundingClientRect().top + kap.scrollTop;
        kap.scrollTop = Math.max(0, rel - 220);
      }
    }
    miniVeriGuncelle();
  }

  function dinlemeAc(oynatBaslat = false) {
    dinlemeAcik = true;
    if (oynatBaslat) oynuyor = true;
    dinlemeDurumCiz(true);
    if (oynuyor) zamanlayiciKur();
  }

  function dinlemeKapat() {
    dinlemeAcik = false;
    oynuyor = false;
    clearInterval(timer);
    dinlemeDurumCiz(false);
  }

  function zamanlayiciKur() {
    clearInterval(timer);
    if (!oynuyor) return;
    timer = setInterval(() => {
      aktifPIdx = (aktifPIdx + 1) % Math.max(1, pListesi.length);
      dinlemeDurumCiz(true);
    }, Math.round(4500 / hizlar[hizIdx]));
  }

  function miniVeriGuncelle() {
    const y = B.bul(aktifYaziId);
    const aktifP = pListesi[aktifPIdx] || { bolum: y.bolumler[0]?.baslik || '', metin: y.altBaslik };
    const oran = Math.min(98, Math.max(12, Math.round(((aktifPIdx + 1) / Math.max(1, pListesi.length)) * 100)));
    document.getElementById('mini-kapak').src = y.kapak;
    document.getElementById('mini-baslik').textContent = `${y.sanatci} · ${aktifP.bolum}`;
    document.getElementById('mini-alt').textContent = aktifP.metin.slice(0, 64) + '…';
    document.getElementById('mini-dol').style.width = `${oran}%`;
  }

  function miniGaleriCiz() {
    const ornekler = ['johannes-vermeer', 'diego-velazquez', 'vincent-van-gogh', 'gustav-klimt'].map(id => B.bul(id));
    document.getElementById('mini-izgara').innerHTML = ornekler.map(y => `
      <div class="diger-kart">
        <img src="${y.kapak}" alt="${y.sanatci}">
        <div><b>${y.sanatci}</b><span>${y.yillar}</span></div>
      </div>
    `).join('');
  }

  function aramaCiz(q = '') {
    const t = q.trim().toLocaleLowerCase('tr');
    const sonuc = YAZILAR.filter(y => !t || y.sanatci.toLocaleLowerCase('tr').includes(t) || y.baslik.toLocaleLowerCase('tr').includes(t));
    const el = document.getElementById('arama-liste');
    el.innerHTML = sonuc.map(y => `
      <button class="arama-oge" data-id="${y.id}">
        <img src="${y.kapak}" alt="${y.sanatci}">
        <div>
          <div class="arama-oge-baslik">${y.baslik}</div>
          <div class="arama-oge-meta">${y.sanatci} · ${y.yillar} · ${y.okumaDk} dk okuma</div>
        </div>
      </button>
    `).join('');
    el.querySelectorAll('.arama-oge').forEach(b => {
      b.onclick = () => {
        document.getElementById('arama-katman').classList.remove('acik');
        aktifYaziId = b.dataset.id;
        aktifPIdx = 2;
        dinlemeKapat();
        gorunumAc('okuma-basi');
      };
    });
  }

  function gorunumAc(ad) {
    aktifGorunum = ad;
    document.querySelectorAll('[data-ekran]').forEach(b => b.classList.toggle('aktif', b.dataset.ekran === ad));
    document.querySelectorAll('.ekran').forEach(e => e.classList.remove('acik'));

    if (ad === 'ana') {
      document.getElementById('ekran-ana').classList.add('acik');
      zeminGuncelle(YAZILAR[0]);
      anaCiz();
    } else if (ad === 'mini') {
      document.getElementById('ekran-mini').classList.add('acik');
      makaleCiz();
      miniGaleriCiz();
    } else {
      document.getElementById('ekran-okuma').classList.add('acik');
      makaleCiz();
      const kap = document.getElementById('okuma-kaydir');
      if (ad === 'okuma-basi') {
        dinlemeKapat();
        kap.scrollTop = 0;
        document.getElementById('okuma-ust').classList.remove('yapiskan');
      } else if (ad === 'okuma-eser') {
        dinlemeKapat();
        requestAnimationFrame(() => {
          const fig = document.querySelector('#makale-ic .eser-fig');
          if (fig) kap.scrollTop = Math.max(0, fig.getBoundingClientRect().top - kap.getBoundingClientRect().top + kap.scrollTop - 135);
          document.getElementById('okuma-ust').classList.add('yapiskan');
        });
      } else if (ad === 'dinleme') {
        aktifPIdx = 3;
        dinlemeAc(false);
        document.getElementById('okuma-ust').classList.add('yapiskan');
      } else if (ad === 'son') {
        dinlemeKapat();
        requestAnimationFrame(() => {
          const son = document.getElementById('yazi-sonu');
          if (son) kap.scrollTop = Math.max(0, son.getBoundingClientRect().top - kap.getBoundingClientRect().top + kap.scrollTop - 108);
          document.getElementById('okuma-ust').classList.add('yapiskan');
        });
      }
    }
  }

  function baslat() {
    if (B.urlParam('ci', '') === '1') {
      document.body.classList.remove('vitrin-mod');
      document.body.classList.add('ci-mod');
    }
    sekmeCiz('sekme-ana', 'hikayeler');
    sekmeCiz('sekme-mini', 'galeri');

    document.getElementById('btn-ara-ac').innerHTML = B.svg('ara', 19, 1.7);
    document.getElementById('btn-ben-ust').innerHTML = B.svg('ben', 19, 1.7);
    document.getElementById('btn-mini-ben').innerHTML = B.svg('ben', 19, 1.7);
    document.getElementById('btn-geri').innerHTML = B.svg('geri', 20, 1.8);
    document.getElementById('btn-ust-dinle').innerHTML = B.svg('kulaklik', 19, 1.6);
    document.getElementById('c-geri15').innerHTML = B.svg('geri15', 19, 1.6);
    document.getElementById('c-ileri15').innerHTML = B.svg('ileri15', 19, 1.6);
    document.getElementById('c-kapat').innerHTML = B.svg('kapat', 17, 1.7);
    document.getElementById('c-oynat').innerHTML = B.svg('oynat', 19, 1.8);
    document.getElementById('mini-oynat').innerHTML = B.svg('oynat', 18, 1.8);
    document.getElementById('mini-kapat').innerHTML = B.svg('kapat', 17, 1.7);
    document.getElementById('arama-ikon').innerHTML = B.svg('ara', 18, 1.6);

    document.getElementById('btn-ara-ac').onclick = () => { aramaCiz(''); document.getElementById('arama-katman').classList.add('acik'); document.getElementById('arama-giris').focus(); };
    document.getElementById('btn-ara-kapat').onclick = () => document.getElementById('arama-katman').classList.remove('acik');
    document.getElementById('arama-giris').oninput = e => aramaCiz(e.target.value);

    document.getElementById('btn-geri').onclick = () => gorunumAc('ana');
    document.getElementById('btn-ust-dinle').onclick = () => dinlemeAcik ? dinlemeKapat() : dinlemeAc(true);
    document.getElementById('c-oynat').onclick = () => { oynuyor = !oynuyor; dinlemeDurumCiz(false); oynuyor ? zamanlayiciKur() : clearInterval(timer); };
    document.getElementById('c-geri15').onclick = () => { aktifPIdx = Math.max(0, aktifPIdx - 1); dinlemeDurumCiz(true); };
    document.getElementById('c-ileri15').onclick = () => { aktifPIdx = Math.min(pListesi.length - 1, aktifPIdx + 1); dinlemeDurumCiz(true); };
    document.getElementById('c-hiz').onclick = () => { hizIdx = (hizIdx + 1) % hizlar.length; document.getElementById('c-hiz').textContent = `${String(hizlar[hizIdx]).replace('.', ',')}×`; if (oynuyor) zamanlayiciKur(); };
    document.getElementById('c-kapat').onclick = () => dinlemeKapat();

    document.getElementById('mini-calar').onclick = e => { if (!e.target.closest('button')) gorunumAc('dinleme'); };
    document.getElementById('mini-oynat').onclick = e => { e.stopPropagation(); oynuyor = !oynuyor; dinlemeDurumCiz(false); };
    document.getElementById('mini-kapat').onclick = e => { e.stopPropagation(); document.getElementById('mini-calar').style.display = 'none'; };

    document.querySelectorAll('[data-ekran]').forEach(b => b.onclick = () => gorunumAc(b.dataset.ekran));
    document.querySelectorAll('[data-tema-sec]').forEach(b => b.onclick = () => temaUygula(b.dataset.temaSec));

    temaUygula(aktifTema);
    gorunumAc(aktifGorunum);
  }

  baslat();
})();
</script>
</body>
</html>
