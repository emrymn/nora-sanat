<!doctype html>
<html lang="tr" data-tema="gece" data-donem="barok">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galeri · Akımlar · Yön 1 — Sakin Kemerler</title>
    <style>
      @font-face {
        font-family: 'Bodoni Moda';
        src: url('../../NoraSanat/YaziTipleri/BodoniModa.ttf') format('truetype');
        font-weight: 400 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader.ttf') format('truetype');
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader-Italic.ttf') format('truetype');
        font-weight: 200 800;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Archivo';
        src: url('../../NoraSanat/YaziTipleri/Archivo.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      /* =====================================================================
         Sanat Atlası — Tema değişkenleri (Gece & Gündüz)
         ===================================================================== */
      :root,
      :root[data-tema='gece'] {
        --bg: #121110;
        --bg-rgb: 18, 17, 16;
        --surface: #1c1a18;
        --border: #2e2b28;
        --border-ince: rgba(235, 229, 218, 0.09);
        --ink: #ebe5da;
        --ink-rgb: 235, 229, 218;
        --ink-2: #aca498;
        --ink-3: #8a8379;
        --pirinc: #c9a45c;
        --pirinc-rgb: 201, 164, 92;
        --tab-bg: rgba(24, 22, 20, 0.84);
        --overlay-btn: rgba(24, 22, 20, 0.62);
        --doku: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.04;
        --hale-karisim: normal;
        --hale-1-op: 0.44;
        --hale-2-op: 0.32;
        --hale-orta-op: 0.22;
        --kart-golge: 0 24px 52px rgba(0, 0, 0, 0.48);
        --kart-golge-yan: 0 14px 28px rgba(0, 0, 0, 0.28);
        --sekme-golge: 0 10px 30px rgba(0, 0, 0, 0.46);
        --kemer-alt-golge: rgba(18, 17, 16, 0.34);
        --kilit-pece: rgba(18, 17, 16, 0.24);
        --sayfa-zemin: #0c0b0a;
        color-scheme: dark;
      }

      :root[data-tema='gunduz'] {
        --bg: #ece8e1;
        --bg-rgb: 236, 232, 225;
        --surface: #f7f5f1;
        --border: #d6d0c6;
        --border-ince: rgba(31, 27, 23, 0.09);
        --ink: #1f1b17;
        --ink-rgb: 31, 27, 23;
        --ink-2: #4c463f;
        --ink-3: #686057;
        --pirinc: #8c661c;
        --pirinc-rgb: 140, 102, 28;
        --tab-bg: rgba(247, 245, 241, 0.88);
        --overlay-btn: rgba(247, 245, 241, 0.82);
        --doku: radial-gradient(rgba(31, 27, 23, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.045;
        --hale-karisim: multiply;
        --hale-1-op: 0.34;
        --hale-2-op: 0.24;
        --hale-orta-op: 0.16;
        --kart-golge: 0 22px 44px rgba(20, 17, 14, 0.16);
        --kart-golge-yan: 0 10px 22px rgba(20, 17, 14, 0.09);
        --sekme-golge: 0 10px 28px rgba(20, 17, 14, 0.12);
        --kemer-alt-golge: rgba(20, 17, 14, 0.14);
        --kilit-pece: rgba(236, 232, 225, 0.24);
        --sayfa-zemin: #e2ddd4;
        color-scheme: light;
      }

      :root {
        --serif: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
        --sans: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --okuma: 'Newsreader', 'Iowan Old Style', Georgia, serif;
        --hale-1-rgb: 62, 117, 163;
        --hale-2-rgb: 176, 134, 62;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--sayfa-zemin);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      /* Önizleme üst çubuğu */
      .onizleme-ust {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 28px;
        background: var(--tab-bg);
        border-bottom: 1px solid var(--border);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
      }
      .onizleme-baslik {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .onizleme-baslik .ust-not {
        font: 600 13px/1.3 var(--sans);
        color: var(--pirinc);
      }
      .onizleme-baslik h1 {
        margin: 0;
        font: 500 22px/1.15 var(--serif);
        letter-spacing: -0.01em;
      }
      .tema-kabi {
        display: inline-flex;
        padding: 4px;
        gap: 2px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
      }
      .tema-kabi button {
        min-height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        font: 600 13px/1 var(--sans);
        cursor: pointer;
      }
      .tema-kabi button[aria-pressed='true'] {
        background: rgba(var(--ink-rgb), 0.14);
        color: var(--ink);
      }

      .sahne {
        display: flex;
        justify-content: center;
        padding: 32px 20px 64px;
      }

      /* 390 × 844 iPhone */
      .telefon {
        position: relative;
        width: 390px;
        height: 844px;
        border-radius: 44px;
        overflow: hidden;
        background-color: var(--bg);
        border: 1px solid var(--border);
        box-shadow: 0 32px 84px rgba(0, 0, 0, 0.44);
        isolation: isolate;
      }

      /* Üç katmanlı zemin: doku + tablonun iki renkli halesi + çapraz solan dönem sembolü karosu */
      .zemin-doku {
        position: absolute;
        inset: 0;
        z-index: 0;
        background-image: var(--doku);
        background-size: 3px 3px;
        pointer-events: none;
      }
      .zemin-hale {
        position: absolute;
        inset: 0;
        z-index: 1;
        mix-blend-mode: var(--hale-karisim);
        background:
          radial-gradient(122% 58% at 0% 0%, rgba(var(--hale-1-rgb), var(--hale-1-op)) 0%, rgba(var(--hale-1-rgb), 0.14) 48%, transparent 84%),
          radial-gradient(96% 48% at 100% 100%, rgba(var(--hale-2-rgb), var(--hale-2-op)) 0%, rgba(var(--hale-2-rgb), 0.09) 45%, transparent 80%),
          radial-gradient(62% 34% at 50% 42%, rgba(var(--hale-1-rgb), var(--hale-orta-op)) 0%, transparent 72%);
        pointer-events: none;
      }
      .zemin-desen {
        position: absolute;
        inset: 0;
        z-index: 2;
        background-color: var(--ink);
        opacity: 0;
        -webkit-mask-size: 96px 96px;
        mask-size: 96px 96px;
        -webkit-mask-repeat: repeat;
        mask-repeat: repeat;
        transition: opacity 560ms cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
      }
      .zemin-desen.aktif {
        opacity: var(--desen-opaklik);
      }

      .telefon-kaydir {
        position: relative;
        z-index: 3;
        height: 100%;
        overflow-y: auto;
        overflow-x: clip;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .telefon-kaydir::-webkit-scrollbar {
        display: none;
      }

      .durum-cubugu {
        position: sticky;
        top: 0;
        z-index: 15;
        height: 46px;
        padding: 14px 26px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font: 600 14px/1 var(--sans);
        color: var(--ink);
        pointer-events: none;
      }
      .durum-simgeler {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .ekran-ic {
        padding: 4px 20px 88px;
      }

      /* =====================================================================
         Galeri üstü
         ===================================================================== */
      .galeri-ust-satir {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
      }
      .galeri-ust-satir h2 {
        margin: 0;
        font: 400 32px/1 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
        flex: none;
      }
      .arama-hapi {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 0 13px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: var(--ink-2);
        font: 400 14px/1 var(--sans);
      }
      .arama-hapi span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kalp-btn {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
        display: grid;
        place-items: center;
        color: var(--pirinc);
        text-decoration: none;
      }

      .bolumler {
        margin-top: 12px;
        padding: 4px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
        display: grid;
        grid-template-columns: 1fr 1.24fr 1fr 0.92fr;
        gap: 2px;
      }
      .bolumler button {
        min-height: 44px;
        padding: 0 6px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        font: 500 13.5px/1 var(--sans);
        cursor: pointer;
        white-space: nowrap;
      }
      .bolumler button[aria-current='page'] {
        background: rgba(var(--ink-rgb), 0.13);
        color: var(--ink);
        font-weight: 600;
      }

      /* =====================================================================
         YÖN 1 · İnce Dönem Şeridi (Kayan pirinç çizgi, sıfır kutu gürültüsü)
         ===================================================================== */
      .donem-seridi-kap {
        position: relative;
        margin: 10px -20px 0;
      }
      .donem-seridi-kap::before,
      .donem-seridi-kap::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 24px;
        z-index: 2;
        pointer-events: none;
      }
      .donem-seridi-kap::before {
        left: 0;
        background: linear-gradient(90deg, rgba(var(--bg-rgb), 0.85), transparent);
      }
      .donem-seridi-kap::after {
        right: 0;
        background: linear-gradient(270deg, rgba(var(--bg-rgb), 0.85), transparent);
      }
      .donem-seridi {
        position: relative;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 0 22px;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
        touch-action: pan-x pan-y;
      }
      .donem-seridi::-webkit-scrollbar {
        display: none;
      }
      .donem-sekme {
        flex: none;
        position: relative;
        min-height: 44px;
        padding: 0 2px;
        border: 0;
        background: transparent;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--ink-3);
        font: 500 13.5px/1 var(--sans);
        cursor: pointer;
        white-space: nowrap;
        transition: color 260ms ease;
      }
      .donem-sekme.acik-donem {
        color: var(--ink-2);
      }
      .donem-sekme[aria-selected='true'] {
        color: var(--ink);
        font-weight: 600;
      }
      .donem-sekme .donem-sembol {
        width: 14px;
        height: 14px;
        color: var(--pirinc);
        opacity: 0.48;
        transition: opacity 260ms ease, transform 260ms ease;
      }
      .donem-sekme[aria-selected='true'] .donem-sembol {
        opacity: 1;
        transform: scale(1.06);
      }
      .donem-cizgi {
        position: absolute;
        left: 0;
        bottom: 4px;
        height: 2px;
        border-radius: 2px;
        background: var(--pirinc);
        transform-origin: left center;
        transition: transform 340ms cubic-bezier(0.22, 1, 0.36, 1), width 340ms cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
      }

      /* =====================================================================
         YÖN 1 · Kemerli Salon Şeridi (Süzülen derinlik & kapı içi paralaks)
         ===================================================================== */
      .salon-sahne {
        margin-top: 2px;
      }
      .kemer-serit {
        margin: 0 -20px;
        padding: 8px 80px 10px;
        display: flex;
        gap: 18px;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-padding-inline: 80px;
        scrollbar-width: none;
        touch-action: pan-x pan-y;
        overscroll-behavior-x: contain;
        cursor: grab;
        user-select: none;
      }
      .kemer-serit.surukleniyor {
        scroll-snap-type: none;
        cursor: grabbing;
      }
      .kemer-serit::-webkit-scrollbar {
        display: none;
      }

      .kemer-oge {
        flex: 0 0 230px;
        width: 230px;
        scroll-snap-align: center;
        display: flex;
        justify-content: center;
        will-change: transform, opacity;
      }

      .kemer-kutu {
        position: relative;
        width: 230px;
        height: 278px;
        border-radius: 115px 115px 18px 18px;
        overflow: hidden;
        background: var(--surface);
        box-shadow: var(--kart-golge-yan);
        transition: box-shadow 360ms ease;
      }
      .kemer-oge.odak .kemer-kutu {
        box-shadow: var(--kart-golge);
      }
      .kemer-kutu::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 3;
        border-radius: inherit;
        border: 1px solid rgba(var(--pirinc-rgb), var(--cerceve-op, 0.16));
        box-shadow: inset 0 1px 0 rgba(255, 250, 240, 0.14);
        pointer-events: none;
      }
      .kemer-kutu::after {
        content: '';
        position: absolute;
        inset: auto 0 0;
        height: 26%;
        z-index: 2;
        background: linear-gradient(180deg, transparent 0%, var(--kemer-alt-golge) 100%);
        pointer-events: none;
      }

      .kemer-resim {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        will-change: transform;
        pointer-events: none;
      }
      /* Kilitli akım: soğuk gri değil, tablonun rengini sezdiren sıcak buğulu cam */
      .kemer-oge.kilitli .kemer-resim {
        filter: blur(4.2px) saturate(0.46) brightness(0.76);
      }
      :root[data-tema='gunduz'] .kemer-oge.kilitli .kemer-resim {
        filter: blur(4px) saturate(0.44) brightness(0.88) contrast(0.92);
      }

      .kilit-pece {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: radial-gradient(circle at 50% 48%, transparent 18%, var(--kilit-pece) 100%);
        display: grid;
        place-items: center;
        pointer-events: none;
      }
      .kilit-muhur {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(18, 17, 16, 0.42);
        border: 1px solid rgba(235, 229, 218, 0.24);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        display: grid;
        place-items: center;
        color: rgba(244, 236, 222, 0.9);
      }
      :root[data-tema='gunduz'] .kilit-muhur {
        background: rgba(247, 245, 241, 0.56);
        border-color: rgba(31, 27, 23, 0.16);
        color: #1f1b17;
      }

      /* =====================================================================
         YÖN 1 · Kemerle Birlikte Nefes Alan Metin Sahnesi
         ===================================================================== */
      .bilgi-sahne {
        position: relative;
        min-height: 142px;
        margin-top: 2px;
      }
      .bilgi-katman {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        will-change: transform, opacity;
      }
      .bilgi-ust {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 600 13px/1.3 var(--sans);
        color: var(--pirinc);
      }
      .bilgi-ust svg {
        width: 14px;
        height: 14px;
        flex: none;
      }
      .bilgi-ad {
        margin: 4px 0 0;
        max-width: 320px;
        font: 500 31px/1.08 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
        text-wrap: balance;
      }
      .bilgi-katman.kilitli .bilgi-ad {
        color: var(--ink-2);
      }
      .bilgi-durum {
        margin: 5px 0 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 400 14.5px/1.35 var(--sans);
        color: var(--ink-2);
      }

      /* EKRANDAKİ TEK DOLU DÜĞME */
      .eylem-yuva {
        margin-top: 11px;
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .salona-gir {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 46px;
        padding: 0 22px 0 26px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--bg);
        font: 600 15px/1 var(--sans);
        text-decoration: none;
        cursor: pointer;
        transition: transform 160ms ease;
      }
      .salona-gir:active {
        transform: scale(0.96);
      }
      .kilit-not-hap {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        color: var(--ink-2);
        font: 500 13.5px/1 var(--sans);
      }

      /* Dönem içi sessiz nokta izi */
      .donem-iz {
        margin-top: 6px;
        height: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      .donem-iz i {
        display: block;
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: rgba(var(--ink-rgb), 0.2);
        transition: width 280ms cubic-bezier(0.22, 1, 0.36, 1), background-color 280ms ease;
      }
      .donem-iz i.secili {
        width: 18px;
        background: var(--pirinc);
      }

      /* =====================================================================
         YÖN 1 · Sakin, Katlanır "Bütün akımlar" Dizini
         ===================================================================== */
      .dizin-bolum {
        margin-top: 6px;
      }
      .dizin-ac {
        width: 100%;
        min-height: 46px;
        padding: 0 4px;
        border: 0;
        border-top: 1px solid var(--border-ince);
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--ink-2);
        font: 500 14px/1 var(--sans);
        cursor: pointer;
      }
      .dizin-ac-sol {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
        font-weight: 600;
      }
      .dizin-ac-sag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--ink-3);
        font-size: 13px;
      }
      .dizin-ac-sag svg {
        transition: transform 280ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .dizin-ac[aria-expanded='true'] .dizin-ac-sag svg {
        transform: rotate(180deg);
      }

      .dizin-govde {
        padding-top: 14px;
      }
      .dizin-govde[hidden] {
        display: none;
      }

      .donem-grup + .donem-grup {
        margin-top: 20px;
      }
      .donem-grup-bas {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
        padding: 0 2px;
      }
      .donem-grup-sol {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .donem-grup-sol svg {
        width: 14px;
        height: 14px;
        color: var(--pirinc);
      }
      .donem-grup-sol b {
        font: 600 13px/1.2 var(--sans);
        color: var(--pirinc);
      }
      .donem-grup-sag {
        font: 400 12.5px/1.2 var(--sans);
        color: var(--ink-3);
      }

      .gruplu-liste {
        margin: 0;
        padding: 0;
        list-style: none;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 22px;
        overflow: hidden;
      }
      .gruplu-liste > li + li {
        border-top: 1px solid var(--border-ince);
      }
      .dizin-satir {
        width: 100%;
        border: 0;
        background: transparent;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 60px;
        padding: 10px 14px;
        text-align: left;
        cursor: pointer;
        color: var(--ink);
      }
      .dizin-satir.secili {
        background: rgba(var(--pirinc-rgb), 0.1);
      }
      .dizin-pul {
        flex: none;

        position: absolute;

        right: 14px;
        bottom: 14px;

        height: 62px;

        border: 1px solid rgba(var(--ink-rgb), 0.13);

        grid-template-columns: repeat(5, minmax(0, 1fr));

          if ([1, 2, 7, 8].indexOf(s) >= 0 || n === 20 || n === 50) return n + '’de';
          return n + '’da';
        }
        function sembolSvg(id) {
          return (
            '<svg class="donem-sembol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            DONEMLER[id].svg +
            '</svg>'
          );
        }
        function kilitSvg(w) {
          return (
            '<svg width="' +
            w +
            '" height="' +
            w +
            '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
          );
        }
        function bilgiHtml(a) {
          var durum = a.acik
            ? a.acikS === a.toplam
              ? a.toplam + ' sanatçının hepsi açık'
              : a.acikS + ' / ' + a.toplam + ' sanatçı açık'
            : kilitSvg(14) + '<span>Konu ' + bulunma(a.konu) + ' açılır</span>';
          var eylem = a.acik
            ? '<a class="salona-gir" href="#salon">Salona gir<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></a>'
            : '<span class="kilit-not-hap">' + kilitSvg(14) + '<span>' + a.toplam + ' sanatçı · yakında</span></span>';
          return (
            '<span class="bilgi-ust">' +
            sembolSvg(a.donem) +
            '<span>' +
            a.yillar +
            '</span></span>' +
            '<h3 class="bilgi-ad">' +
            a.ad +
            '</h3>' +
            '<p class="bilgi-durum">' +
            durum +
            '</p>' +
            '<div class="eylem-yuva">' +
            eylem +
            '</div>'
          );
        }

        var donemSeridi = document.getElementById('donem-seridi');
        var donemCizgi = document.getElementById('donem-cizgi');
        var kemerSerit = document.getElementById('kemer-serit');
        var bilgiA = document.getElementById('bilgi-a');
        var bilgiB = document.getElementById('bilgi-b');
        var donemIz = document.getElementById('donem-iz');
        var dizinGovde = document.getElementById('dizin-govde');
        var desenA = document.getElementById('desen-a');
        var desenB = document.getElementById('desen-b');

        /* Dönem şeridi */
        var donemBtnMap = {};
        DONEM_SIRA.forEach(function (id) {
          var grup = AKIMLAR.filter(function (a) {
            return a.donem === id;
          });
          var acikVar = grup.some(function (a) {
            return a.acik;
          });
          var ilkIdx = AKIMLAR.findIndex(function (a) {
            return a.donem === id;
          });
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'donem-sekme' + (acikVar ? ' acik-donem' : '');
          btn.setAttribute('role', 'tab');
          btn.dataset.donem = id;
          btn.innerHTML = sembolSvg(id) + '<span>' + DONEMLER[id].kisa + '</span>';
          btn.addEventListener('click', function () {
            git(ilkIdx, true);
          });
          donemSeridi.appendChild(btn);
          donemBtnMap[id] = btn;
        });

        /* 28 kemerli kart */
        var kartlar = [];
        AKIMLAR.forEach(function (a, i) {
          var el = document.createElement('article');
          el.className = 'kemer-oge' + (a.acik ? '' : ' kilitli');
          el.dataset.idx = String(i);
          el.innerHTML =
            '<div class="kemer-kutu">' +
            '<img class="kemer-resim" src="' +
            a.img +
            '" style="object-position:' +
            a.poz +
            '" alt="' +
            a.ad +
            '" decoding="async" />' +
            (a.acik ? '' : '<span class="kilit-pece"><span class="kilit-muhur">' + kilitSvg(18) + '</span></span>') +
            '</div>';
          el.addEventListener('click', function () {
            if (!suruklendi) git(i, true);
          });
          kemerSerit.appendChild(el);
          kartlar.push({ el: el, img: el.querySelector('.kemer-resim') });
        });

        /* Dizin (9 dönem grubu, her biri kendi özgün eseriyle) */
        DONEM_SIRA.forEach(function (id) {
          var grup = AKIMLAR.map(function (a, i) {
            return { a: a, i: i };
          }).filter(function (x) {
            return x.a.donem === id;
          });
          var acikAdet = grup.filter(function (x) {
            return x.a.acik;
          }).length;
          var secEl = document.createElement('div');
          secEl.className = 'donem-grup';
          secEl.innerHTML =
            '<div class="donem-grup-bas"><span class="donem-grup-sol">' +
            sembolSvg(id) +
            '<b>' +
            DONEMLER[id].ad +
            '</b></span><span class="donem-grup-sag">' +
            (acikAdet ? acikAdet + ' açık' : 'Konu ' + bulunma(grup[0].a.konu)) +
            '</span></div>';
          var ul = document.createElement('ul');
          ul.className = 'gruplu-liste';
          grup.forEach(function (x) {
            var a = x.a;
            var li = document.createElement('li');
            var durum = a.acik
              ? a.acikS === a.toplam
                ? a.toplam + ' sanatçının hepsi açık'
                : a.acikS + ' / ' + a.toplam + ' sanatçı açık'
              : 'Konu ' + bulunma(a.konu) + ' açılır';
            li.innerHTML =
              '<button type="button" class="dizin-satir' +
              (a.acik ? '' : ' kilitli') +
              '" data-dizin-idx="' +
              x.i +
              '">' +
              '<span class="dizin-pul"><img src="' +
              a.img +
              '" style="object-position:' +
              a.poz +
              '" alt="" loading="lazy" /></span>' +
              '<span class="dizin-orta"><b>' +
              a.ad +
              '</b><small>' +
              a.yillar +
              ' · ' +
              durum +
              '</small></span>' +
              '<span class="dizin-sag' +
              (a.acik ? ' acik' : '') +
              '">' +
              (a.acik
                ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'
                : kilitSvg(14)) +
              '</span></button>';
            li.querySelector('button').addEventListener('click', function () {
              git(x.i, true);
              document.getElementById('kaydir').scrollTo({ top: 0, behavior: 'smooth' });
            });
            ul.appendChild(li);
          });
          secEl.appendChild(ul);
          dizinGovde.appendChild(secEl);
        });

        /* Sürekli akış motoru: zemin halesi + dönem deseni + kemer derinlik & paralaks + nefes alan yazı */
        var ADIM = 230 + 18;
        var aktifDonem = '';
        var desenTers = false;
        var sonSol = -1;
        var sonSag = -1;
        var sonYuvarlak = -1;

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }
        function smoothstep(t) {
          var c = Math.max(0, Math.min(1, t));
          return c * c * (3 - 2 * c);
        }

        function desenGec(donem) {
          if (donem === aktifDonem) return;
          aktifDonem = donem;
          root.setAttribute('data-donem', donem);
          var url = "url('../../NoraSanat/Ekranlar/Galeri/Desenler/desen-" + donem + "@3x.png')";
          var gelen = desenTers ? desenA : desenB;
          var giden = desenTers ? desenB : desenA;
          desenTers = !desenTers;
          gelen.style.webkitMaskImage = url;
          gelen.style.maskImage = url;
          gelen.classList.add('aktif');
          giden.classList.remove('aktif');
        }

        function donemCubuguHizala(donem, kaydir) {
          var btn = donemBtnMap[donem];
          if (!btn) return;
          Object.keys(donemBtnMap).forEach(function (k) {
            donemBtnMap[k].setAttribute('aria-selected', String(k === donem));
          });
          donemCizgi.style.width = btn.offsetWidth + 'px';
          donemCizgi.style.transform = 'translateX(' + btn.offsetLeft + 'px)';
          if (kaydir) {
            var hedef = btn.offsetLeft - (donemSeridi.clientWidth - btn.offsetWidth) / 2;
            donemSeridi.scrollTo({ left: Math.max(0, hedef), behavior: 'smooth' });
          }
        }

        function izGuncelle(idx) {
          var donem = AKIMLAR[idx].donem;
          var grup = [];
          AKIMLAR.forEach(function (a, i) {
            if (a.donem === donem) grup.push(i);
          });
          donemIz.innerHTML = grup
            .map(function (i) {
              return '<i class="' + (i === idx ? 'secili' : '') + '"></i>';
            })
            .join('');
        }

        function cizKonum(p, seritKaydir) {
          p = Math.max(0, Math.min(AKIMLAR.length - 1, p));
          var i0 = Math.floor(p);
          var i1 = Math.min(AKIMLAR.length - 1, i0 + 1);
          var f = p - i0;
          var ef = smoothstep(f);

          /* 1. İki renkli tablo halesini kesintisiz RGB harmanla */
          var a0 = AKIMLAR[i0];
          var a1 = AKIMLAR[i1];
          var r1 = Math.round(lerp(a0.h1[0], a1.h1[0], ef));
          var g1 = Math.round(lerp(a0.h1[1], a1.h1[1], ef));
          var b1 = Math.round(lerp(a0.h1[2], a1.h1[2], ef));
          var r2 = Math.round(lerp(a0.h2[0], a1.h2[0], ef));
          var g2 = Math.round(lerp(a0.h2[1], a1.h2[1], ef));
          var b2 = Math.round(lerp(a0.h2[2], a1.h2[2], ef));
          root.style.setProperty('--hale-1-rgb', r1 + ', ' + g1 + ', ' + b1);
          root.style.setProperty('--hale-2-rgb', r2 + ', ' + g2 + ', ' + b2);

          /* 2. Kemerler: yumuşak kosinüs eğrisi + kapı içi paralaks */
          for (var i = 0; i < kartlar.length; i++) {
            var d = i - p;
            var ad = Math.min(1.35, Math.abs(d));
            var yakinlik = Math.cos((Math.min(1, ad) * Math.PI) / 2); // 1 merkezde -> 0 komşuda
            var olcek = 0.90 + 0.10 * yakinlik;
            var y = (1 - yakinlik) * 12;
            var op = 0.68 + 0.32 * yakinlik;
            var cerceve = (0.14 + 0.56 * yakinlik).toFixed(3);
            var el = kartlar[i].el;
            el.style.transform = 'translate3d(0,' + y.toFixed(2) + 'px,0) scale(' + olcek.toFixed(4) + ')';
            el.style.opacity = op.toFixed(3);
            el.style.setProperty('--cerceve-op', cerceve);
            el.classList.toggle('odak', ad < 0.35);

            /* Kapı aralığı paralaksı: kemer kayarken tablo içeride usulca nefes alır */
            var px = Math.max(-14, Math.min(14, d * 12));
            var baseScale = AKIMLAR[i].acik ? 1.07 : 1.13;
            var nefes = baseScale - 0.03 * yakinlik;
            kartlar[i].img.style.transform = 'translate3d(' + px.toFixed(2) + 'px,0,0) scale(' + nefes.toFixed(4) + ')';
          }

          /* 3. Kemer ve yazı birlikte nefes alır: yumuşak çapraz geçiş */
          if (i0 !== sonSol) {
            sonSol = i0;
            bilgiA.className = 'bilgi-katman' + (a0.acik ? '' : ' kilitli');
            bilgiA.innerHTML = bilgiHtml(a0);
          }
          if (i1 !== sonSag) {
            sonSag = i1;
            bilgiB.className = 'bilgi-katman' + (a1.acik ? '' : ' kilitli');
            bilgiB.innerHTML = bilgiHtml(a1);
          }
          if (i0 === i1 || f < 0.002) {
            bilgiA.style.opacity = '1';
            bilgiA.style.transform = 'translate3d(0,0,0)';
            bilgiA.style.pointerEvents = 'auto';
            bilgiB.style.opacity = '0';
            bilgiB.style.pointerEvents = 'none';
          } else {
            /* Çakışmayan nefes zarfı: giden 0..0.48 arasında usulca solup sola süzülür; gelen 0.52..1 arasında sağdan nefes alır */
            var opA = Math.pow(Math.max(0, 1 - f / 0.48), 1.15);
            var opB = Math.pow(Math.max(0, (f - 0.52) / 0.48), 1.15);
            bilgiA.style.opacity = opA.toFixed(3);
            bilgiA.style.transform = 'translate3d(' + (-f * 24).toFixed(1) + 'px,' + (-f * 4).toFixed(1) + 'px,0)';
            bilgiA.style.pointerEvents = f < 0.48 ? 'auto' : 'none';
            bilgiB.style.opacity = opB.toFixed(3);
            bilgiB.style.transform = 'translate3d(' + ((1 - f) * 24).toFixed(1) + 'px,' + ((1 - f) * 4).toFixed(1) + 'px,0)';
            bilgiB.style.pointerEvents = f > 0.52 ? 'auto' : 'none';
          }

          /* 4. Dönem deseni, dönem çizgisi ve dizin vurgusu */
          var yuvarlak = Math.round(p);
          if (yuvarlak !== sonYuvarlak) {
            sonYuvarlak = yuvarlak;
            var secA = AKIMLAR[yuvarlak];
            desenGec(secA.donem);
            donemCubuguHizala(secA.donem, seritKaydir);
            izGuncelle(yuvarlak);
            dizinGovde.querySelectorAll('.dizin-satir').forEach(function (s) {
              s.classList.toggle('secili', Number(s.dataset.dizinIdx) === yuvarlak);
            });
          }

          /* Dönem sınırında çizgiyi anlık ara konuma taşı */
          if (a0.donem !== a1.donem && f > 0.01 && f < 0.99) {
            var b0 = donemBtnMap[a0.donem];
            var b1 = donemBtnMap[a1.donem];
            if (b0 && b1) {
              donemCizgi.style.transition = 'none';
              donemCizgi.style.width = lerp(b0.offsetWidth, b1.offsetWidth, ef).toFixed(1) + 'px';
              donemCizgi.style.transform = 'translateX(' + lerp(b0.offsetLeft, b1.offsetLeft, ef).toFixed(1) + 'px)';
            }
          } else {
            donemCizgi.style.transition = '';
          }
        }

        function git(idx, yumusak) {
          idx = Math.max(0, Math.min(AKIMLAR.length - 1, idx));
          kemerSerit.scrollTo({ left: idx * ADIM, behavior: yumusak ? 'smooth' : 'auto' });
        }

        var raf = 0;
        kemerSerit.addEventListener(
          'scroll',
          function () {
            if (raf) return;
            raf = requestAnimationFrame(function () {
              raf = 0;
              cizKonum(kemerSerit.scrollLeft / ADIM, true);
            });
          },
          { passive: true }
        );

        /* Masaüstü fare sürüklemesi (dokunmatik doğal kaydırmayı etkilemez) */
        var fare = null;
        var suruklendi = false;
        kemerSerit.addEventListener('mousedown', function (e) {
          if (e.button !== 0) return;
          fare = { x: e.clientX, sl: kemerSerit.scrollLeft, sonX: e.clientX, sonT: performance.now(), v: 0 };
          suruklendi = false;
          kemerSerit.classList.add('surukleniyor');
        });
        window.addEventListener('mousemove', function (e) {
          if (!fare) return;
          var dx = e.clientX - fare.x;
          if (Math.abs(dx) > 5) suruklendi = true;
          var now = performance.now();
          fare.v = (e.clientX - fare.sonX) / Math.max(1, now - fare.sonT);
          fare.sonX = e.clientX;
          fare.sonT = now;
          kemerSerit.scrollLeft = fare.sl - dx;
        });
        window.addEventListener('mouseup', function () {
          if (!fare) return;
          var v = fare.v;
          fare = null;
          kemerSerit.classList.remove('surukleniyor');
          if (suruklendi) {
            var hedef = Math.round(kemerSerit.scrollLeft / ADIM - v * 0.42);
            git(hedef, true);
            setTimeout(function () {
              suruklendi = false;
            }, 60);
          }
        });

        /* Klavye okları */
        window.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowRight') git(Math.round(kemerSerit.scrollLeft / ADIM) + 1, true);
          if (e.key === 'ArrowLeft') git(Math.round(kemerSerit.scrollLeft / ADIM) - 1, true);
        });

        /* Dizin aç/kapa */
        var dizinBtn = document.getElementById('dizin-btn');
        var dizinEtiket = document.getElementById('dizin-etiket');
        dizinBtn.addEventListener('click', function () {
          var acik = dizinBtn.getAttribute('aria-expanded') === 'true';
          dizinBtn.setAttribute('aria-expanded', String(!acik));
          dizinGovde.hidden = acik;
          dizinEtiket.textContent = acik ? '28 salon' : 'Gizle';
        });

        /* Başlangıç konumu: Hollanda Altın Çağı (index 9) veya ?pos=9.46 geçiş karesi */
        var basPos = q.has('pos') ? parseFloat(q.get('pos')) : 9;
        if (isNaN(basPos)) basPos = 9;
        if (Math.abs(basPos - Math.round(basPos)) > 0.01) {
          kemerSerit.style.scrollSnapType = 'none';
        }
        kemerSerit.scrollLeft = basPos * ADIM;
        cizKonum(basPos, false);
        requestAnimationFrame(function () {
          var aktifBtn = donemBtnMap[AKIMLAR[Math.round(basPos)].donem];
          if (aktifBtn) {
            donemSeridi.scrollLeft = Math.max(0, aktifBtn.offsetLeft - (donemSeridi.clientWidth - aktifBtn.offsetWidth) / 2);
          }
          cizKonum(basPos, false);
        });
      })();
    </script>
  </body>
</html>
