<!doctype html>
<html lang="tr" data-tema="gece" data-donem="barok">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galeri · Akımlar · Yön 2 — Kemerlerin Yayı</title>
    <style>
      @font-face {
        font-family: 'Bodoni Moda';
        src: url('../../NoraSanat/YaziTipleri/BodoniModa.ttf') format('truetype');
        font-weight: 400 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader.ttf') format('truetype');
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader-Italic.ttf') format('truetype');
        font-weight: 200 800;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Archivo';
        src: url('../../NoraSanat/YaziTipleri/Archivo.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      /* =====================================================================
         Sanat Atlası — Tema değişkenleri (Gece & Gündüz)
         ===================================================================== */
      :root,
      :root[data-tema='gece'] {
        --bg: #121110;
        --bg-rgb: 18, 17, 16;
        --surface: #1c1a18;
        --surface-cam: rgba(24, 22, 20, 0.9);
        --border: #2e2b28;
        --border-ince: rgba(235, 229, 218, 0.09);
        --ink: #ebe5da;
        --ink-rgb: 235, 229, 218;
        --ink-2: #aca498;
        --ink-3: #8a8379;
        --pirinc: #c9a45c;
        --pirinc-rgb: 201, 164, 92;
        --tab-bg: rgba(24, 22, 20, 0.84);
        --overlay-btn: rgba(24, 22, 20, 0.62);
        --doku: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.04;
        --hale-karisim: normal;
        --hale-1-op: 0.44;
        --hale-2-op: 0.32;
        --hale-orta-op: 0.24;
        --kart-golge: 0 26px 56px rgba(0, 0, 0, 0.52);
        --kart-golge-yan: 0 14px 28px rgba(0, 0, 0, 0.28);
        --sekme-golge: 0 10px 30px rgba(0, 0, 0, 0.46);
        --kemer-alt-golge: rgba(18, 17, 16, 0.32);
        --kilit-pece: rgba(18, 17, 16, 0.26);
        --yay-parilti: rgba(201, 164, 92, 0.22);
        --sayfa-zemin: #0c0b0a;
        color-scheme: dark;
      }

      :root[data-tema='gunduz'] {
        --bg: #ece8e1;
        --bg-rgb: 236, 232, 225;
        --surface: #f7f5f1;
        --surface-cam: rgba(247, 245, 241, 0.94);
        --border: #d6d0c6;
        --border-ince: rgba(31, 27, 23, 0.09);
        --ink: #1f1b17;
        --ink-rgb: 31, 27, 23;
        --ink-2: #4c463f;
        --ink-3: #686057;
        --pirinc: #8c661c;
        --pirinc-rgb: 140, 102, 28;
        --tab-bg: rgba(247, 245, 241, 0.88);
        --overlay-btn: rgba(247, 245, 241, 0.82);
        --doku: radial-gradient(rgba(31, 27, 23, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.045;
        --hale-karisim: multiply;
        --hale-1-op: 0.34;
        --hale-2-op: 0.24;
        --hale-orta-op: 0.16;
        --kart-golge: 0 22px 46px rgba(20, 17, 14, 0.17);
        --kart-golge-yan: 0 10px 22px rgba(20, 17, 14, 0.09);
        --sekme-golge: 0 10px 28px rgba(20, 17, 14, 0.12);
        --kemer-alt-golge: rgba(20, 17, 14, 0.14);
        --kilit-pece: rgba(236, 232, 225, 0.24);
        --yay-parilti: rgba(140, 102, 28, 0.18);
        --sayfa-zemin: #e2ddd4;
        color-scheme: light;
      }

      :root {
        --serif: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
        --sans: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --okuma: 'Newsreader', 'Iowan Old Style', Georgia, serif;
        --hale-1-rgb: 62, 117, 163;
        --hale-2-rgb: 176, 134, 62;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--sayfa-zemin);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      .onizleme-ust {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 28px;
        background: var(--tab-bg);
        border-bottom: 1px solid var(--border);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
      }
      .onizleme-baslik {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .onizleme-baslik .ust-not {
        font: 600 13px/1.3 var(--sans);
        color: var(--pirinc);
      }
      .onizleme-baslik h1 {
        margin: 0;
        font: 500 22px/1.15 var(--serif);
        letter-spacing: -0.01em;
      }
      .tema-kabi {
        display: inline-flex;
        padding: 4px;
        gap: 2px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
      }
      .tema-kabi button {
        min-height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        font: 600 13px/1 var(--sans);
        cursor: pointer;
      }
      .tema-kabi button[aria-pressed='true'] {
        background: rgba(var(--ink-rgb), 0.14);
        color: var(--ink);
      }

      .sahne {
        display: flex;
        justify-content: center;
        padding: 32px 20px 64px;
      }

      /* 390 × 844 iPhone */
      .telefon {
        position: relative;
        width: 390px;
        height: 844px;
        border-radius: 44px;
        overflow: hidden;
        background-color: var(--bg);
        border: 1px solid var(--border);
        box-shadow: 0 32px 84px rgba(0, 0, 0, 0.44);
        isolation: isolate;
      }

      .zemin-doku {
        position: absolute;
        inset: 0;
        z-index: 0;
        background-image: var(--doku);
        background-size: 3px 3px;
        pointer-events: none;
      }
      .zemin-hale {
        position: absolute;
        inset: 0;
        z-index: 1;
        mix-blend-mode: var(--hale-karisim);
        background:
          radial-gradient(122% 58% at 0% 0%, rgba(var(--hale-1-rgb), var(--hale-1-op)) 0%, rgba(var(--hale-1-rgb), 0.14) 48%, transparent 84%),
          radial-gradient(96% 48% at 100% 100%, rgba(var(--hale-2-rgb), var(--hale-2-op)) 0%, rgba(var(--hale-2-rgb), 0.09) 45%, transparent 80%),
          radial-gradient(66% 36% at 50% 38%, rgba(var(--hale-1-rgb), var(--hale-orta-op)) 0%, transparent 74%);
        pointer-events: none;
      }
      .zemin-desen {
        position: absolute;
        inset: 0;
        z-index: 2;
        background-color: var(--ink);
        opacity: 0;
        -webkit-mask-size: 96px 96px;
        mask-size: 96px 96px;
        -webkit-mask-repeat: repeat;
        mask-repeat: repeat;
        transition: opacity 560ms cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
      }
      .zemin-desen.aktif {
        opacity: var(--desen-opaklik);
      }

      .telefon-kaydir {
        position: relative;
        z-index: 3;
        height: 100%;
        overflow-y: auto;
        overflow-x: clip;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .telefon-kaydir::-webkit-scrollbar {
        display: none;
      }

      .durum-cubugu {
        position: sticky;
        top: 0;
        z-index: 15;
        height: 46px;
        padding: 14px 26px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font: 600 14px/1 var(--sans);
        color: var(--ink);
        pointer-events: none;
      }
      .durum-simgeler {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .ekran-ic {
        padding: 4px 20px 92px;
      }

      /* Galeri üstü */
      .galeri-ust-satir {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
      }
      .galeri-ust-satir h2 {
        margin: 0;
        font: 400 32px/1 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
        flex: none;
      }
      .arama-hapi {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 0 13px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: var(--ink-2);
        font: 400 14px/1 var(--sans);
      }
      .arama-hapi span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kalp-btn {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
        display: grid;
        place-items: center;
        color: var(--pirinc);
        text-decoration: none;
      }

      .bolumler {
        margin-top: 12px;
        padding: 4px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
        display: grid;
        grid-template-columns: 1fr 1.24fr 1fr 0.92fr;
        gap: 2px;
      }
      .bolumler button {
        min-height: 44px;
        padding: 0 6px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        font: 500 13.5px/1 var(--sans);
        cursor: pointer;
        white-space: nowrap;
      }
      .bolumler button[aria-current='page'] {
        background: rgba(var(--ink-rgb), 0.13);
        color: var(--ink);
        font-weight: 600;
      }

      /* =====================================================================
         YÖN 2 · Geniş Mimari Yayda Süzülen Kemerler (Kemerle Akan Yazı)
         ===================================================================== */
      .yay-sahne {
        margin-top: 8px;
      }

      .kemer-serit {
        margin: 0 -20px;
        padding: 10px 78px 2px;
        display: flex;
        gap: 18px;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-padding-inline: 78px;
        scrollbar-width: none;
        touch-action: pan-x pan-y;
        overscroll-behavior-x: contain;
        cursor: grab;
        user-select: none;
      }
      .kemer-serit.surukleniyor {
        scroll-snap-type: none;
        cursor: grabbing;
      }
      .kemer-serit::-webkit-scrollbar {
        display: none;
      }

      .kemer-oge {
        flex: 0 0 234px;
        width: 234px;
        min-width: 234px;
        max-width: 234px;
        overflow: visible;
        scroll-snap-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        will-change: transform, opacity;
      }

      /* Çift ince mimari çerçeve */
      .kemer-dis {
        position: relative;
        width: 234px;
        height: 278px;
        padding: 5px;
        border-radius: 117px 117px 21px 21px;
        border: 1px solid rgba(var(--pirinc-rgb), var(--dis-op, 0.14));
        box-shadow: var(--kart-golge-yan);
        transition: box-shadow 360ms ease;
      }
      .kemer-oge.odak .kemer-dis {
        box-shadow: var(--kart-golge);
      }

      .kemer-kutu {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 114px 114px 16px 16px;
        overflow: hidden;
        background: var(--surface);
      }
      .kemer-kutu::after {
        content: '';
        position: absolute;
        inset: auto 0 0;
        height: 24%;
        z-index: 2;
        background: linear-gradient(180deg, transparent 0%, var(--kemer-alt-golge) 100%);
        pointer-events: none;
      }

      .kemer-resim {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
        will-change: filter, transform;
      }
      .kemer-oge.kilitli .kemer-resim {
        filter: blur(4.4px) saturate(0.45) brightness(0.75);
        transform: scale(1.06);
      }
      :root[data-tema='gunduz'] .kemer-oge.kilitli .kemer-resim {
        filter: blur(4px) saturate(0.44) brightness(0.88) contrast(0.92);
      }

      .kilit-pece {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: radial-gradient(circle at 50% 50%, transparent 16%, var(--kilit-pece) 100%);
        display: grid;
        place-items: center;
        pointer-events: none;
      }
      .kilit-muhur {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(18, 17, 16, 0.42);
        border: 1px solid rgba(235, 229, 218, 0.24);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        display: grid;
        place-items: center;
        color: rgba(244, 236, 222, 0.9);
      }
      :root[data-tema='gunduz'] .kilit-muhur {
        background: rgba(247, 245, 241, 0.56);
        border-color: rgba(31, 27, 23, 0.16);
        color: #1f1b17;
      }

      /* Kemerle birlikte akan başlık bloğu */
      .kemer-yazi {
        width: 300px;
        margin: 10px -33px 0;
        min-height: 82px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        will-change: transform, opacity;
        pointer-events: none;
      }
      .kemer-ust {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 600 13px/1.3 var(--sans);
        color: var(--pirinc);
      }
      .kemer-ust svg {
        width: 14px;
        height: 14px;
      }
      .kemer-ad {
        margin: 4px 0 0;
        font: 500 31px/1.08 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
        text-wrap: balance;
      }
      .kemer-oge.kilitli .kemer-ad {
        color: var(--ink-2);
      }
      .kemer-durum {
        margin: 5px 0 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 400 14px/1.3 var(--sans);
        color: var(--ink-2);
      }

      /* Sabit eylem yuvası: başparmak düğmeyi kovalamaz */
      .eylem-yuva {
        margin-top: 8px;
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .salona-gir {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 46px;
        padding: 0 22px 0 26px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--bg);
        font: 600 15px/1 var(--sans);
        text-decoration: none;
        cursor: pointer;
        transition: transform 160ms ease, opacity 220ms ease;
      }
      .salona-gir:active {
        transform: scale(0.96);
      }
      .kilit-not-hap {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        color: var(--ink-2);
        font: 500 13.5px/1 var(--sans);
      }

      /* =====================================================================
         YÖN 2 · Hafif Işık Kılavuzu (Çarkın evcilleştirilmiş 54 px hali)
         Dikey sayfa kaydırmasını ASLA engellemez (touch-action: pan-y)
         ===================================================================== */
      .isik-kilavuzu {
        position: relative;
        margin: 10px -20px 0;
        height: 52px;
        touch-action: pan-y;
        user-select: none;
        overflow: hidden;
      }
      .kilavuz-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .kilavuz-satir {
        position: relative;
        z-index: 2;
        height: 100%;
        padding: 14px 16px 0;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
      }
      .kilavuz-donem-btn {
        min-height: 44px;
        border: 0;
        background: transparent;
        padding: 0 6px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font: 500 12.5px/1 var(--sans);
        color: var(--ink-3);
        cursor: pointer;
        white-space: nowrap;
      }
      .kilavuz-donem-btn.sol {
        justify-self: start;
      }
      .kilavuz-donem-btn.sag {
        justify-self: end;
      }
      .kilavuz-donem-btn:disabled {
        opacity: 0;
        pointer-events: none;
      }
      .kilavuz-orta {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 600 13px/1 var(--sans);
        color: var(--ink);
        padding: 0 10px;
      }
      .kilavuz-orta svg {
        width: 14px;
        height: 14px;
        color: var(--pirinc);
      }

      /* Altta sade "Bütün akımlar" çekmece tetikleyicisi */
      .dizin-tetik {
        margin-top: 2px;
        width: 100%;
        min-height: 44px;
        border: 0;
        background: transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: var(--ink-2);
        font: 500 13.5px/1 var(--sans);
        cursor: pointer;
      }
      .dizin-tetik small {
        color: var(--ink-3);
        font-weight: 400;
      }

      /* =====================================================================
         YÖN 2 · Alttan Kayarak Açılan Cam "Bütün akımlar" Çekmecesi (Sheet)
         ===================================================================== */
      .cekmece-perde {
        position: absolute;
        inset: 0;
        z-index: 30;
        background: rgba(12, 11, 10, 0.52);
        opacity: 0;
        pointer-events: none;
        transition: opacity 280ms ease;
      }
      .cekmece-perde.acik {
        opacity: 1;
        pointer-events: auto;
      }
      .cekmece {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 78%;
        z-index: 31;
        border-radius: 30px 30px 0 0;
        background: var(--surface-cam);
        border-top: 1px solid var(--border);
        -webkit-backdrop-filter: blur(28px) saturate(1.7);
        backdrop-filter: blur(28px) saturate(1.7);
        display: flex;
        flex-direction: column;
        transform: translateY(104%);
        transition: transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .cekmece.acik {
        transform: translateY(0);
      }
      .cekmece-tutamak {
        width: 38px;
        height: 4px;
        border-radius: 999px;
        background: rgba(var(--ink-rgb), 0.22);
        margin: 10px auto 0;
        flex: none;
      }
      .cekmece-ust {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px 10px;
        border-bottom: 1px solid var(--border-ince);
        flex: none;
      }
      .cekmece-ust h3 {
        margin: 0;
        font: 500 24px/1.1 var(--serif);
        letter-spacing: -0.01em;
      }
      .cekmece-kapat {
        width: 44px;
        height: 44px;
        margin-right: -10px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--ink-2);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .cekmece-govde {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px 36px;
        scrollbar-width: none;
      }
      .cekmece-govde::-webkit-scrollbar {
        display: none;
      }

      .donem-grup + .donem-grup {
        margin-top: 20px;
      }
      .donem-grup-bas {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        padding: 0 2px;
      }
      .donem-grup-sol {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .donem-grup-sol svg {
        width: 14px;
        height: 14px;
        color: var(--pirinc);
      }
      .donem-grup-sol b {
        font: 600 13px/1.2 var(--sans);
        color: var(--pirinc);
      }
      .donem-grup-sag {
        font: 400 12.5px/1.2 var(--sans);
        color: var(--ink-3);
      }
      .gruplu-liste {
        margin: 0;
        padding: 0;
        list-style: none;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 22px;
        overflow: hidden;
      }
      .gruplu-liste > li + li {
        border-top: 1px solid var(--border-ince);
      }
      .dizin-satir {
        width: 100%;
        border: 0;
        background: transparent;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 60px;
        padding: 10px 14px;
        text-align: left;
        cursor: pointer;
        color: var(--ink);
      }
      .dizin-satir.secili {
        background: rgba(var(--pirinc-rgb), 0.1);
      }

        flex-direction: column;

        font: 400 12.5px/1.3 var(--sans);

      }
      .dizin-sag {
        flex: none;
        color: var(--ink-3);
      }
      .dizin-sag.acik {
        color: var(--pirinc);
      }

      .sekme-cubugu {
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 14px;
        z-index: 25;
        height: 62px;
        padding: 4px;
        border-radius: 999px;
        background: var(--tab-bg);
        border: 1px solid rgba(var(--ink-rgb), 0.13);
        box-shadow: var(--sekme-golge);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        align-items: center;
      }
      .sekme-oge {
        height: 100%;
        border-radius: 999px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        text-decoration: none;
        color: var(--ink-2);
        font: 600 10.5px/1 var(--sans);
      }
      .sekme-oge.secili {
        background: rgba(var(--ink-rgb), 0.12);
        color: var(--ink);
      }

      /* PNG dışa aktarım kipi */
      :root[data-goruntu] body {
        background: var(--bg);
      }
      :root[data-goruntu] .onizleme-ust {
        display: none;

      :root[data-goruntu] .sahne {
        padding: 0;
        display: block;
      }
      :root[data-goruntu] .telefon {
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

          { ad: 'Sembolizm', donem: 'postempresyonizm', yillar: '1824–1921', acik: false, acikS: 0, toplam: 5, konu: 59, img: 'gorseller/22-sembolizm.jpg', poz: '50% 34%', h1: [158, 108, 56], h2: [112, 82, 138] },
          { ad: 'Art Nouveau ve Viyana Secession', donem: 'postempresyonizm', yillar: '1862–1918', acik: false, acikS: 0, toplam: 1, konu: 62, img: 'gorseller/23-art-nouveau.jpg', poz: '50% 30%', h1: [184, 146, 58], h2: [108, 134, 68] },
          { ad: 'Ekspresyonizm', donem: 'modern', yillar: '1863–1956', acik: false, acikS: 0, toplam: 5, konu: 62, img: 'gorseller/24-ekspresyonizm.jpg', poz: '50% 38%', h1: [186, 88, 58], h2: [66, 98, 142] },
          { ad: 'Kübizm', donem: 'modern', yillar: '1881–1973', acik: false, acikS: 0, toplam: 1, konu: 63, img: 'gorseller/25-kubizm.jpg', poz: '50% 28%', h1: [76, 134, 174], h2: [176, 136, 74] },
          { ad: 'Dada', donem: 'modern', yillar: '1886–1978', acik: false, acikS: 0, toplam: 4, konu: 64, img: 'gorseller/26-dada.jpg', poz: '50% 42%', h1: [182, 106, 70], h2: [68, 102, 166] },
          { ad: 'Sürrealizm', donem: 'modern', yillar: '1891–1989', acik: false, acikS: 0, toplam: 4, konu: 65, img: 'gorseller/27-surrealizm.jpg', poz: '50% 38%', h1: [192, 114, 66], h2: [164, 148, 62] },
          { ad: 'Savaş sonrası figürasyon', donem: 'modern', yillar: '1909–1992', acik: false, acikS: 0, toplam: 1, konu: 66, img: 'gorseller/28-savas-sonrasi.jpg', poz: '50% 24%', h1: [194, 134, 62], h2: [84, 116, 128] },
        ];

        function bulunma(n) {
          var s = n % 10;
          if ([3, 4, 5].indexOf(s) >= 0) return n + '’te';
          if (s === 0 && [40, 60, 70].indexOf(n) >= 0) return n + '’ta';
          if ([1, 2, 7, 8].indexOf(s) >= 0 || n === 20 || n === 50) return n + '’de';
          return n + '’da';
        }
        function sembolSvg(id) {
          return (
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            DONEMLER[id].svg +
            '</svg>'
          );
        }
        function kilitSvg(w) {
          return (
            '<svg width="' +
            w +
            '" height="' +
            w +
            '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
          );
        }

        var kemerSerit = document.getElementById('kemer-serit');
        var eylemYuva = document.getElementById('eylem-yuva');
        var kilavuz = document.getElementById('isik-kilavuzu');
        var centikG = document.getElementById('kilavuz-centikler');
        var oncekiDonemBtn = document.getElementById('onceki-donem');
        var sonrakiDonemBtn = document.getElementById('sonraki-donem');
        var oncekiDonemAd = document.getElementById('onceki-donem-ad');
        var sonrakiDonemAd = document.getElementById('sonraki-donem-ad');
        var kilavuzOrta = document.getElementById('kilavuz-orta');
        var desenA = document.getElementById('desen-a');
        var desenB = document.getElementById('desen-b');
        var dizinGovde = document.getElementById('dizin-govde');
        var cekmece = document.getElementById('cekmece');
        var cekmecePerde = document.getElementById('cekmece-perde');

        /* 28 kemerli kart — her kemerin kendi bağlı yazısı birlikte akar */
        var kartlar = [];
        AKIMLAR.forEach(function (a, i) {
          var durum = a.acik
            ? a.acikS === a.toplam
              ? a.toplam + ' sanatçının hepsi açık'
              : a.acikS + ' / ' + a.toplam + ' sanatçı açık'
            : kilitSvg(13) + '<span>Konu ' + bulunma(a.konu) + ' açılır</span>';
          var el = document.createElement('article');
          el.className = 'kemer-oge' + (a.acik ? '' : ' kilitli');
          el.dataset.idx = String(i);
          el.innerHTML =
            '<div class="kemer-dis">' +
            '<div class="kemer-kutu">' +
            '<img class="kemer-resim" src="' +
            a.img +
            '" style="object-position:' +
            a.poz +
            '" alt="' +
            a.ad +
            '" decoding="async" />' +
            (a.acik ? '' : '<span class="kilit-pece"><span class="kilit-muhur">' + kilitSvg(18) + '</span></span>') +
            '</div>' +
            '</div>' +
            '<div class="kemer-yazi">' +
            '<span class="kemer-ust">' +
            sembolSvg(a.donem) +
            '<span>' +
            a.yillar +
            '</span></span>' +
            '<h3 class="kemer-ad">' +
            a.ad +
            '</h3>' +
            '<p class="kemer-durum">' +
            durum +
            '</p>' +
            '</div>';
          el.addEventListener('click', function () {
            if (!suruklendi) git(i, true);
          });
          kemerSerit.appendChild(el);
          kartlar.push({
            el: el,
            dis: el.querySelector('.kemer-dis'),
            img: el.querySelector('.kemer-resim'),
            yazi: el.querySelector('.kemer-yazi'),
          });
        });

        /* Cam çekmece içi 28 akım dizini */
        DONEM_SIRA.forEach(function (id) {
          var grup = AKIMLAR.map(function (a, i) {
            return { a: a, i: i };
          }).filter(function (x) {
            return x.a.donem === id;
          });
          var acikAdet = grup.filter(function (x) {
            return x.a.acik;
          }).length;
          var secEl = document.createElement('div');
          secEl.className = 'donem-grup';
          secEl.innerHTML =
            '<div class="donem-grup-bas"><span class="donem-grup-sol">' +
            sembolSvg(id) +
            '<b>' +
            DONEMLER[id].ad +
            '</b></span><span class="donem-grup-sag">' +
            (acikAdet ? acikAdet + ' açık' : 'Konu ' + bulunma(grup[0].a.konu)) +
            '</span></div>';
          var ul = document.createElement('ul');
          ul.className = 'gruplu-liste';
          grup.forEach(function (x) {
            var a = x.a;
            var li = document.createElement('li');
            var durum = a.acik
              ? a.acikS === a.toplam
                ? a.toplam + ' sanatçının hepsi açık'
                : a.acikS + ' / ' + a.toplam + ' sanatçı açık'
              : 'Konu ' + bulunma(a.konu) + ' açılır';
            li.innerHTML =
              '<button type="button" class="dizin-satir' +
              (a.acik ? '' : ' kilitli') +
              '" data-dizin-idx="' +
              x.i +
              '">' +
              '<span class="dizin-pul"><img src="' +
              a.img +
              '" style="object-position:' +
              a.poz +
              '" alt="" loading="lazy" /></span>' +
              '<span class="dizin-orta"><b>' +
              a.ad +
              '</b><small>' +
              a.yillar +
              ' · ' +
              durum +
              '</small></span>' +
              '<span class="dizin-sag' +
              (a.acik ? ' acik' : '') +
              '">' +
              (a.acik
                ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'
                : kilitSvg(14)) +
              '</span></button>';
            li.querySelector('button').addEventListener('click', function () {
              cekmeceKapa();
              git(x.i, true);
            });
            ul.appendChild(li);
          });
          secEl.appendChild(ul);
          dizinGovde.appendChild(secEl);
        });

        /* Işık kılavuzu çentiklerini çiz (yay boyunca p ile kayar) */
        function centikCiz(p) {
          var kayma = -((p * 14) % 14);
          var out = '';
          for (var x = 28 + kayma; x <= 362; x += 14) {
            var u = (x - 195) / 177;
            if (Math.abs(u) > 0.96) continue;
            var y = 14 + 10 * u * u;
            var alpha = (1 - u * u) * 0.65;
            out += '<line x1="' + x.toFixed(1) + '" y1="' + (y + 3).toFixed(1) + '" x2="' + x.toFixed(1) + '" y2="' + (y + 8).toFixed(1) + '" opacity="' + alpha.toFixed(2) + '"/>';
          }
          centikG.innerHTML = out;
        }

        var ADIM = 234 + 18;
        var aktifDonem = '';
        var desenTers = false;
        var sonYuvarlak = -1;

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }
        function smoothstep(t) {
          var c = Math.max(0, Math.min(1, t));
          return c * c * (3 - 2 * c);
        }

        function desenGec(donem) {
          if (donem === aktifDonem) return;
          aktifDonem = donem;
          root.setAttribute('data-donem', donem);
          var url = "url('../../NoraSanat/Ekranlar/Galeri/Desenler/desen-" + donem + "@3x.png')";
          var gelen = desenTers ? desenA : desenB;
          var giden = desenTers ? desenB : desenA;
          desenTers = !desenTers;
          gelen.style.webkitMaskImage = url;
          gelen.style.maskImage = url;
          gelen.classList.add('aktif');
          giden.classList.remove('aktif');
        }

        function cizKonum(p) {
          p = Math.max(0, Math.min(AKIMLAR.length - 1, p));
          var i0 = Math.floor(p);
          var i1 = Math.min(AKIMLAR.length - 1, i0 + 1);
          var f = p - i0;
          var ef = smoothstep(f);

          /* İki renkli tablo halesi kesintisiz harmanlanır */
          var a0 = AKIMLAR[i0];
          var a1 = AKIMLAR[i1];
          root.style.setProperty(
            '--hale-1-rgb',
            Math.round(lerp(a0.h1[0], a1.h1[0], ef)) + ', ' + Math.round(lerp(a0.h1[1], a1.h1[1], ef)) + ', ' + Math.round(lerp(a0.h1[2], a1.h1[2], ef))
          );
          root.style.setProperty(
            '--hale-2-rgb',
            Math.round(lerp(a0.h2[0], a1.h2[0], ef)) + ', ' + Math.round(lerp(a0.h2[1], a1.h2[1], ef)) + ', ' + Math.round(lerp(a0.h2[2], a1.h2[2], ef))
          );

          /* Geniş mimari yay hareketi: yumuşak eğim ±2.6°, hafif yay düşüşü 15px, pürüzsüz yazı nefesi */
          for (var i = 0; i < kartlar.length; i++) {
            var d = i - p;
            var ad = Math.min(1.4, Math.abs(d));
            var yakinlik = Math.cos((Math.min(1, ad) * Math.PI) / 2);
            var olcek = 0.89 + 0.11 * yakinlik;
            var y = (1 - yakinlik) * 15;
            var aci = Math.max(-3.2, Math.min(3.2, d * 2.6));
            var op = 0.64 + 0.36 * yakinlik;
            var disOp = (0.10 + 0.62 * yakinlik).toFixed(3);

            var k = kartlar[i];
            k.el.style.transform = 'translate3d(0,' + y.toFixed(2) + 'px,0) rotate(' + aci.toFixed(2) + 'deg) scale(' + olcek.toFixed(4) + ')';
            k.el.style.opacity = op.toFixed(3);
            k.dis.style.setProperty('--dis-op', disOp);
            k.el.classList.toggle('odak', ad < 0.35);

            if (AKIMLAR[i].acik) {
              var parlak = (0.86 + 0.14 * yakinlik).toFixed(3);
              k.img.style.filter = 'brightness(' + parlak + ')';
            }

            /* Kemere bağlı yazı: çakışmadan, yayla birlikte usulca nefes alır */
            var yaziOp = Math.pow(Math.max(0, 1 - ad / 0.58), 1.15);
            var yaziY = (1 - yakinlik) * 7;
            k.yazi.style.opacity = yaziOp.toFixed(3);
            k.yazi.style.transform = 'translate3d(0,' + yaziY.toFixed(2) + 'px,0)';
          }

          /* Işık kılavuzu çentikleri şerit ile birebir akar */
          centikCiz(p);

          /* Eylem yuvası: açık ↔ kilitli sınırında yumuşak geçiş */
          var yuvarlak = Math.round(p);
          if (yuvarlak !== sonYuvarlak) {
            sonYuvarlak = yuvarlak;
            var a = AKIMLAR[yuvarlak];
            desenGec(a.donem);

            eylemYuva.innerHTML = a.acik
              ? '<a class="salona-gir" href="#salon">Salona gir<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></a>'
              : '<span class="kilit-not-hap">' + kilitSvg(14) + '<span>' + a.toplam + ' sanatçı · yakında</span></span>';

            var dIdx = DONEM_SIRA.indexOf(a.donem);
            kilavuzOrta.innerHTML = sembolSvg(a.donem) + '<span>' + DONEMLER[a.donem].kisa + '</span>';
            oncekiDonemBtn.disabled = dIdx <= 0;
            sonrakiDonemBtn.disabled = dIdx >= DONEM_SIRA.length - 1;
            oncekiDonemAd.textContent = dIdx > 0 ? DONEMLER[DONEM_SIRA[dIdx - 1]].kisa : '';
            sonrakiDonemAd.textContent = dIdx < DONEM_SIRA.length - 1 ? DONEMLER[DONEM_SIRA[dIdx + 1]].kisa : '';

            dizinGovde.querySelectorAll('.dizin-satir').forEach(function (s) {
              s.classList.toggle('secili', Number(s.dataset.dizinIdx) === yuvarlak);
            });
          }

          /* Düğme geçiş anında hafifçe nefes alır */
          if (a0.acik !== a1.acik) {
            var esik = Math.abs(f - 0.5) * 2;
            eylemYuva.style.opacity = (0.38 + 0.62 * esik).toFixed(3);
          } else {
            eylemYuva.style.opacity = '1';
          }
        }

        function git(idx, yumusak) {
          idx = Math.max(0, Math.min(AKIMLAR.length - 1, idx));
          kemerSerit.scrollTo({ left: idx * ADIM, behavior: yumusak ? 'smooth' : 'auto' });
        }

        var raf = 0;
        kemerSerit.addEventListener(
          'scroll',
          function () {
            if (raf) return;
            raf = requestAnimationFrame(function () {
              raf = 0;
              cizKonum(kemerSerit.scrollLeft / ADIM);
            });
          },
          { passive: true }
        );

        /* Işık kılavuzunda dönem atlama düğmeleri + yalnızca açıkça yatay sürükleme */
        oncekiDonemBtn.addEventListener('click', function () {
          var dIdx = DONEM_SIRA.indexOf(AKIMLAR[sonYuvarlak].donem);
          if (dIdx > 0) {
            var hedefId = DONEM_SIRA[dIdx - 1];
            git(
              AKIMLAR.findIndex(function (x) {
                return x.donem === hedefId;
              }),
              true
            );
          }
        });
        sonrakiDonemBtn.addEventListener('click', function () {
          var dIdx = DONEM_SIRA.indexOf(AKIMLAR[sonYuvarlak].donem);
          if (dIdx < DONEM_SIRA.length - 1) {
            var hedefId = DONEM_SIRA[dIdx + 1];
            git(
              AKIMLAR.findIndex(function (x) {
                return x.donem === hedefId;
              }),
              true
            );
          }
        });

        /* Kılavuz üzerinde yatay parmak/fare süpürmesi (dikey hareketi hiç yakalamaz) */
        var kSuruk = null;
        kilavuz.addEventListener('pointerdown', function (e) {
          if (e.target.closest('button')) return;
          kSuruk = { x: e.clientX, y: e.clientY, sl: kemerSerit.scrollLeft, yatay: false };
        });
        kilavuz.addEventListener('pointermove', function (e) {
          if (!kSuruk) return;
          var dx = e.clientX - kSuruk.x;
          var dy = e.clientY - kSuruk.y;
          if (!kSuruk.yatay) {
            if (Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx)) {
              kSuruk = null;
              return;
            }
            if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.4) {
              kSuruk.yatay = true;
              kemerSerit.classList.add('surukleniyor');
            }
          }
          if (kSuruk && kSuruk.yatay) {
            kemerSerit.scrollLeft = kSuruk.sl - dx * 1.5;
          }
        });
        function kBirak() {
          if (!kSuruk) return;
          var y = kSuruk.yatay;
          kSuruk = null;
          if (y) {
            kemerSerit.classList.remove('surukleniyor');
            git(Math.round(kemerSerit.scrollLeft / ADIM), true);
          }
        }
        kilavuz.addEventListener('pointerup', kBirak);
        kilavuz.addEventListener('pointercancel', kBirak);

        /* Masaüstü fare sürüklemesi */
        var fare = null;
        var suruklendi = false;
        kemerSerit.addEventListener('mousedown', function (e) {
          if (e.button !== 0) return;
          fare = { x: e.clientX, sl: kemerSerit.scrollLeft, sonX: e.clientX, sonT: performance.now(), v: 0 };
          suruklendi = false;
          kemerSerit.classList.add('surukleniyor');
        });
        window.addEventListener('mousemove', function (e) {
          if (!fare) return;
          var dx = e.clientX - fare.x;
          if (Math.abs(dx) > 5) suruklendi = true;
          var now = performance.now();
          fare.v = (e.clientX - fare.sonX) / Math.max(1, now - fare.sonT);
          fare.sonX = e.clientX;
          fare.sonT = now;
          kemerSerit.scrollLeft = fare.sl - dx;
        });
        window.addEventListener('mouseup', function () {
          if (!fare) return;
          var v = fare.v;
          fare = null;
          kemerSerit.classList.remove('surukleniyor');
          if (suruklendi) {
            git(Math.round(kemerSerit.scrollLeft / ADIM - v * 0.42), true);
            setTimeout(function () {
              suruklendi = false;
            }, 60);
          }
        });

        window.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') cekmeceKapa();
          if (e.key === 'ArrowRight') git(Math.round(kemerSerit.scrollLeft / ADIM) + 1, true);
          if (e.key === 'ArrowLeft') git(Math.round(kemerSerit.scrollLeft / ADIM) - 1, true);
        });

        /* Cam çekmece aç/kapa */
        function cekmeceAc() {
          cekmece.classList.add('acik');
          cekmecePerde.classList.add('acik');
        }
        function cekmeceKapa() {
          cekmece.classList.remove('acik');
          cekmecePerde.classList.remove('acik');
        }
        document.getElementById('dizin-ac').addEventListener('click', cekmeceAc);
        document.getElementById('cekmece-kapat').addEventListener('click', cekmeceKapa);
        cekmecePerde.addEventListener('click', cekmeceKapa);

        var basPos = q.has('pos') ? parseFloat(q.get('pos')) : 9;
        if (isNaN(basPos)) basPos = 9;
        if (Math.abs(basPos - Math.round(basPos)) > 0.01) {
          kemerSerit.style.scrollSnapType = 'none';
        }
        kemerSerit.scrollLeft = basPos * ADIM;
        cizKonum(basPos);
      })();
    </script>
  </body>
</html>
