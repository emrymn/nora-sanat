<!doctype html>
<html lang="tr" data-tema="gece" data-hareket="tam">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soru Ekranı · Yön 2 — Müze Spotu ve Kesintisiz Üst Şerit</title>
    <style>
      @font-face {
        font-family: 'Bodoni Moda';
        src: url('../../NoraSanat/YaziTipleri/BodoniModa.ttf') format('truetype');
        font-weight: 400 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Bodoni Moda';
        src: url('../../NoraSanat/YaziTipleri/BodoniModa-Italic.ttf') format('truetype');
        font-weight: 400 900;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader.ttf') format('truetype');
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader-Italic.ttf') format('truetype');
        font-weight: 200 800;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Archivo';
        src: url('../../NoraSanat/YaziTipleri/Archivo.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      /* =====================================================================
         Yön 2 · Müze Spotu ve Kesintisiz Üst Şerit
         Kutusuz üst nokta izi (uzayan aktif kapsül), bulanık tablo ışığı ve
         iki katmanlı ince cam soru tepsisi
         ===================================================================== */
      :root,
      :root[data-tema='gece'] {
        --bg: #121110;
        --bg-rgb: 18, 17, 16;
        --surface: #1c1a18;
        --surface-cam: rgba(24, 22, 20, 0.78);
        --border: #2e2b28;
        --border-ince: rgba(235, 229, 218, 0.11);
        --ink: #ebe5da;
        --ink-rgb: 235, 229, 218;
        --ink-2: #aca498;
        --ink-3: #8a8379;
        --pirinc: #c9a45c;
        --pirinc-rgb: 201, 164, 92;
        --right: #6fb487;
        --right-bg: rgba(111, 180, 135, 0.16);
        --wrong: #d66854;
        --wrong-bg: rgba(214, 104, 84, 0.16);
        --overlay-btn: rgba(18, 17, 16, 0.54);
        --secenek-bg: rgba(235, 229, 218, 0.05);
        --doku: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.038;
        --desen-filtre: invert(1);
        --isik-opaklik: 0.24;
        --golge-resim: 0 26px 56px rgba(0, 0, 0, 0.62);
        --golge-tepsi: 0 18px 42px rgba(0, 0, 0, 0.44);
        --sayfa-zemin: #0a0908;
        color-scheme: dark;
      }

      :root[data-tema='gunduz'] {
        --bg: #ece8e1;
        --bg-rgb: 236, 232, 225;
        --surface: #f7f5f1;
        --surface-cam: rgba(247, 245, 241, 0.88);
        --border: #d6d0c6;
        --border-ince: rgba(31, 27, 23, 0.1);
        --ink: #1f1b17;
        --ink-rgb: 31, 27, 23;
        --ink-2: #4c463f;
        --ink-3: #665f56;
        --pirinc: #8a651c;
        --pirinc-rgb: 138, 101, 28;
        --right: #2a6644;
        --right-bg: rgba(42, 102, 68, 0.12);
        --wrong: #9a3726;
        --wrong-bg: rgba(154, 55, 38, 0.11);
        --overlay-btn: rgba(247, 245, 241, 0.84);
        --secenek-bg: rgba(31, 27, 23, 0.042);
        --doku: radial-gradient(rgba(31, 27, 23, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.044;
        --desen-filtre: none;
        --isik-opaklik: 0.11;
        --golge-resim: 0 18px 36px rgba(20, 17, 14, 0.16);
        --golge-tepsi: 0 14px 30px rgba(20, 17, 14, 0.1);
        --sayfa-zemin: #dfd9cf;
        color-scheme: light;
      }

      :root {
        --serif: 'Bodoni Moda', Georgia, serif;
        --okuma: 'Newsreader', Georgia, serif;
        --sans: 'Archivo', system-ui, -apple-system, sans-serif;
        --sure: 280ms;
        --tel-w: 390px;
        --tel-h: 844px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--sayfa-zemin);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      .onizleme-cubuk {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 6px 10px;
        padding: 10px 14px;
        background: rgba(var(--bg-rgb), 0.94);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(18px);
      }

      .onizleme-ad {
        font: 600 13px/1.2 var(--sans);
        color: var(--pirinc);
        margin-right: 4px;
      }

      .grup-hap {
        display: inline-flex;
        align-items: center;
        padding: 3px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--border);
        gap: 2px;
      }

      .grup-hap button {
        border: 0;
        background: transparent;
        color: var(--ink-2);
        font: 500 12px/1 var(--sans);
        padding: 6px 10px;
        border-radius: 999px;
        cursor: pointer;
      }

      .grup-hap button[aria-pressed='true'] {
        background: var(--ink);
        color: var(--bg);
      }

      .sahne-sar {
        display: flex;
        justify-content: center;
        padding: 22px 12px 44px;
      }

      .telefon {
        position: relative;
        width: var(--tel-w);
        height: var(--tel-h);
        border-radius: 44px;
        overflow: hidden;
        background-color: var(--bg);
        background-image: var(--doku);
        background-size: 3px 3px;
        border: 1px solid var(--border);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
        isolation: isolate;
      }

      .telefon.kucuk {
        --tel-w: 375px;
        --tel-h: 667px;
        border-radius: 30px;
      }

      body.goruntu-modu {
        background: var(--bg);
      }
      body.goruntu-modu .onizleme-cubuk {
        display: none;
      }
      body.goruntu-modu .sahne-sar {
        padding: 0;
        display: block;
      }
      body.goruntu-modu .telefon {
        border-radius: 0;
        border: 0;
        box-shadow: none;
      }

      /* SoruIsigi: tablonun kendi bulanık ışığı (akım rengi yok) */
      .soru-isik {
        position: absolute;
        inset: -30px -30px auto;
        height: 62%;
        z-index: 0;
        background-size: cover;
        background-position: center;
        filter: blur(46px) saturate(1.25);
        opacity: var(--isik-opaklik);
        -webkit-mask-image: linear-gradient(180deg, #000 30%, transparent 100%);
        mask-image: linear-gradient(180deg, #000 30%, transparent 100%);
        pointer-events: none;
      }

      .zemin-desen {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background-image: url('../../NoraSanat/Ekranlar/Galeri/Desenler/desen-ronesans@3x.png');
        background-size: 96px 96px;
        opacity: var(--desen-opaklik);
        filter: var(--desen-filtre);
      }

      .durum-cubugu {
        position: relative;
        z-index: 6;
        height: 44px;
        padding: 14px 24px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font: 600 13px/1 var(--sans);
        flex: none;
      }

      .telefon.kucuk .durum-cubugu {
        height: 26px;
        padding: 6px 18px 0;
        font-size: 12px;
      }

      .durum-sag {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .ekran {
        position: relative;
        z-index: 2;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Kutusuz, sakin üst şerit: solda cam X, ortada uzayan aktif kapsüllü nokta izi, sağda yalın rakam */
      .ust-serit {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 2px 18px 4px;
        flex: none;
      }

      .cam-yuvarlak {
        width: 44px;
        height: 44px;
        flex: none;
        border-radius: 50%;
        border: 1px solid var(--border-ince);
        background: var(--overlay-btn);
        backdrop-filter: blur(22px) saturate(1.5);
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .nokta-hat {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .nokta {
        width: 5px;
        height: 5px;
        border-radius: 99px;
        background: rgba(var(--ink-rgb), 0.24);
        transition: width var(--sure) ease, background var(--sure) ease;
      }

      .nokta.dogru {
        background: var(--right);
      }

      .nokta.yanlis {
        background: var(--wrong);
      }

      .nokta.simdi {
        width: 18px;
        background: var(--ink);
      }

      .sayac-yalın {
        min-width: 44px;
        text-align: right;
        font: 500 13px/1 var(--sans);
        font-variant-numeric: tabular-nums;
        color: var(--ink-2);
      }

      .sahne {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 0 18px 18px;
      }

      .telefon.kucuk .sahne {
        padding: 0 14px 12px;
      }

      .eser-alan {
        flex: 1;
        min-height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 2px 14px;
      }

      .telefon.kucuk .eser-alan {
        padding: 4px 2px 10px;
      }

      .eser-btn {
        border: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
        max-width: 100%;
        max-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .eser-btn img {
        display: block;
        max-width: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 14px;
        box-shadow: var(--golge-resim);
        transition: max-height var(--sure) cubic-bezier(0.22, 1, 0.36, 1);
      }

      .eser-alan.dikey .eser-btn img {
        max-height: 418px;
      }
      .eser-alan.yatay .eser-btn img {
        max-height: 316px;
      }
      .eser-alan.kare .eser-btn img {
        max-height: 374px;
      }

      .telefon.kucuk .eser-alan.dikey .eser-btn img {
        max-height: 296px;
      }
      .telefon.kucuk .eser-alan.yatay .eser-btn img {
        max-height: 230px;
      }
      .telefon.kucuk .eser-alan.kare .eser-btn img {
        max-height: 280px;
      }

      .sahne.cevapli .eser-alan {
        flex: 1;
        padding: 4px 2px 12px;
      }
      .sahne.cevapli .eser-alan .eser-btn img {
        max-height: 316px;
      }
      .telefon.kucuk .sahne.cevapli .eser-alan .eser-btn img {
        max-height: 196px;
      }

      .hata-kutu {
        width: 248px;
        padding: 28px 20px;
        border-radius: 22px;
        background: var(--surface);
        border: 1px solid var(--border);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .hata-kutu p {
        margin: 0;
        font: 400 14.5px/1.45 var(--sans);
        color: var(--ink-2);
      }

      .cam-hap-btn {
        min-height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--overlay-btn);
        color: var(--ink);
        font: 500 14px/1 var(--sans);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      /* İki katmanlı cam tepsi: üst ince başlık bandı + alt şık bölümü */
      .bolunmus-tepsi {
        flex: none;
        border-radius: 26px;
        overflow: hidden;
        background: var(--surface-cam);
        backdrop-filter: blur(26px) saturate(1.6);
        border: 1px solid var(--border-ince);
        box-shadow: var(--golge-tepsi);
      }

      .telefon.kucuk .bolunmus-tepsi {
        border-radius: 22px;
      }

      .tepsi-bant {
        padding: 13px 18px 11px;
        border-bottom: 1px solid var(--border-ince);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .telefon.kucuk .tepsi-bant {
        padding: 10px 15px 9px;
      }

      .tepsi-baslik {
        font: 500 21px/1.12 var(--serif);
        letter-spacing: -0.01em;
        margin: 0;
      }

      .telefon.kucuk .tepsi-baslik {
        font-size: 19px;
      }

      .tepsi-sag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font: 600 12.5px/1 var(--sans);
        color: var(--pirinc);
        white-space: nowrap;
      }

      .cift-adim {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .cift-adim i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(var(--pirinc-rgb), 0.32);
      }

      .cift-adim i.aktif {
        background: var(--pirinc);
      }

      .tepsi-govde {
        padding: 13px 14px 8px;
      }

      .telefon.kucuk .tepsi-govde {
        padding: 10px 11px 6px;
      }

      .secenekler {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .secenekler.tek {
        grid-template-columns: 1fr;
      }

      .secenek {
        min-height: 52px;
        padding: 10px 13px;
        border-radius: 15px;
        border: 1px solid transparent;
        background: var(--secenek-bg);
        color: var(--ink);
        font: 500 14.5px/1.22 var(--sans);
        text-align: left;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        cursor: pointer;
        transition: transform 130ms ease, background 160ms ease, border-color 160ms ease;
      }

      .telefon.kucuk .secenek {
        min-height: 46px;
        padding: 8px 11px;
        font-size: 13.5px;
      }

      .secenek:active {
        transform: scale(0.975);
      }

      .secenek.dogru {
        background: var(--right-bg);
        border-color: var(--right);
      }

      .secenek.yanlis {
        background: var(--wrong-bg);
        border-color: var(--wrong);
        animation: sarsil 280ms ease;
      }

      @keyframes sarsil {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-4px);
        }
        65% {
          transform: translateX(4px);
        }
      }

      .secenek-ikon {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--bg);
      }

      .secenek.dogru .secenek-ikon {
        background: var(--right);
      }

      .secenek.yanlis .secenek-ikon {
        background: var(--wrong);
      }

      .bilmiyorum-sar {
        display: flex;
        justify-content: center;
        margin-top: 4px;
      }

      .bilmiyorum {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        background: transparent;
        color: var(--ink-2);
        font: italic 400 15.5px/1 var(--okuma);
        cursor: pointer;
      }

      /* Cevap yaprağı geçiş önizlemesi */
      .yaprak-gecis {
        flex: none;
        margin: 10px -18px -18px;
        padding: 10px 20px 22px;
        border-radius: 26px 26px 0 0;
        background: var(--surface);
        border-top: 1px solid var(--border-ince);
        box-shadow: 0 -12px 34px rgba(0, 0, 0, 0.35);
        animation: yaprakYuksel 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .telefon.kucuk .yaprak-gecis {
        margin: 8px -14px -12px;
        padding: 8px 16px 14px;
      }

      @keyframes yaprakYuksel {
        from {
          opacity: 0;
          transform: translateY(34px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .yaprak-tutamak {
        width: 36px;
        height: 4px;
        border-radius: 99px;
        background: rgba(var(--ink-rgb), 0.22);
        margin: 0 auto 12px;
      }

      .yaprak-ust {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .yaprak-durum {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font: 600 14px/1 var(--sans);
      }

      .yaprak-durum.dogru {
        color: var(--right);
      }

      .yaprak-durum.yanlis {
        color: var(--wrong);
      }

      .yaprak-not {
        font: 400 12.5px/1 var(--sans);
        color: var(--ink-3);
      }

      .yaprak-eylemler {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .dolu-dugme {
        flex: 1;
        min-height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--bg);
        font: 600 15px/1.2 var(--sans);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
      }

      .duz-dugme {
        min-height: 44px;
        padding: 0 12px;
        border: 0;
        background: transparent;
        color: var(--ink-2);
        font: 500 14px/1 var(--sans);
        cursor: pointer;
      }

      .katman {
        position: absolute;
        inset: 0;
        z-index: 25;
        background: rgba(10, 9, 8, 0.94);
        backdrop-filter: blur(22px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .katman[hidden] {
        display: none;
      }

      .katman-resim {
        max-width: 100%;
        max-height: 74%;
        object-fit: contain;
        border-radius: 12px;
      }

      .katman-gizli-not {
        margin-top: 16px;
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(235, 229, 218, 0.08);
        border: 1px solid rgba(235, 229, 218, 0.14);
        font: 400 12.5px/1.2 var(--sans);
        color: #aca498;
      }

      .cikis-kart {
        width: 100%;
        max-width: 312px;
        padding: 22px;
        border-radius: 24px;
        background: var(--surface);
        border: 1px solid var(--border);
        text-align: center;
      }

      .cikis-kart h3 {
        font: 500 22px/1.15 var(--serif);
        margin: 0;
      }

      .cikis-kart p {
        font: 400 14px/1.45 var(--sans);
        color: var(--ink-2);
        margin: 8px 0 18px;
      }

      .cikis-dugmeler {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      [data-hareket='az'] *,
      [data-hareket='az'] *::before,
      [data-hareket='az'] *::after {
        animation: none !important;
        transition: none !important;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <nav class="onizleme-cubuk" aria-label="Soru ekranı önizleme denetimleri">
      <span class="onizleme-ad">Yön 2 · Müze Spotu</span>
      <div class="grup-hap" role="group" aria-label="Eser oranı">
        <button type="button" data-oran="dikey">Dikey</button>
        <button type="button" data-oran="yatay">Yatay</button>
        <button type="button" data-oran="kare">Kare</button>
        <button type="button" data-oran="hata">Yükleme hatası</button>
      </div>
      <div class="grup-hap" role="group" aria-label="Soru türü">
        <button type="button" data-soru-tur="sanatci">Bu eser kimin?</button>
        <button type="button" data-soru-tur="akim">Hangi akım?</button>
      </div>
      <div class="grup-hap" role="group" aria-label="Seviye">
        <button type="button" data-seviye="kolay">Kolay</button>
        <button type="button" data-seviye="orta">Orta</button>
        <button type="button" data-seviye="zor">Zor</button>
      </div>
      <div class="grup-hap" role="group" aria-label="Ekran boyutu">
        <button type="button" data-boyut="390">390×844</button>
        <button type="button" data-boyut="375">375×667</button>
      </div>
      <div class="grup-hap" role="group" aria-label="Tema">
        <button type="button" data-tema-sec="gece">Gece</button>
        <button type="button" data-tema-sec="gunduz">Gündüz</button>
      </div>
      <div class="grup-hap" role="group" aria-label="Hareket">
        <button type="button" data-hareket-sec="tam">Tam hareket</button>
        <button type="button" data-hareket-sec="az">Hareketi azalt</button>
      </div>
    </nav>

    <main class="sahne-sar">
      <section class="telefon" id="telefon" aria-label="Soru ekranı önizlemesi">
        <div class="soru-isik" id="soruIsik" aria-hidden="true"></div>
        <div class="zemin-desen" aria-hidden="true"></div>

        <div class="durum-cubugu" aria-hidden="true">
          <span>09:41</span>
          <div class="durum-sag">
            <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><rect x="0" y="6" width="2.4" height="5" rx="0.8"/><rect x="4" y="4" width="2.4" height="7" rx="0.8"/><rect x="8" y="2" width="2.4" height="9" rx="0.8"/><rect x="12" y="0" width="2.4" height="11" rx="0.8"/></svg>
            <svg width="22" height="11" viewBox="0 0 22 11" fill="none"><rect x="0.7" y="0.7" width="18.6" height="9.6" rx="2.6" stroke="currentColor" stroke-width="1.2"/><rect x="2.5" y="2.5" width="14" height="6" rx="1.2" fill="currentColor"/><rect x="20.4" y="3.6" width="1.4" height="3.8" rx="0.7" fill="currentColor"/></svg>
          </div>
        </div>

        <div class="ekran" id="ekran"></div>

        <div class="katman" id="buyutKatman" hidden>
          <button type="button" class="cam-yuvarlak" id="buyutKapat" aria-label="Kapat" style="position:absolute;top:48px;right:18px;color:#ebe5da;background:rgba(24,22,20,0.72);border-color:rgba(235,229,218,0.18);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
          <img class="katman-resim" id="buyutImg" src="gorseller/01-van-eyck-arnolfini.jpg" alt="Yakın inceleme" />
          <span class="katman-gizli-not">Eser adı cevaptan sonra görünür</span>
        </div>

        <div class="katman" id="cikisKatman" hidden>
          <div class="cikis-kart">
            <h3>Turdan çıkılsın mı?</h3>
            <p>Kaldığın soru saklanır. Haritadan istediğin zaman sürdürebilirsin.</p>
            <div class="cikis-dugmeler">
              <button type="button" class="dolu-dugme" id="cikisDevam">Tura devam et</button>
              <button type="button" class="duz-dugme" id="cikisOnay">Haritaya dön</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const ESERLER = {
        dikey: {
          src: 'gorseller/01-van-eyck-arnolfini.jpg',
          yedekSrc: 'gorseller/03-van-eyck-kirmizi-sarik.jpg',
          dogruSanatci: 'Jan van Eyck',
          dogruAkim: 'Kuzey Rönesansı',
        },
        yatay: {
          src: 'gorseller/04-campin-merode.jpg',
          yedekSrc: 'gorseller/07-weyden-hactan-indirme.jpg',
          dogruSanatci: 'Robert Campin',
          dogruAkim: 'Kuzey Rönesansı',
        },
        kare: {
          src: 'gorseller/02-van-eyck-rolin.jpg',
          yedekSrc: 'gorseller/03-van-eyck-kirmizi-sarik.jpg',
          dogruSanatci: 'Jan van Eyck',
          dogruAkim: 'Kuzey Rönesansı',
        },
      };

      const SANATCI_SIKLAR = ['Jan van Eyck', 'Robert Campin', 'Rogier van der Weyden', 'Petrus Christus'];
      const AKIM_SIKLAR = ['Kuzey Rönesansı', 'Erken Rönesans', 'Yüksek Rönesans', 'Barok'];
      const SEVIYE_AD = { kolay: 'Kolay', orta: 'Orta', zor: 'Zor' };

      const durum = {
        oran: 'dikey',
        hata: false,
        yedekKullanildi: false,
        soruTur: 'sanatci',
        karisik: false,
        seviye: 'kolay',
        soruNo: 3,
        toplam: 8,
        cevap: null,
        gecmis: ['dogru', 'dogru'],
      };

      const ikonX = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
      const ikonKucukX = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
      const ikonOnay = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
      const ikonIleri = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;
      const ikonYenile = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>`;

      function cubukGuncelle() {
        const tel = document.getElementById('telefon');
        document.querySelectorAll('[data-oran]').forEach((b) => {
          const aktif = b.dataset.oran === 'hata' ? durum.hata : !durum.hata && b.dataset.oran === durum.oran;
          b.setAttribute('aria-pressed', String(aktif));
        });
        document.querySelectorAll('[data-soru-tur]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.soruTur === durum.soruTur)));
        document.querySelectorAll('[data-seviye]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.seviye === durum.seviye)));
        document.querySelectorAll('[data-boyut]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.boyut === '375') === tel.classList.contains('kucuk'))));
        document.querySelectorAll('[data-tema-sec]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.temaSec === document.documentElement.dataset.tema)));
        document.querySelectorAll('[data-hareket-sec]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.hareketSec === document.documentElement.dataset.hareket)));
      }

      function ciz() {
        const eser = ESERLER[durum.oran];
        const aktifSrc = durum.yedekKullanildi ? eser.yedekSrc : eser.src;
        document.getElementById('soruIsik').style.backgroundImage = durum.hata ? 'none' : `url('${aktifSrc}')`;

        const ikinci = durum.soruTur === 'akim';
        const dogruDeger = ikinci ? eser.dogruAkim : eser.dogruSanatci;
        const liste = ikinci ? AKIM_SIKLAR : SANATCI_SIKLAR;
        const cevapli = durum.cevap !== null;
        const dogruMu = durum.cevap === dogruDeger;
        const bilmiyorMu = durum.cevap === '?';

        const noktalar = Array.from({ length: durum.toplam }, (_, i) => {
          const idx = i + 1;
          if (idx < durum.soruNo) return `<i class="nokta ${durum.gecmis[i] || 'dogru'}"></i>`;
          if (idx === durum.soruNo) return `<i class="nokta ${cevapli ? (dogruMu ? 'dogru' : 'yanlis') : 'simdi'}"></i>`;
          return `<i class="nokta"></i>`;
        }).join('');

        const kalan = liste.filter((ad) => !cevapli || ad === dogruDeger || ad === durum.cevap);

        const ortaEser = durum.hata
          ? `<div class="hata-kutu">
               <p>Görsel yüklenemedi.</p>
               <button type="button" class="cam-hap-btn" id="baskaEserBtn">${ikonYenile}<span>Başka eser dene</span></button>
             </div>`
          : `<button type="button" class="eser-btn" id="eserBuyut" aria-label="Sorulan eser — yakın incele">
               <img src="${aktifSrc}" alt="Sorulan tablo" />
             </button>`;

        const ciftAdimHtml =
          ikinci || durum.karisik
            ? `<span class="cift-adim" aria-hidden="true"><i class="aktif"></i><i class="${ikinci ? 'aktif' : ''}"></i></span><span>Soru ${ikinci ? 2 : 1} / 2 · ${SEVIYE_AD[durum.seviye]}</span>`
            : `<span>${SEVIYE_AD[durum.seviye]}</span>`;

        const yaprak = cevapli
          ? `<section class="yaprak-gecis" aria-live="polite">
               <div class="yaprak-tutamak" aria-hidden="true"></div>
               <div class="yaprak-ust">
                 <span class="yaprak-durum ${dogruMu ? 'dogru' : 'yanlis'}">
                   ${dogruMu ? ikonOnay : ikonKucukX}
                   <span>${dogruMu ? 'Doğru' : bilmiyorMu ? 'Bilmiyorum' : 'Yanlış'}</span>
                 </span>
                 <span class="yaprak-not">Cevap yaprağı alttan açılır</span>
               </div>
               <div class="yaprak-eylemler">
                 <button type="button" class="duz-dugme" id="sifirlaBtn">Soruya dön</button>
                 ${
                   !ikinci
                     ? `<button type="button" class="dolu-dugme" id="ikinciSoruBtn"><span>Hangi akım?</span>${ikonIleri}</button>`
                     : `<button type="button" class="dolu-dugme" id="sonrakiKartBtn"><span>Sonraki soru</span>${ikonIleri}</button>`
                 }
               </div>
             </section>`
          : '';

        document.getElementById('ekran').innerHTML = `
          <header class="ust-serit">
            <button type="button" class="cam-yuvarlak" id="cikisAc" aria-label="Turdan çık">${ikonX}</button>
            <div class="nokta-hat" aria-hidden="true">${noktalar}</div>
            <span class="sayac-yalın">${durum.soruNo} / ${durum.toplam}</span>
          </header>

          <div class="sahne ${cevapli ? 'cevapli' : ''}">
            <div class="eser-alan ${durum.oran}">${ortaEser}</div>

            <section class="bolunmus-tepsi" aria-label="Cevap seçenekleri">
              <div class="tepsi-bant">
                <h1 class="tepsi-baslik">${ikinci ? 'Hangi akım?' : 'Bu eser kimin?'}</h1>
                <span class="tepsi-sag">${ciftAdimHtml}</span>
              </div>
              <div class="tepsi-govde">
                <div class="secenekler ${kalan.length === 1 ? 'tek' : ''}" role="group" aria-label="${ikinci ? 'Akım seçenekleri' : 'Sanatçı seçenekleri'}">
                  ${kalan
                    .map((ad) => {
                      const cls = !cevapli ? '' : ad === dogruDeger ? ' dogru' : ad === durum.cevap ? ' yanlis' : '';
                      const ic = !cevapli ? '' : ad === dogruDeger ? `<span class="secenek-ikon" aria-hidden="true">${ikonOnay}</span>` : ad === durum.cevap ? `<span class="secenek-ikon" aria-hidden="true">${ikonKucukX}</span>` : '';
                      return `<button type="button" class="secenek${cls}" data-sec="${ad}" ${cevapli ? 'disabled' : ''}><span>${ad}</span>${ic}</button>`;
                    })
                    .join('')}
                </div>
                ${!cevapli ? `<div class="bilmiyorum-sar"><button type="button" class="bilmiyorum" id="bilmiyorumBtn">Bilmiyorum</button></div>` : ''}
              </div>
            </section>

            ${yaprak}
          </div>
        `;

        cubukGuncelle();
        olaylariBagla(aktifSrc);
      }

      function olaylariBagla(aktifSrc) {
        document.getElementById('cikisAc')?.addEventListener('click', () => {
          document.getElementById('cikisKatman').hidden = false;
        });
        document.getElementById('eserBuyut')?.addEventListener('click', () => {
          document.getElementById('buyutImg').src = aktifSrc;
          document.getElementById('buyutKatman').hidden = false;
        });
        document.getElementById('baskaEserBtn')?.addEventListener('click', () => {
          durum.hata = false;
          durum.yedekKullanildi = true;
          ciz();
        });
        document.querySelectorAll('[data-sec]').forEach((b) =>
          b.addEventListener('click', () => {
            durum.cevap = b.dataset.sec;
            ciz();
          }),
        );
        document.getElementById('bilmiyorumBtn')?.addEventListener('click', () => {
          durum.cevap = '?';
          ciz();
        });
        document.getElementById('sifirlaBtn')?.addEventListener('click', () => {
          durum.cevap = null;
          ciz();
        });
        document.getElementById('ikinciSoruBtn')?.addEventListener('click', () => {
          durum.karisik = true;
          durum.soruTur = 'akim';
          durum.cevap = null;
          ciz();
        });
        document.getElementById('sonrakiKartBtn')?.addEventListener('click', () => {
          const sira = ['dikey', 'yatay', 'kare'];
          durum.oran = sira[(sira.indexOf(durum.oran) + 1) % sira.length];
          durum.soruTur = 'sanatci';
          durum.karisik = false;
          durum.yedekKullanildi = false;
          durum.cevap = null;
          durum.soruNo = durum.soruNo < durum.toplam ? durum.soruNo + 1 : 1;
          ciz();
        });
      }

      document.getElementById('buyutKapat').addEventListener('click', () => {
        document.getElementById('buyutKatman').hidden = true;
      });
      document.getElementById('buyutKatman').addEventListener('click', (ev) => {
        if (ev.target.id === 'buyutKatman') document.getElementById('buyutKatman').hidden = true;
      });
      document.getElementById('cikisDevam').addEventListener('click', () => {
        document.getElementById('cikisKatman').hidden = true;
      });
      document.getElementById('cikisOnay').addEventListener('click', () => {
        document.getElementById('cikisKatman').hidden = true;
        durum.cevap = null;
        durum.soruTur = 'sanatci';
        ciz();
      });

      document.querySelectorAll('[data-oran]').forEach((b) =>
        b.addEventListener('click', () => {
          if (b.dataset.oran === 'hata') {
            durum.hata = true;
            durum.cevap = null;
          } else {
            durum.hata = false;
            durum.oran = b.dataset.oran;
            durum.yedekKullanildi = false;
            durum.cevap = null;
          }
          ciz();
        }),
      );
      document.querySelectorAll('[data-soru-tur]').forEach((b) =>
        b.addEventListener('click', () => {
          durum.soruTur = b.dataset.soruTur;
          durum.karisik = b.dataset.soruTur === 'akim';
          durum.cevap = null;
          ciz();
        }),
      );
      document.querySelectorAll('[data-seviye]').forEach((b) =>
        b.addEventListener('click', () => {
          durum.seviye = b.dataset.seviye;
          ciz();
        }),
      );
      document.querySelectorAll('[data-boyut]').forEach((b) =>
        b.addEventListener('click', () => {
          document.getElementById('telefon').classList.toggle('kucuk', b.dataset.boyut === '375');
          cubukGuncelle();
        }),
      );
      document.querySelectorAll('[data-tema-sec]').forEach((b) =>
        b.addEventListener('click', () => {
          document.documentElement.dataset.tema = b.dataset.temaSec;
          ciz();
        }),
      );
      document.querySelectorAll('[data-hareket-sec]').forEach((b) =>
        b.addEventListener('click', () => {
          document.documentElement.dataset.hareket = b.dataset.hareketSec;
          cubukGuncelle();
        }),
      );

      const q = new URLSearchParams(location.search);
      if (q.get('goruntu') === '1') document.body.classList.add('goruntu-modu');
      if (q.get('tema') === 'gunduz' || q.get('tema') === 'gece') document.documentElement.dataset.tema = q.get('tema');
      if (q.get('hareket') === 'az') document.documentElement.dataset.hareket = 'az';
      if (q.get('boyut') === '375') document.getElementById('telefon').classList.add('kucuk');
      if (q.get('oran') && ESERLER[q.get('oran')]) durum.oran = q.get('oran');
      if (q.get('oran') === 'hata') durum.hata = true;
      if (q.get('tur') === 'akim') {
        durum.soruTur = 'akim';
        durum.karisik = true;
      }
      if (q.get('seviye') && SEVIYE_AD[q.get('seviye')]) durum.seviye = q.get('seviye');
      if (q.get('cevap') === 'yanlis') durum.cevap = 'Petrus Christus';
      if (q.get('cevap') === 'dogru') durum.cevap = ESERLER[durum.oran].dogruSanatci;
      ciz();
    </script>
  </body>
</html>
