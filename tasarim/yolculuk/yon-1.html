<!doctype html>
<html lang="tr" data-tema="gece" data-hareket="tam">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yolculuk · Yön 1 — Toparlanmış Harita</title>
    <style>
      @font-face {
        font-family: 'Bodoni Moda';
        src: url('../../NoraSanat/YaziTipleri/BodoniModa.ttf') format('truetype');
        font-weight: 400 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Bodoni Moda';
        src: url('../../NoraSanat/YaziTipleri/BodoniModa-Italic.ttf') format('truetype');
        font-weight: 400 900;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader.ttf') format('truetype');
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader-Italic.ttf') format('truetype');
        font-weight: 200 800;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Archivo';
        src: url('../../NoraSanat/YaziTipleri/Archivo.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      :root,
      :root[data-tema='gece'] {
        --bg: #121110;
        --bg-rgb: 18, 17, 16;
        --surface: #1c1a18;
        --surface-2: #24211e;
        --border: #2e2b28;
        --border-ince: rgba(235, 229, 218, 0.1);
        --ink: #ebe5da;
        --ink-rgb: 235, 229, 218;
        --ink-2: #aca498;
        --ink-3: #8a8379;
        --pirinc: #c9a45c;
        --pirinc-rgb: 201, 164, 92;
        --pirinc-yazi: #121110;
        --right: #6fb487;
        --right-bg: rgba(111, 180, 135, 0.14);
        --tab-bg: rgba(24, 22, 20, 0.84);
        --overlay-btn: rgba(18, 17, 16, 0.72);
        --doku: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.04;
        --sayfa-zemin: #0b0a09;
        --golge-rgb: 0, 0, 0;
        --yol-iz: rgba(235, 229, 218, 0.16);
        --yol-dolu: rgba(201, 164, 92, 0.72);
        --panel-perde: rgba(10, 9, 8, 0.58);
        --panel-zemin: #1a1714;
        --panel-golge: 0 -10px 36px rgba(0, 0, 0, 0.52);
        color-scheme: dark;
      }

      :root[data-tema='gunduz'] {
        --bg: #ece8e1;
        --bg-rgb: 236, 232, 225;
        --surface: #f7f5f1;
        --surface-2: #efebe3;
        --border: #d6d0c6;
        --border-ince: rgba(31, 27, 23, 0.1);
        --ink: #1f1b17;
        --ink-rgb: 31, 27, 23;
        --ink-2: #4c463f;
        --ink-3: #6c645a;
        --pirinc: #8a651c;
        --pirinc-rgb: 138, 101, 28;
        --pirinc-yazi: #f7f5f1;
        --right: #2a6644;
        --right-bg: rgba(42, 102, 68, 0.12);
        --tab-bg: rgba(247, 245, 241, 0.88);
        --overlay-btn: rgba(247, 245, 241, 0.86);
        --doku: radial-gradient(rgba(31, 27, 23, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.045;
        --sayfa-zemin: #e1dcd3;
        --golge-rgb: 20, 17, 14;
        --yol-iz: rgba(31, 27, 23, 0.16);
        --yol-dolu: rgba(138, 101, 28, 0.7);
        --panel-perde: rgba(20, 17, 14, 0.34);
        --panel-zemin: #f7f5f1;
        --panel-golge: 0 -10px 30px rgba(20, 17, 14, 0.14);
        color-scheme: light;
      }

      :root {
        --serif: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
        --sans: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --okuma: 'Newsreader', 'Iowan Old Style', Georgia, serif;
        --gecis: 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        --donem-rgb: 63, 91, 69;
        --desen-url: url('../../NoraSanat/Ekranlar/Galeri/Desenler/desen-ronesans@3x.png');
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--sayfa-zemin);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow-x: clip;
      }

      /* Önizleme çubuğu (masaüstü) */
      .onizleme-ust {
        position: sticky;
        top: 0;
        z-index: 80;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 20px;
        background: var(--tab-bg);
        border-bottom: 1px solid var(--border);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
      }
      .onizleme-baslik { display: flex; flex-direction: column; gap: 2px; }
      .onizleme-baslik .ust-not { font: 600 13px/1.2 var(--sans); color: var(--pirinc); }
      .onizleme-baslik strong { font: 500 20px/1.15 var(--serif); letter-spacing: -0.01em; }
      .onizleme-denetimler { display: flex; align-items: center; gap: 10px; }
      .parcali-kap {
        display: inline-flex;
        padding: 3px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
      }
      .parcali-kap button {
        min-height: 44px;
        padding: 0 14px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        font: 600 13px/1 var(--sans);
        cursor: pointer;
        transition: background var(--gecis), color var(--gecis);
      }
      .parcali-kap button[aria-pressed='true'] {
        background: var(--ink);
        color: var(--bg);
      }

      .sahne {
        display: flex;
        justify-content: center;
        padding: 24px 0 40px;
      }

      /* 390×844 Telefon çerçevesi */
      .telefon {
        position: relative;
        width: 390px;
        height: 844px;
        border-radius: 44px;
        overflow: hidden;
        background-color: var(--bg);
        background-image: var(--doku);
        background-size: 3px 3px;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.42), 0 0 0 1px var(--border);
        isolation: isolate;
      }

      @media (max-width: 440px) {
        .onizleme-ust { display: none; }
        .sahne { padding: 0; }
        .telefon {
          width: 390px;
          max-width: 100vw;
          height: 844px;
          min-height: 100svh;
          border-radius: 0;
          box-shadow: none;
        }
      }

      /* Üç katmanlı zemin (hale + silik dönem deseni) */
      .zemin-hale {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 92% 58% at 12% 8%, rgba(var(--donem-rgb), 0.28), transparent 68%),
          radial-gradient(ellipse 74% 52% at 88% 82%, rgba(var(--pirinc-rgb), 0.14), transparent 70%);
        transition: background 0.6s ease;
      }
      :root[data-tema='gunduz'] .zemin-hale {
        background:
          radial-gradient(ellipse 92% 58% at 12% 8%, rgba(var(--donem-rgb), 0.15), transparent 68%),
          radial-gradient(ellipse 74% 52% at 88% 82%, rgba(var(--pirinc-rgb), 0.1), transparent 70%);
      }
      .zemin-desen {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-color: var(--ink);
        opacity: var(--desen-opaklik);
        -webkit-mask-image: var(--desen-url);
        mask-image: var(--desen-url);
        -webkit-mask-size: 96px 96px;
        mask-size: 96px 96px;
        -webkit-mask-repeat: repeat;
        mask-repeat: repeat;
      }

      /* Kaydırılabilir harita — sekme çubuğunun arkasına kadar kesintisiz iner */
      .harita-kaydir {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .harita-kaydir::-webkit-scrollbar { display: none; }

      /* Üst yüzen şerit — sıkışmasız tek kurs hapı + tema + sakin dönem satırı */
      .harita-ust-yuzen {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        padding: 14px 14px 10px;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(var(--bg-rgb), 0.86) 0%, rgba(var(--bg-rgb), 0.42) 68%, transparent 100%);
      }
      .ust-satir {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .kurs-hap {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        max-width: calc(100% - 56px);
        padding: 6px 14px 6px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--tab-bg);
        color: var(--ink);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
        box-shadow: 0 8px 24px rgba(var(--golge-rgb), 0.18);
        cursor: pointer;
        text-align: left;
      }
      .kurs-hap:active { transform: scale(0.98); }
      .kurs-halka {
        flex: none;
        width: 34px;
        height: 34px;
      }
      .kurs-halka circle { fill: none; stroke-width: 2.8; }
      .kurs-halka .iz { stroke: rgba(var(--ink-rgb), 0.16); }
      .kurs-halka .dolu {
        stroke: var(--pirinc);
        stroke-linecap: round;
        transform: rotate(-90deg);
        transform-origin: 18px 18px;
      }
      .kurs-yazi {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }
      .kurs-yazi b {
        font: 600 14.5px/1.2 var(--sans);
        color: var(--ink);
        white-space: nowrap;
      }
      .kurs-yazi small {
        font: 400 12.5px/1.2 var(--sans);
        color: var(--ink-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kurs-nokta {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--pirinc);
      }

      .cam-yuvarlak {
        pointer-events: auto;
        flex: none;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--tab-bg);
        color: var(--ink);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
        box-shadow: 0 8px 24px rgba(var(--golge-rgb), 0.16);
        cursor: pointer;
      }
      .cam-yuvarlak:active { transform: scale(0.94); }

      /* Sakin dönem göstergesi (hapla asla çakışmaz, tek satır) */
      .donem-serit-ust {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 8px;
        padding: 0 4px;
      }
      .donem-rozet {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 12px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border-ince);
        -webkit-backdrop-filter: blur(20px) saturate(1.5);
        backdrop-filter: blur(20px) saturate(1.5);
        font: 500 13px/1.2 var(--sans);
        color: var(--ink);
      }
      .donem-rozet i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--donem-renk, var(--pirinc));
      }
      .donem-rozet span { color: var(--ink-2); font-weight: 400; }

      .ozet-yildiz-ust {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 11px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border-ince);
        -webkit-backdrop-filter: blur(20px) saturate(1.5);
        backdrop-filter: blur(20px) saturate(1.5);
        font: 600 12.5px/1.2 var(--sans);
        color: var(--ink-2);
      }
      .ozet-yildiz-ust strong { color: var(--ink); font-weight: 600; }

      /* Harita tuvali */
      .harita-tuval {
        position: relative;
        width: 390px;
        padding: 120px 0 132px; /* altta sekme çubuğu payı, hiç boşluk şeridi kalmaz */
      }

      .harita-yol-svg {
        position: absolute;
        inset: 0;
        width: 390px;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      /* Dönem bölgesi bandı */
      .bolge-bandi {
        position: relative;
        width: 390px;
        padding: 18px 0 14px;
      }
      .bolge-bandi::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 90% 60% at 50% 48%, rgba(var(--bolge-rgb), 0.14), transparent 72%);
      }
      :root[data-tema='gunduz'] .bolge-bandi::before {
        background: radial-gradient(ellipse 90% 60% at 50% 48%, rgba(var(--bolge-rgb), 0.085), transparent 72%);
      }

      /* Dönem geçiş köprüsü — temiz, nefes alan */
      .bolge-baslik {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 18px 24px 20px;
        gap: 4px;
      }
      .bolge-cizgi {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 220px;
        margin-bottom: 4px;
      }
      .bolge-cizgi i {
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(var(--bolge-rgb), 0.6), transparent);
      }
      .bolge-cizgi b {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgb(var(--bolge-rgb));
        box-shadow: 0 0 0 3px rgba(var(--bolge-rgb), 0.22);
      }
      .bolge-yuzyil {
        font: 600 13px/1.3 var(--sans);
        color: var(--pirinc);
      }
      .bolge-ad {
        margin: 0;
        font: 500 26px/1.12 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .bolge-ozet {
        font: 400 13px/1.3 var(--sans);
        color: var(--ink-2);
      }
      .bolge-bandi.kilitli .bolge-ad { color: var(--ink-2); }

      /* Durak düğmesi (yol üzerinde kıvrılan konum) */
      .durak-satir {
        position: relative;
        z-index: 3;
        height: 112px;
        width: 390px;
      }
      .durak-satir.simdiki { height: 148px; }

      .durak-btn {
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px;
        min-width: 44px;
        min-height: 44px;
        border: 0;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        text-align: left;
      }
      .durak-btn.sag-yazi { flex-direction: row; }
      .durak-btn.sol-yazi { flex-direction: row-reverse; text-align: right; }

      .durak-madalyon {
        position: relative;
        flex: none;
        width: 68px;
        height: 68px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        transition: transform var(--gecis);
      }
      .durak-btn:active .durak-madalyon { transform: scale(0.94); }

      .durak-satir.simdiki .durak-madalyon {
        width: 88px;
        height: 88px;
      }

      /* Halka + yıldız ilerleme yayı */
      .madalyon-halka {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .madalyon-halka circle { fill: none; }
      .madalyon-halka .iz {
        stroke: rgba(var(--ink-rgb), 0.16);
        stroke-width: 2.6;
      }
      .durak-btn.kilitli .madalyon-halka .iz {
        stroke-dasharray: 3.5 4.5;
        stroke: rgba(var(--ink-rgb), 0.22);
      }
      .madalyon-halka .dolu {
        stroke: var(--durak-renk, var(--pirinc));
        stroke-width: 3;
        stroke-linecap: round;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
      }
      .durak-satir.simdiki .madalyon-halka .dolu {
        stroke: var(--pirinc);
        stroke-width: 3.2;
      }

      /* Sıradaki durakta sakin nefes halkası */
      .simdiki-hale {
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 1.5px solid rgba(var(--pirinc-rgb), 0.5);
        box-shadow: 0 0 26px rgba(var(--pirinc-rgb), 0.34);
        animation: nefes 3.2s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes nefes {
        0%, 100% { transform: scale(0.97); opacity: 0.65; }
        50% { transform: scale(1.05); opacity: 1; }
      }

      .madalyon-ic {
        position: relative;
        width: calc(100% - 12px);
        height: calc(100% - 12px);
        border-radius: 50%;
        overflow: hidden;
        background: var(--surface);
        box-shadow: 0 8px 20px rgba(var(--golge-rgb), 0.3);
        display: grid;
        place-items: center;
      }
      .madalyon-ic img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .durak-btn.kilitli .madalyon-ic img {
        filter: grayscale(0.88) sepia(0.24) brightness(0.76);
        opacity: 0.72;
      }
      :root[data-tema='gunduz'] .durak-btn.kilitli .madalyon-ic img {
        filter: grayscale(0.82) sepia(0.2) contrast(0.92);
        opacity: 0.68;
      }
      .madalyon-muhur {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 30%, rgba(var(--durak-rgb), 0.32), rgba(var(--durak-rgb), 0.1));
        color: var(--ink-2);
      }

      .kilit-pul {
        position: absolute;
        right: -1px;
        bottom: -1px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--ink-2);
        box-shadow: 0 3px 10px rgba(var(--golge-rgb), 0.25);
      }

      /* Durak etiketi (kıvrılan yolun yanına temiz oturur) */
      .durak-kart {
        width: 176px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .durak-btn.sol-yazi .durak-kart { align-items: flex-end; }
      .durak-satir.simdiki .durak-kart {
        width: 196px;
        padding: 10px 13px;
        border-radius: 18px;
        background: var(--tab-bg);
        border: 1px solid rgba(var(--pirinc-rgb), 0.42);
        -webkit-backdrop-filter: blur(20px) saturate(1.5);
        backdrop-filter: blur(20px) saturate(1.5);
        box-shadow: 0 12px 28px rgba(var(--golge-rgb), 0.24);
      }
      .durak-ust-etiket {
        font: 600 12.5px/1.2 var(--sans);
        color: var(--pirinc);
      }
      .durak-ad {
        font: 500 16.5px/1.18 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .durak-satir.simdiki .durak-ad { font-size: 19px; }
      .durak-btn.kilitli .durak-ad { color: var(--ink-2); }
      .durak-alt {
        font: 400 12.5px/1.3 var(--sans);
        color: var(--ink-2);
      }
      .durak-btn.kilitli .durak-alt { color: var(--ink-3); }

      /* Yıldız satırı */
      .yildizlar {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        margin-top: 2px;
      }
      .yildiz-svg { width: 13px; height: 13px; }
      .yildiz-svg.dolu { color: var(--pirinc); }
      .yildiz-svg.bos { color: rgba(var(--ink-rgb), 0.2); }

      /* Sıradakine dön yüzen cam hapı */
      .siradaki-don {
        position: absolute;
        left: 50%;
        bottom: 92px;
        transform: translateX(-50%);
        z-index: 24;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid rgba(var(--pirinc-rgb), 0.45);
        background: var(--tab-bg);
        color: var(--ink);
        font: 600 13.5px/1 var(--sans);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
        box-shadow: 0 10px 28px rgba(var(--golge-rgb), 0.3);
        cursor: pointer;
        transition: opacity var(--gecis), transform var(--gecis);
      }
      .siradaki-don .nokta {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--pirinc);
      }
      .siradaki-don.gizli {
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 10px);
      }

      /* Alt yüzen sekme çubuğu (NoraSanat YerliSekmeCubugu) */
      .sekme-cubugu {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 14px;
        z-index: 25;
        height: 62px;

        inset: 0;
        z-index: 0;
        pointer-events: none;

      const lockSvg = (s = 12) =>

      // Harita alttan yukarıya (Orta Çağ altta -> Modern sanat üstte)

      // Kıvrılan yol X düzeni (ekran içinde 390px'e rahat sığar)

      tersBolgeler.forEach((b) => {

        sec.className = `bolge-bandi${acikAdet ? '' : ' kilitli'}`;

        sec.style.setProperty('--bolge-rgb', b.rgb);

        let html = `
          <div class="bolge-baslik">

        duraklar.forEach((d) => {

      // Kıvrımlı SVG patikasını düğüm merkezlerine tam oturt
      function yoluCiz() {
        const tuval = document.getElementById('tuval');
        const svg = document.getElementById('yolSvg');
        const tRect = tuval.getBoundingClientRect();
        const satirlar = [...tuval.querySelectorAll('.durak-satir')];
        const noktalar = satirlar.map((el) => {
          const m = el.querySelector('.durak-madalyon').getBoundingClientRect();
          const id = el.dataset.durakSatir;
          const d = DURAKLAR.find((x) => x.id === id);
          return { x: m.left - tRect.left + m.width / 2, y: m.top - tRect.top + m.height / 2, acik: d.acik, simdiki: !!d.simdiki };
        });

        svg.setAttribute('viewBox', `0 0 390 ${tuval.scrollHeight}`);
        let paths = '';
        for (let i = 0; i < noktalar.length - 1; i++) {
          const a = noktalar[i];
          const b = noktalar[i + 1];
          const midY = (a.y + b.y) / 2;
          const dStr = `M ${a.x.toFixed(1)} ${a.y.toFixed(1)} C ${a.x.toFixed(1)} ${midY.toFixed(1)}, ${b.x.toFixed(1)} ${midY.toFixed(1)}, ${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
          const doluMu = a.acik && b.acik;
          paths += `<path d="${dStr}" fill="none" stroke="${doluMu ? 'var(--yol-dolu)' : 'var(--yol-iz)'}" stroke-width="${doluMu ? 2.6 : 2}" ${doluMu ? '' : 'stroke-dasharray="5 6"'} stroke-linecap="round"/>`;
        }
        svg.innerHTML = paths;
      }

      // Durak paneli
      const perde = document.getElementById('perde');
      const yaprak = document.getElementById('yaprak');
      const yaprakArka = document.getElementById('yaprakArka');

      const bildirim = document.getElementById('bildirim');
      let bildirimZaman;

      function bildir(metin) {
        bildirim.textContent = metin;
        bildirim.classList.add('acik');
        clearTimeout(bildirimZaman);
        bildirimZaman = setTimeout(() => bildirim.classList.remove('acik'), 2400);

      function yaprakKapat() {
        perde.classList.remove('acik');
        yaprak.classList.remove('acik');

      function durakAc(id) {
        const d = DURAKLAR.find((x) => x.id === id);
        if (!d) return;
        const b = BOLGELER.find((x) => x.id === d.bolge);
        yaprakArka.innerHTML = d.gorsel ? `<img src="${d.gorsel}" alt="" style="object-position:${d.odak || '50% 40%'}">` : '';

        yaprak.style.setProperty('--durak-rgb', d.rgb);

        const kapakHtml = d.gorsel
          ? `<div class="panel-kapak${d.acik ? '' : ' kilit-resim'}"><img src="${d.gorsel}" alt="${d.eser || d.ad}" style="object-position:${d.odak || '50% 40%'}"><span class="panel-kunye">${d.eser}</span></div>`
          : `<div class="panel-kapak"><div class="panel-kapak-desen">${lockSvg(26)}<span style="font:500 14px/1.3 var(--sans)">${b.ad}</span></div></div>`;

        const gruplar = d.gruplar || [{ adlar: d.sanatcilar.join(', '), tamam: d.acik && d.yildiz >= 1 }];
        const tanisHtml = gruplar
          .map((g, i) => `
            <li>
              <button type="button" class="panel-satir${g.tamam ? ' soluk' : ''}" ${d.acik ? '' : 'disabled'} data-aksiyon="Tanışma · ${g.adlar}">

                  ${g.kucuk ? `<img src="${g.kucuk}" alt="" style="object-position:${g.odak || '50% 30%'}">` : (g.tamam ? checkSvg() : lockSvg(14))}
                </span>
                <span class="satir-ad">${g.adlar}</span>
                <span class="satir-son${g.tamam ? ' tamam' : ''}">${d.acik ? (g.tamam ? checkSvg() : 'Tanış') : ''}</span>
              </button>
            </li>`)
          .join('');

        const seviyeler = [
          { key: 'kolay', ad: 'Kolay', soru: '8 soru', acik: d.acik, puan: d.kolay },
          { key: 'orta', ad: 'Orta', soru: '10 soru', acik: d.acik && (d.kolay || 0) >= 75, puan: d.orta },
          { key: 'zor', ad: 'Zor', ek: 'isteğe bağlı', soru: '10 soru', acik: d.acik && (d.orta || 0) >= 75, puan: d.zor },
        ];
        const siradakiSv = d.acik ? (seviyeler.find((s) => s.acik && !(s.puan >= 75))?.key || 'kolay') : null;

        const seviyeHtml = d.acik
          ? seviyeler
              .map((s) => {
                const gecti = (s.puan || 0) >= 75;
                const sirada = s.key === siradakiSv;
                const son = !s.acik ? (s.key === 'orta' ? 'Kolay’ı geçince' : 'Orta’yı geçince') : gecti ? `%${s.puan}` : s.soru;
                return `
                  <li>
                    <button type="button" class="panel-satir${sirada ? ' sirada' : ''}" ${s.acik ? '' : 'disabled'} data-aksiyon="${d.ad} · ${s.ad} turu başlatılıyor">
                      <span class="satir-kucuk${gecti ? ' dolu' : sirada ? ' sirada' : ''}">
                        ${s.acik ? starSvg(true).replace('yildiz-svg dolu', '') : lockSvg(15)}
                      </span>
                      <span class="satir-ad">${s.ad}${s.ek ? `<small>${s.ek}</small>` : ''}</span>
                      <span class="satir-son${gecti ? ' tamam' : sirada ? ' sirada' : ''}">${son}${gecti ? checkSvg() : ''}</span>
                    </button>
                  </li>`;
              })
              .join('')
          : '';

        const baslaBtn = d.acik
          ? `<button type="button" class="ana-dugme" data-aksiyon="${d.ad} — ${d.siradakiSeviye || 'Tekrar'} turu başlatılıyor">Turu başlat <small>${d.siradakiDetay || '8 soru · ~2 dk'}</small></button>`
          : `<p class="panel-kilit-yazi">${d.kilit}. Bu dönemin konusu kursta işlenince durak açılır.</p>`;

        yaprakIc.innerHTML = `
          <div class="yaprak-tutamak" aria-hidden="true"></div>
          ${kapakHtml}
          <p class="panel-ust-yazi"><i></i>${b.ad} · ${d.sanatcilar.length} sanatçı</p>
          <h2 class="panel-ad">${d.ad}</h2>
          ${d.acik ? `<div class="panel-yildiz-satir">${starsHtml(d.yildiz)}<span>${d.yildiz} / 3 yıldız</span></div>` : ''}
          ${baslaBtn}
          <p class="panel-bolum-baslik">Sanatçılarla tanışma</p>
          <ol class="panel-liste">${tanisHtml}</ol>
          <p class="panel-bolum-baslik">${d.acik ? 'Seviyeler ve akım' : 'Akım'}</p>
          <ol class="panel-liste">
            ${seviyeHtml}
            <li>
              <button type="button" class="panel-satir" data-aksiyon="${d.akim} akım sayfası açılıyor">
                <span class="satir-kucuk">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 20h18M5 20V9M9 20V9M15 20V9M19 20V9M2 9l10-5 10 5"/></svg>
                </span>
                <span class="satir-ad">Akım sayfası <small>${d.akim}</small></span>
                <span class="satir-son">${chevSvg()}</span>
              </button>
            </li>
          </ol>`;

        yaprakIc.scrollTop = 0;
        perde.classList.add('acik');
        yaprak.classList.add('acik');
      }

      function kursAc() {
        yaprakArka.innerHTML = '';
        yaprakIc.innerHTML = `
          <div class="yaprak-tutamak" aria-hidden="true"></div>
          <p class="panel-ust-yazi"><i></i>Kursun neresindesin</p>
          <h2 class="panel-ad">16 / 57 konu işlendi</h2>
          <p class="panel-kilit-yazi">Şu an <strong>Rönesans</strong> dönemindesin. Önündeki konuyu işaretlediğinde yeni sanatçılar ve kilitli duraklar açılır.</p>
          <p class="panel-bolum-baslik">Sıradaki konu · Konu 19</p>
          <ol class="panel-liste">
            <li>
              <div class="panel-satir" style="cursor:default">
                <span class="satir-kucuk sirada">19</span>
                <span class="satir-ad">Michelangelo ve Sistina tavanı<small style="display:block;margin:2px 0 0">2 sanatçı açılacak</small></span>
              </div>
            </li>
          </ol>
          <button type="button" class="ana-dugme" data-aksiyon="Konu 19 işlendi olarak işaretlendi">Konu 19’u işlendi yap</button>`;
        yaprakIc.scrollTop = 0;
        perde.classList.add('acik');
        yaprak.classList.add('acik');
      }

      // Kaydırma izleme: görünen dönem + sıradakine dön hapı
      const kaydir = document.getElementById('kaydir');
      const siradakiDonBtn = document.getElementById('siradakiDonBtn');
      const siradakiDonYazi = document.getElementById('siradakiDonYazi');
      const donemAdEl = document.getElementById('donemAd');
      const donemYuzyilEl = document.getElementById('donemYuzyil');
      const donemNoktaEl = document.getElementById('donemNokta');

      function konumuGuncelle() {
        const kRect = kaydir.getBoundingClientRect();
        const ortaY = kRect.top + kRect.height * 0.48;
        let enYakin = null;
        let enMesafe = Infinity;
        for (const el of bolgelerKabi.querySelectorAll('.bolge-bandi')) {
          const r = el.getBoundingClientRect();
          const m = Math.abs((r.top + r.bottom) / 2 - ortaY);
          if (m < enMesafe) { enMesafe = m; enYakin = el.dataset.bolge; }
        }
        const b = BOLGELER.find((x) => x.id === enYakin);
        if (b) {
          donemAdEl.textContent = b.ad;
          donemYuzyilEl.textContent = b.yuzyil;
          donemNoktaEl.style.background = b.renk;
          document.documentElement.style.setProperty('--donem-rgb', b.rgb);
          document.documentElement.style.setProperty('--desen-url', `url('../../NoraSanat/Ekranlar/Galeri/Desenler/desen-${b.id}@3x.png')`);
        }

        const simdikiEl = bolgelerKabi.querySelector('.durak-satir.simdiki');
        if (simdikiEl) {
          const r = simdikiEl.getBoundingClientRect();
          const gorunur = r.bottom > kRect.top + 110 && r.top < kRect.bottom - 90;
          siradakiDonBtn.classList.toggle('gizli', gorunur);
          siradakiDonYazi.textContent = r.top < kRect.top ? 'Sıradaki durağa çık' : 'Sıradaki durağa in';
        }
      }

      function siradakiniOrtala(yumusak = false) {
        const simdikiEl = bolgelerKabi.querySelector('.durak-satir.simdiki');
        if (!simdikiEl) return;
        const top = simdikiEl.getBoundingClientRect().top - kaydir.getBoundingClientRect().top + kaydir.scrollTop;
        const hedef = top - kaydir.clientHeight * 0.48 + simdikiEl.offsetHeight / 2;
        const az = document.documentElement.dataset.hareket === 'az' || matchMedia('(prefers-reduced-motion: reduce)').matches;
        kaydir.scrollTo({ top: Math.max(0, hedef), behavior: yumusak && !az ? 'smooth' : 'auto' });
        konumuGuncelle();
      }

      // Tema ve hareket denetimleri
      const vakitIkon = document.getElementById('vakitIkon');
      function temaUygula(t) {
        document.documentElement.dataset.tema = t;
        document.querySelectorAll('[data-tema-btn]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.temaBtn === t)));
        const vakitBtn = document.getElementById('vakitBtn');
        vakitBtn.setAttribute('aria-label', t === 'gece' ? 'Gündüze geç' : 'Geceye geç');
        vakitIkon.innerHTML =
          t === 'gece'
            ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
            : '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>';
      }

      function hareketUygula(h) {
        document.documentElement.dataset.hareket = h;
        document.querySelectorAll('[data-hareket-btn]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.hareketBtn === h)));
      }

      document.querySelectorAll('[data-tema-btn]').forEach((b) => b.addEventListener('click', () => temaUygula(b.dataset.temaBtn)));
      document.querySelectorAll('[data-hareket-btn]').forEach((b) => b.addEventListener('click', () => hareketUygula(b.dataset.hareketBtn)));
      document.getElementById('vakitBtn').addEventListener('click', () => temaUygula(document.documentElement.dataset.tema === 'gece' ? 'gunduz' : 'gece'));
      document.getElementById('kursBtn').addEventListener('click', kursAc);
      document.getElementById('yaprakKapat').addEventListener('click', yaprakKapat);
      perde.addEventListener('click', yaprakKapat);
      siradakiDonBtn.addEventListener('click', () => siradakiniOrtala(true));

      bolgelerKabi.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-durak]');
        if (btn) durakAc(btn.dataset.durak);
      });
      yaprakIc.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-aksiyon]');
        if (btn) bildir(btn.dataset.aksiyon);
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') yaprakKapat();
      });

      kaydir.addEventListener('scroll', konumuGuncelle, { passive: true });

      // Başlat
      const q = new URLSearchParams(location.search);
      temaUygula(q.get('tema') === 'gunduz' ? 'gunduz' : 'gece');
      if (q.get('hareket') === 'az') hareketUygula('az');

      requestAnimationFrame(() => {
        yoluCiz();
        siradakiniOrtala(false);
        if (q.get('durak')) durakAc(q.get('durak'));
      });
      window.addEventListener('resize', () => { yoluCiz(); konumuGuncelle(); });
    </script>
  </body>
</html>
