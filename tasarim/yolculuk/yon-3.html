<!doctype html>
<html lang="tr" data-tema="gece" data-hareket="tam">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yolculuk · Yön 3 — Zaman Atlası ve Kronolojik Omurga</title>
    <style>
      @font-face {
        font-family: 'Bodoni Moda';
        src: url('../../NoraSanat/YaziTipleri/BodoniModa.ttf') format('truetype');
        font-weight: 400 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Bodoni Moda';
        src: url('../../NoraSanat/YaziTipleri/BodoniModa-Italic.ttf') format('truetype');
        font-weight: 400 900;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader.ttf') format('truetype');
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader-Italic.ttf') format('truetype');
        font-weight: 200 800;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Archivo';
        src: url('../../NoraSanat/YaziTipleri/Archivo.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      :root,
      :root[data-tema='gece'] {
        --bg: #121110;
        --bg-rgb: 18, 17, 16;
        --surface: #1c1a18;
        --surface-rgb: 28, 26, 24;
        --surface-2: #24211e;
        --border: #2e2b28;
        --border-ince: rgba(235, 229, 218, 0.095);
        --ink: #ebe5da;
        --ink-rgb: 235, 229, 218;
        --ink-2: #aca498;
        --ink-3: #8a8379;
        --pirinc: #c9a45c;
        --pirinc-rgb: 201, 164, 92;
        --pirinc-yazi: #121110;
        --right: #6fb487;
        --right-bg: rgba(111, 180, 135, 0.14);
        --tab-bg: rgba(22, 20, 18, 0.86);
        --overlay-btn: rgba(18, 17, 16, 0.72);
        --doku: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.04;
        --sayfa-zemin: #0b0a09;
        --golge-rgb: 0, 0, 0;
        --panel-perde: rgba(8, 7, 6, 0.62);
        color-scheme: dark;
      }

      :root[data-tema='gunduz'] {
        --bg: #ece8e1;
        --bg-rgb: 236, 232, 225;
        --surface: #f7f5f1;
        --surface-rgb: 247, 245, 241;
        --surface-2: #efebe3;
        --border: #d6d0c6;
        --border-ince: rgba(31, 27, 23, 0.095);
        --ink: #1f1b17;
        --ink-rgb: 31, 27, 23;
        --ink-2: #4c463f;
        --ink-3: #6c645a;
        --pirinc: #8a651c;
        --pirinc-rgb: 138, 101, 28;
        --pirinc-yazi: #f7f5f1;
        --right: #2a6644;
        --right-bg: rgba(42, 102, 68, 0.12);
        --tab-bg: rgba(247, 245, 241, 0.9);
        --overlay-btn: rgba(247, 245, 241, 0.86);
        --doku: radial-gradient(rgba(31, 27, 23, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.045;
        --sayfa-zemin: #e1dcd3;
        --golge-rgb: 20, 17, 14;
        --panel-perde: rgba(20, 17, 14, 0.36);
        color-scheme: light;
      }

      :root {
        --serif: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
        --sans: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --okuma: 'Newsreader', 'Iowan Old Style', Georgia, serif;
        --gecis: 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        --donem-rgb: 63, 91, 69;
        --desen-url: url('../../NoraSanat/Ekranlar/Galeri/Desenler/desen-ronesans@3x.png');
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--sayfa-zemin);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow-x: clip;
      }

      .onizleme-ust {
        position: sticky;
        top: 0;
        z-index: 80;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 20px;
        background: var(--tab-bg);
        border-bottom: 1px solid var(--border);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
      }
      .onizleme-baslik { display: flex; flex-direction: column; gap: 2px; }
      .onizleme-baslik .ust-not { font: 600 13px/1.2 var(--sans); color: var(--pirinc); }
      .onizleme-baslik strong { font: 500 20px/1.15 var(--serif); letter-spacing: -0.01em; }
      .onizleme-denetimler { display: flex; align-items: center; gap: 10px; }
      .parcali-kap {
        display: inline-flex;
        padding: 3px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
      }
      .parcali-kap button {
        min-height: 44px;
        padding: 0 14px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        font: 600 13px/1 var(--sans);
        cursor: pointer;
      }
      .parcali-kap button[aria-pressed='true'] { background: var(--ink); color: var(--bg); }

      .sahne { display: flex; justify-content: center; padding: 24px 0 40px; }

      .telefon {
        position: relative;
        width: 390px;
        height: 844px;
        border-radius: 44px;
        overflow: hidden;
        background-color: var(--bg);
        background-image: var(--doku);
        background-size: 3px 3px;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.42), 0 0 0 1px var(--border);
        isolation: isolate;
      }
      @media (max-width: 440px) {
        .onizleme-ust { display: none; }
        .sahne { padding: 0; }
        .telefon {
          width: 390px;
          max-width: 100vw;
          height: 844px;
          min-height: 100svh;
          border-radius: 0;
          box-shadow: none;
        }
      }

      /* Üç katmanlı zemin */
      .zemin-hale {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 92% 56% at 14% 12%, rgba(var(--donem-rgb), 0.28), transparent 68%),
          radial-gradient(ellipse 72% 48% at 88% 82%, rgba(var(--pirinc-rgb), 0.14), transparent 72%);
        transition: background 0.55s ease;
      }
      :root[data-tema='gunduz'] .zemin-hale {
        background:
          radial-gradient(ellipse 92% 56% at 14% 12%, rgba(var(--donem-rgb), 0.14), transparent 68%),
          radial-gradient(ellipse 72% 48% at 88% 82%, rgba(var(--pirinc-rgb), 0.09), transparent 72%);
      }
      .zemin-desen {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-color: var(--ink);
        opacity: var(--desen-opaklik);
        -webkit-mask-image: var(--desen-url);
        mask-image: var(--desen-url);
        -webkit-mask-size: 96px 96px;
        mask-size: 96px 96px;
        -webkit-mask-repeat: repeat;
        mask-repeat: repeat;
      }

      /* Üst sakin cam çubuk — tek satır, sıfır sıkışıklık */
      .ust-cubuk {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        padding: 12px 14px 10px 16px;
        background: var(--tab-bg);
        border-bottom: 1px solid var(--border-ince);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .ust-ilerleme-btn {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 4px 8px 4px 2px;
        border: 0;
        background: transparent;
        color: var(--ink);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        text-align: left;
        cursor: pointer;
      }
      .ust-ilerleme-satir {
        display: flex;
        align-items: baseline;
        gap: 8px;
        white-space: nowrap;
        overflow: hidden;
      }
      .ust-ilerleme-satir b { font: 600 15px/1.15 var(--sans); color: var(--ink); }
      .ust-ilerleme-satir span {
        font: 600 13px/1.15 var(--sans);
        color: var(--pirinc);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ust-cizgi-iz {
        width: 100%;
        max-width: 196px;
        height: 3px;
        border-radius: 3px;
        background: rgba(var(--ink-rgb), 0.14);
        overflow: hidden;
      }
      .ust-cizgi-dolu {
        width: 28%;
        height: 100%;
        border-radius: 3px;
        background: var(--pirinc);
      }

      .ust-sag { display: flex; align-items: center; gap: 8px; flex: none; }
      .cam-hap {
        min-height: 44px;
        padding: 0 13px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--overlay-btn);
        color: var(--ink);
        font: 600 13px/1 var(--sans);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      .cam-hap .nokta { width: 7px; height: 7px; border-radius: 50%; background: var(--pirinc); }
      .cam-hap.vurgulu { border-color: rgba(var(--pirinc-rgb), 0.55); }
      .cam-yuvarlak {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--overlay-btn);
        color: var(--ink);
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      /* Sağ kenarda çok ince görsel dönem pusulası (dokunmasız, sadece konum hissi) */
      .sag-pusula {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 15;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        pointer-events: none;
      }
      .pusula-nokta {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(var(--ink-rgb), 0.22);
        transition: transform 0.25s ease, background 0.25s ease;
      }
      .pusula-nokta.aktif {
        transform: scale(1.65);
        background: var(--pirinc);
      }

      /* Kaydırılabilir kronolojik atlas */
      .harita-kaydir {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: none;
      }
      .harita-kaydir::-webkit-scrollbar { display: none; }

      .atlas-akis {
        width: 390px;
        padding: 84px 18px 124px 16px;
      }

      /* Dönem fasılı */
      .fasil {
        position: relative;
        padding-bottom: 24px;
      }
      .fasil-bas {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 4px 12px 34px;
        position: relative;
      }
      .fasil-bas::before {
        content: '';
        position: absolute;
        left: 11px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: rgba(var(--fasil-rgb), 0.4);
      }
      .fasil.kilitli .fasil-bas::before {
        background: repeating-linear-gradient(180deg, rgba(var(--ink-rgb), 0.16) 0 4px, transparent 4px 9px);
      }
      .fasil-muhur {
        position: absolute;
        left: 5px;
        bottom: 16px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: rgb(var(--fasil-rgb));
        border: 2.5px solid var(--bg);
        box-shadow: 0 0 0 1.5px rgba(var(--fasil-rgb), 0.5);
      }
      .fasil.kilitli .fasil-muhur {
        background: var(--surface);
        border-color: var(--border);
        box-shadow: none;
      }
      .fasil-bas-sol { display: flex; flex-direction: column; gap: 2px; }
      .fasil-yuzyil { font: 600 13px/1.25 var(--sans); color: var(--pirinc); }
      .fasil-ad {
        margin: 0;
        font: 500 24px/1.1 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .fasil.kilitli .fasil-ad { color: var(--ink-2); }
      .fasil-sag {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        flex: none;
      }
      .fasil-sayac { font: 500 12px/1.2 var(--sans); color: var(--ink-2); }
      .fasil-cizgi {
        width: 48px;
        height: 3px;
        border-radius: 3px;
        background: rgba(var(--ink-rgb), 0.14);
        overflow: hidden;
      }
      .fasil-cizgi i {
        display: block;
        height: 100%;
        border-radius: 3px;
        background: rgb(var(--fasil-rgb));
      }

      /* Omurga üstündeki duraklar */
      .omurga-listesi {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      /* 1) Sakin durak satırı (tamamlanan veya kilitli) */
      .omurga-satir-kap {
        position: relative;
        padding-left: 34px;
      }
      .omurga-satir-kap::before {
        content: '';
        position: absolute;
        left: 11px;
        top: 0;
        bottom: -6px;
        width: 2px;
        background: rgba(var(--durak-rgb), 0.5);
      }
      .omurga-satir-kap.kilitli::before {
        background: repeating-linear-gradient(180deg, rgba(var(--ink-rgb), 0.16) 0 4px, transparent 4px 9px);
      }
      .fasil:last-child .omurga-satir-kap:last-child::before { bottom: 50%; }

      .omurga-nokta {
        position: absolute;
        left: 6px;
        top: 50%;
        transform: translateY(-50%);
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--bg);
        border: 2px solid rgb(var(--durak-rgb));
        z-index: 2;
      }
      .omurga-satir-kap.bitti .omurga-nokta {
        background: var(--right);
        border-color: var(--right);
      }
      .omurga-satir-kap.kilitli .omurga-nokta {
        background: var(--surface);
        border-color: var(--border);
      }

      .satir-btn {
        width: 100%;
        min-height: 58px;
        padding: 7px 12px 7px 8px;
        border-radius: 18px;
        border: 1px solid var(--border-ince);
        background: rgba(var(--surface-rgb), 0.86);
        color: var(--ink);
        display: flex;
        align-items: center;
        gap: 11px;
        text-align: left;
        cursor: pointer;
        transition: transform 0.16s ease, background 0.16s ease;
      }
      .satir-btn:active { transform: scale(0.985); }
      .omurga-satir-kap.kilitli .satir-btn {
        background: rgba(var(--surface-rgb), 0.45);
      }

      .satir-kare {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        overflow: hidden;
        background: var(--surface-2);
        display: grid;
        place-items: center;
        color: var(--ink-3);
      }
      .satir-kare img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .omurga-satir-kap.kilitli .satir-kare img { filter: grayscale(0.86) sepia(0.2); opacity: 0.65; }
      .satir-kare .muhur {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 30%, rgba(var(--durak-rgb), 0.22), transparent 80%);
      }

      .satir-bilgi { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .satir-ad {
        font: 500 15.5px/1.2 var(--serif);
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .omurga-satir-kap.kilitli .satir-ad { color: var(--ink-2); }
      .satir-alt { font: 400 12.5px/1.25 var(--sans); color: var(--ink-3); }

      .yildizlar { display: inline-flex; align-items: center; gap: 2.5px; flex: none; }
      .yildiz-svg { width: 13px; height: 13px; }
      .yildiz-svg.dolu { color: var(--pirinc); }
      .yildiz-svg.bos { color: rgba(var(--ink-rgb), 0.2); }

      /* 2) Sıradaki Durak — Haritanın Tek Kahraman Kartı */
      .omurga-satir-kap.simdiki {
        padding-top: 8px;
        padding-bottom: 10px;
      }
      .omurga-satir-kap.simdiki .omurga-nokta {
        left: 3px;
        top: 34px;
        transform: none;
        width: 18px;
        height: 18px;
        background: var(--pirinc);
        border: 3px solid var(--bg);
        box-shadow: 0 0 0 4px rgba(var(--pirinc-rgb), 0.25);
      }

      .kahraman-kart {
        border-radius: 26px;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid rgba(var(--pirinc-rgb), 0.45);
        box-shadow: 0 20px 44px rgba(var(--golge-rgb), 0.28);
      }
      .kahraman-kapak-btn {
        position: relative;
        display: block;
        width: 100%;
        height: 172px;
        padding: 0;
        border: 0;
        background: var(--surface-2);
        overflow: hidden;
        cursor: pointer;
      }
      .kahraman-kapak-btn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .kahraman-kapak-btn::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 45%, rgba(var(--surface-rgb), 0.72) 85%, var(--surface) 100%);
      }
      .kahraman-kunye {
        margin: 4px 0 0;
        font: italic 400 13.5px/1.3 var(--okuma);
        color: var(--ink-2);
      }
      .kahraman-govde {
        position: relative;
        z-index: 2;
        margin-top: -18px;
        padding: 0 16px 16px;
      }
      .kahraman-etiket {
        font: 600 13px/1.25 var(--sans);
        color: var(--pirinc);
      }
      .kahraman-ad {
        margin: 4px 0 0;
        font: 500 24px/1.1 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .kahraman-meta {
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        font: 400 13px/1.3 var(--sans);
        color: var(--ink-2);
      }
      .kahraman-meta .yildiz-svg { width: 15px; height: 15px; }

      .kahraman-eylemler {
        margin-top: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ana-dugme {
        flex: 1;
        min-height: 48px;
        padding: 0 18px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--bg);
        font: 600 15.5px/1 var(--sans);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
      }
      .ana-dugme:active { transform: scale(0.98); }
      .ikincil-dugme {
        min-height: 48px;
        padding: 0 15px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--ink);
        font: 500 14px/1 var(--sans);
        cursor: pointer;
      }

      /* Alt sekme çubuğu */
      .sekme-cubugu {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 14px;
        z-index: 25;
        height: 62px;
        padding: 5px;
        border-radius: 999px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        background: var(--tab-bg);
        border: 1px solid var(--border);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
        box-shadow: 0 12px 30px rgba(var(--golge-rgb), 0.28);
      }
      .sekme-oge {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        border-radius: 999px;
        color: var(--ink-2);
        font: 600 10.5px/1.1 var(--sans);
        text-decoration: none;
      }
      .sekme-oge.secili { background: rgba(var(--ink-rgb), 0.12); color: var(--ink); }
      .sekme-rozet {
        position: absolute;
        top: 3px;
        left: calc(50% + 7px);
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        border-radius: 999px;
        background: var(--pirinc);
        color: var(--pirinc-yazi);
        font: 700 10px/17px var(--sans);
        text-align: center;
      }

      /* Durak & Kurs Paneli */
      .perde {
        position: absolute;
        inset: 0;
        z-index: 40;
        background: var(--panel-perde);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--gecis);
      }
      .perde.acik { opacity: 1; pointer-events: auto; }

      .yaprak {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 14px;
        z-index: 45;
        max-height: 756px;
        border-radius: 30px;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: 0 -14px 44px rgba(var(--golge-rgb), 0.36);
        transform: translateY(105%);
        opacity: 0;
        pointer-events: none;
        transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease;
        display: flex;
        flex-direction: column;
      }

        right: 10px;
        z-index: 5;

        height: 44px;

        bottom: 10px;

        margin: 0;
        padding: 0;
        list-style: none;
        border-radius: 20px;
        background: var(--surface-2);
        border: 1px solid var(--border-ince);
        overflow: hidden;

      .panel-satir {
        width: 100%;
        min-height: 52px;
        padding: 8px 14px;
        border: 0;
        border-bottom: 1px solid var(--border-ince);
        background: transparent;
        color: var(--ink);
        font: 400 14.5px/1.3 var(--sans);

        align-items: center;
        gap: 12px;

      const starSvg = (dolu) =>
        `<svg class="yildiz-svg ${dolu ? 'dolu' : 'bos'}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.3l-5.9 3.2 1.2-6.5-4.8-4.6 6.6-.9z"/></svg>`;
      const starsHtml = (n) =>
        `<span class="yildizlar" role="img" aria-label="${n} / 3 yıldız">${[0, 1, 2].map((i) => starSvg(i < n)).join('')}</span>`;
      const lockSvg = (s = 13) =>
        `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>`;
      const checkSvg = (s = 14) =>
        `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
      const chevRight = () =>
        `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`;

      // Sağ pusula noktaları
      const sagPusula = document.getElementById('sagPusula');
      BOLGELER.forEach((b) => {
        const dot = document.createElement('span');
        dot.className = 'pusula-nokta';
        dot.dataset.pusula = b.id;
        sagPusula.appendChild(dot);
      });

      // Kronolojik akış (yukarıdan aşağıya: Orta Çağ -> Modern sanat)
      const atlasAkis = document.getElementById('atlasAkis');

      BOLGELER.forEach((b) => {
        const duraklar = DURAKLAR.filter((d) => d.bolge === b.id);
        const acikAdet = duraklar.filter((d) => d.acik).length;
        const yildizTop = duraklar.reduce((t, d) => t + (d.yildiz || 0), 0);
        const oran = Math.round((acikAdet / duraklar.length) * 100);

        const sec = document.createElement('section');
        sec.className = `fasil${acikAdet ? '' : ' kilitli'}`;
        sec.dataset.bolge = b.id;
        sec.style.setProperty('--fasil-rgb', b.rgb);

        const durakHtml = duraklar
          .map((d) => {
            if (d.simdiki) {
              return `
                <div class="omurga-satir-kap simdiki" id="simdikiDurak" style="--durak-rgb:${d.rgb}">
                  <span class="omurga-nokta" aria-hidden="true"></span>
                  <article class="kahraman-kart">
                    <button type="button" class="kahraman-kapak-btn" data-durak="${d.id}" aria-label="${d.ad} ayrıntılarını aç">
                      <img src="${d.gorsel}" alt="${d.eser}" style="object-position:${d.odak || '50% 24%'}">
                    </button>
                    <div class="kahraman-govde">
                      <span class="kahraman-etiket">Sıradaki durak · ${d.sanatcilar.length} sanatçı</span>
                      <h3 class="kahraman-ad">${d.ad}</h3>
                      <p class="kahraman-kunye">${d.eser}</p>
                      <div class="kahraman-meta">
                        ${starsHtml(d.yildiz)}
                        <span>${d.siradakiDetay}</span>
                      </div>
                      <div class="kahraman-eylemler">
                        <button type="button" class="ana-dugme" data-hizli-basla="${d.ad} — Orta turu başlatılıyor (10 soru)">Turu başlat</button>
                        <button type="button" class="ikincil-dugme" data-durak="${d.id}">Ayrıntılar</button>
                      </div>
                    </div>
                  </article>
                </div>`;
            }

            const durumSinif = d.acik ? 'bitti' : 'kilitli';
            const kare = d.gorsel
              ? `<img src="${d.gorsel}" alt="" style="object-position:${d.odak || '50% 40%'}" loading="lazy">`
              : `<span class="muhur">${lockSvg(15)}</span>`;
            return `
              <div class="omurga-satir-kap ${durumSinif}" style="--durak-rgb:${d.rgb}">
                <span class="omurga-nokta" aria-hidden="true"></span>
                <button type="button" class="satir-btn" data-durak="${d.id}" aria-label="${d.ad}${d.acik ? `, ${d.yildiz} yıldız` : `, ${d.kilit}`}">
                  <span class="satir-kare">${kare}</span>
                  <span class="satir-bilgi">
                    <span class="satir-ad">${d.ad}</span>
                    <span class="satir-alt">${d.acik ? `${d.sanatcilar.length} sanatçı · tamamlandı` : d.kilit}</span>
                  </span>
                  ${d.acik ? starsHtml(d.yildiz) : `<span style="color:var(--ink-3)">${lockSvg(14)}</span>`}
                </button>
              </div>`;
          })
          .join('');

        sec.innerHTML = `
          <div class="fasil-bas">
            <span class="fasil-muhur" aria-hidden="true"></span>
            <div class="fasil-bas-sol">
              <span class="fasil-yuzyil">${b.yuzyil}</span>
              <h2 class="fasil-ad">${b.ad}</h2>

            <div class="fasil-sag">
              <span class="fasil-sayac">${acikAdet ? `${acikAdet}/${duraklar.length} · ${yildizTop} ★` : `${duraklar.length} kilitli`}</span>
              <span class="fasil-cizgi" aria-hidden="true"><i style="width:${oran}%"></i></span>
            </div>
          </div>
          <div class="omurga-listesi">${durakHtml}</div>`;

        atlasAkis.appendChild(sec);
      });

      // Durak paneli
      const perde = document.getElementById('perde');
      const yaprak = document.getElementById('yaprak');
      const yaprakIc = document.getElementById('yaprakIc');
      const bildirim = document.getElementById('bildirim');
      let bildirimZaman;

      function bildir(metin) {
        bildirim.textContent = metin;
        bildirim.classList.add('acik');
        clearTimeout(bildirimZaman);
        bildirimZaman = setTimeout(() => bildirim.classList.remove('acik'), 2400);
      }

      function yaprakKapat() {
        perde.classList.remove('acik');
        yaprak.classList.remove('acik');
      }

      function durakAc(id) {
        const d = DURAKLAR.find((x) => x.id === id);
        if (!d) return;
        const b = BOLGELER.find((x) => x.id === d.bolge);
        yaprak.style.setProperty('--durak-renk', d.renk);
        yaprak.style.setProperty('--durak-rgb', d.rgb);

        const kapakHtml = d.gorsel
          ? `<div class="panel-kapak${d.acik ? '' : ' kilit-resim'}"><img src="${d.gorsel}" alt="${d.eser}" style="object-position:${d.odak || '50% 40%'}"><span class="panel-kunye">${d.eser}</span></div>`
          : `<div class="panel-kapak"><div class="panel-kapak-desen">${lockSvg(24)}<span>${b.ad}</span></div></div>`;

        const gruplar = d.gruplar || [{ adlar: d.sanatcilar.join(', '), tamam: d.acik && d.yildiz >= 1 }];
        const tanisHtml = gruplar
          .map((g, i) => `
            <li>
              <button type="button" class="panel-satir" ${d.acik ? '' : 'disabled'} data-aksiyon="${i + 1}. grup tanışması açılıyor">
                <span class="p-kucuk${g.tamam ? ' dolu' : ''}">${g.kucuk ? `<img src="${g.kucuk}" alt="" style="object-position:${g.odak || '50% 25%'}">` : (g.tamam ? checkSvg(14) : `${i + 1}`)}</span>
                <span class="p-ad">${g.adlar}</span>
                <span class="p-son${g.tamam ? ' tamam' : ''}">${d.acik ? (g.tamam ? checkSvg(14) : 'Tanış') : ''}</span>
              </button>
            </li>`)
          .join('');

        const seviyeler = [
          { key: 'kolay', ad: 'Kolay', soru: '8 soru', acik: d.acik, puan: d.kolay },
          { key: 'orta', ad: 'Orta', soru: '10 soru', acik: d.acik && (d.kolay || 0) >= 75, puan: d.orta },
          { key: 'zor', ad: 'Zor', ek: 'isteğe bağlı', soru: '10 soru', acik: d.acik && (d.orta || 0) >= 75, puan: d.zor },
        ];
        const siradakiSv = d.acik ? (seviyeler.find((s) => s.acik && !(s.puan >= 75))?.key || 'kolay') : null;

        const seviyeHtml = d.acik
          ? seviyeler
              .map((s) => {
                const gecti = (s.puan || 0) >= 75;
                const sirada = s.key === siradakiSv;
                const son = !s.acik ? (s.key === 'orta' ? 'Kolay’ı geçince' : 'Orta’yı geçince') : gecti ? `%${s.puan}` : s.soru;
                return `
                  <li>
                    <button type="button" class="panel-satir${sirada ? ' sirada' : ''}" ${s.acik ? '' : 'disabled'} data-aksiyon="${d.ad} · ${s.ad} turu başlatılıyor">
                      <span class="p-kucuk${gecti ? ' dolu' : sirada ? ' sirada' : ''}">${s.acik ? starSvg(true).replace('yildiz-svg dolu', '') : lockSvg(14)}</span>
                      <span class="p-ad">${s.ad}${s.ek ? `<small>${s.ek}</small>` : ''}</span>
                      <span class="p-son${gecti ? ' tamam' : sirada ? ' sirada' : ''}">${son}${gecti ? checkSvg(14) : ''}</span>
                    </button>
                  </li>`;
              })
              .join('')
          : '';

        const baslaHtml = d.acik
          ? `<button type="button" class="ana-dugme" style="width:100%;min-height:52px;margin-top:16px" data-aksiyon="${d.ad} — ${d.siradakiDetay || 'Tur'} başlatılıyor">Turu başlat</button>`
          : `<p class="panel-kilit-yazi">${d.kilit}. Bu bölümün konusu kursta işlenince durak açılır.</p>`;

        yaprakIc.innerHTML = `
          <div class="yaprak-tutamak" aria-hidden="true"></div>
          ${kapakHtml}
          <p class="panel-ust"><i aria-hidden="true"></i>${b.ad} · ${d.sanatcilar.length} sanatçı</p>
          <h2 class="panel-ad">${d.ad}</h2>
          ${d.acik ? `<div class="panel-yildiz-satir">${starsHtml(d.yildiz)}<span>${d.yildiz} / 3 yıldız · ${d.siradakiDetay || 'Tamamlandı'}</span></div>` : ''}
          ${baslaHtml}
          <p class="panel-bolum-baslik">Sanatçılarla tanışma</p>
          <ol class="panel-liste">${tanisHtml}</ol>
          <p class="panel-bolum-baslik">${d.acik ? 'Seviyeler ve akım' : 'Akım'}</p>
          <ol class="panel-liste">
            ${seviyeHtml}
            <li>
              <button type="button" class="panel-satir" data-aksiyon="${d.akim} akım sayfası açılıyor">
                <span class="p-kucuk">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 20h18M5 20V9M9 20V9M15 20V9M19 20V9M2 9l10-5 10 5"/></svg>
                </span>
                <span class="p-ad">Akım sayfası <small>${d.akim}</small></span>
                <span class="p-son">${chevRight()}</span>
              </button>
            </li>
          </ol>`;

        yaprakIc.scrollTop = 0;
        perde.classList.add('acik');
        yaprak.classList.add('acik');
      }

      function kursAc() {
        yaprakIc.innerHTML = `
          <div class="yaprak-tutamak" aria-hidden="true"></div>
          <p class="panel-ust"><i aria-hidden="true"></i>Kursun neresindesin</p>
          <h2 class="panel-ad">16 / 57 konu işlendi</h2>
          <p class="panel-kilit-yazi">Şu an <strong>Rönesans</strong> dönemindesin. Sıradaki konuyu işaretlediğinde yeni sanatçılar açılır.</p>
          <p class="panel-bolum-baslik">Sıradaki konu · Konu 19</p>
          <ol class="panel-liste">
            <li>
              <div class="panel-satir" style="cursor:default">
                <span class="p-kucuk sirada">19</span>
                <span class="p-ad">Michelangelo ve Sistina tavanı<small style="display:block;margin:2px 0 0">2 sanatçı açılacak</small></span>
              </div>
            </li>
          </ol>
          <button type="button" class="ana-dugme" style="width:100%;min-height:52px;margin-top:16px" data-aksiyon="Konu 19 işlendi olarak işaretlendi">Konu 19’u işlendi yap</button>`;
        yaprakIc.scrollTop = 0;
        perde.classList.add('acik');
        yaprak.classList.add('acik');
      }

      const kaydir = document.getElementById('kaydir');
      const ustDonemAd = document.getElementById('ustDonemAd');
      const siradakiBtn = document.getElementById('siradakiBtn');

      function konumuGuncelle() {
        const kRect = kaydir.getBoundingClientRect();
        const ortaY = kRect.top + kRect.height * 0.44;
        let enYakin = null;
        let enMesafe = Infinity;
        for (const el of atlasAkis.querySelectorAll('.fasil')) {
          const r = el.getBoundingClientRect();
          const m = Math.abs((r.top + r.bottom) / 2 - ortaY);
          if (m < enMesafe) { enMesafe = m; enYakin = el.dataset.bolge; }
        }
        const b = BOLGELER.find((x) => x.id === enYakin);
        if (b) {
          ustDonemAd.textContent = b.ad;
          document.documentElement.style.setProperty('--donem-rgb', b.rgb);
          document.documentElement.style.setProperty('--desen-url', `url('../../NoraSanat/Ekranlar/Galeri/Desenler/desen-${b.id}@3x.png')`);
          sagPusula.querySelectorAll('.pusula-nokta').forEach((p) => p.classList.toggle('aktif', p.dataset.pusula === b.id));
        }
        const simdikiEl = document.getElementById('simdikiDurak');
        if (simdikiEl) {
          const r = simdikiEl.getBoundingClientRect();
          const gorunur = r.bottom > kRect.top + 80 && r.top < kRect.bottom - 90;
          siradakiBtn.classList.toggle('vurgulu', !gorunur);
        }
      }

      function siradakiniOrtala(yumusak = false) {
        const simdikiEl = document.getElementById('simdikiDurak');
        if (!simdikiEl) return;
        const top = simdikiEl.getBoundingClientRect().top - kaydir.getBoundingClientRect().top + kaydir.scrollTop;
        const hedef = top - kaydir.clientHeight * 0.47 + simdikiEl.offsetHeight / 2;
        const az = document.documentElement.dataset.hareket === 'az' || matchMedia('(prefers-reduced-motion: reduce)').matches;
        kaydir.scrollTo({ top: Math.max(0, hedef), behavior: yumusak && !az ? 'smooth' : 'auto' });
        konumuGuncelle();
      }

      const vakitIkon = document.getElementById('vakitIkon');
      function temaUygula(t) {
        document.documentElement.dataset.tema = t;
        document.querySelectorAll('[data-tema-btn]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.temaBtn === t)));
        document.getElementById('vakitBtn').setAttribute('aria-label', t === 'gece' ? 'Gündüze geç' : 'Geceye geç');
        vakitIkon.innerHTML =
          t === 'gece'
            ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
            : '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>';
      }
      function hareketUygula(h) {
        document.documentElement.dataset.hareket = h;
        document.querySelectorAll('[data-hareket-btn]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.hareketBtn === h)));
      }

      document.querySelectorAll('[data-tema-btn]').forEach((b) => b.addEventListener('click', () => temaUygula(b.dataset.temaBtn)));
      document.querySelectorAll('[data-hareket-btn]').forEach((b) => b.addEventListener('click', () => hareketUygula(b.dataset.hareketBtn)));
      document.getElementById('vakitBtn').addEventListener('click', () => temaUygula(document.documentElement.dataset.tema === 'gece' ? 'gunduz' : 'gece'));
      document.getElementById('kursBtn').addEventListener('click', kursAc);
      document.getElementById('siradakiBtn').addEventListener('click', () => siradakiniOrtala(true));
      document.getElementById('yaprakKapat').addEventListener('click', yaprakKapat);
      perde.addEventListener('click', yaprakKapat);

      atlasAkis.addEventListener('click', (e) => {
        const basla = e.target.closest('[data-hizli-basla]');
        if (basla) { bildir(basla.dataset.hizliBasla); return; }
        const btn = e.target.closest('[data-durak]');
        if (btn) durakAc(btn.dataset.durak);
      });
      yaprakIc.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-aksiyon]');
        if (btn) bildir(btn.dataset.aksiyon);
      });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') yaprakKapat(); });
      kaydir.addEventListener('scroll', konumuGuncelle, { passive: true });

      const q = new URLSearchParams(location.search);
      temaUygula(q.get('tema') === 'gunduz' ? 'gunduz' : 'gece');
      if (q.get('hareket') === 'az') hareketUygula('az');

      requestAnimationFrame(() => {
        siradakiniOrtala(false);
        if (q.get('durak')) durakAc(q.get('durak'));
      });
    </script>
  </body>
</html>
