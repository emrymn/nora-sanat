<!doctype html>
<html lang="tr" data-tema="gece" data-donem="barok">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galeri · Akımlar · Yön 1 — Müze katları</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Archivo:wght@400;500;600;700&display=swap"
    />
    <style>
      @font-face {
        font-family: 'Bodoni Moda';
        src: url('../../NoraSanat/YaziTipleri/BodoniModa.ttf') format('truetype');
        font-weight: 400 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader.ttf') format('truetype');
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader-Italic.ttf') format('truetype');
        font-weight: 200 800;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Archivo';
        src: url('../../NoraSanat/YaziTipleri/Archivo.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      /* =====================================================================
         Sanat Atlası — Tema değişkenleri (css/app.css & TemaRenkleri.swift)
         ===================================================================== */
      :root,
      :root[data-tema='gece'] {
        --bg: #121110;
        --bg-rgb: 18, 17, 16;
        --surface: #1c1a18;
        --surface-cam: rgba(28, 26, 24, 0.78);
        --border: #2e2b28;
        --border-ince: rgba(235, 229, 218, 0.11);
        --ink: #ebe5da;
        --ink-rgb: 235, 229, 218;
        --ink-2: #aca498;
        --ink-3: #8a8379;
        --ink-soluk: #645e57;
        --pirinc: #c9a45c;
        --pirinc-rgb: 201, 164, 92;
        --right: #6fb487;
        --tab-bg: rgba(24, 22, 20, 0.84);
        --overlay-btn: rgba(18, 17, 16, 0.64);
        --doku: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.04;
        --hale-karisim: normal;
        --hale-1-op: 0.34;
        --hale-2-op: 0.24;
        --kart-golge: 0 22px 48px rgba(0, 0, 0, 0.44);
        --sekme-golge: 0 10px 30px rgba(0, 0, 0, 0.45);
        --sayfa-zemin: #0c0b0a;
        color-scheme: dark;
      }

      :root[data-tema='gunduz'] {
        --bg: #ece8e1;
        --bg-rgb: 236, 232, 225;
        --surface: #f7f5f1;
        --surface-cam: rgba(247, 245, 241, 0.86);
        --border: #d6d0c6;
        --border-ince: rgba(31, 27, 23, 0.10);
        --ink: #1f1b17;
        --ink-rgb: 31, 27, 23;
        --ink-2: #4c463f;
        --ink-3: #5f5850;
        --ink-soluk: #8e867c;
        --pirinc: #8a651c;
        --pirinc-rgb: 138, 101, 28;
        --right: #2a6644;
        --tab-bg: rgba(247, 245, 241, 0.88);
        --overlay-btn: rgba(247, 245, 241, 0.85);
        --doku: radial-gradient(rgba(31, 27, 23, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.045;
        --hale-karisim: multiply;
        --hale-1-op: 0.20;
        --hale-2-op: 0.14;
        --kart-golge: 0 18px 36px rgba(20, 17, 14, 0.14);
        --sekme-golge: 0 10px 28px rgba(20, 17, 14, 0.14);
        --sayfa-zemin: #e2ddd4;
        color-scheme: light;
      }

      :root {
        --serif: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
        --sans: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --okuma: 'Newsreader', 'Iowan Old Style', Georgia, serif;
        --hale-1-rgb: 44, 78, 128;
        --hale-2-rgb: 196, 152, 74;
        --desen-url: url('../../NoraSanat/Ekranlar/Galeri/Desenler/desen-barok@3x.png');
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--sayfa-zemin);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      /* Önizleme üst çubuğu */
      .onizleme-ust {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 28px;
        background: var(--tab-bg);
        border-bottom: 1px solid var(--border);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
      }

      .onizleme-baslik {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .onizleme-baslik .ust-not {
        font: 600 13px/1.3 var(--sans);
        color: var(--pirinc);
      }
      .onizleme-baslik h1 {
        margin: 0;
        font: 500 23px/1.15 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
      }

      .tema-kabi {
        display: inline-flex;
        padding: 4px;
        gap: 2px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
      }
      .tema-kabi button {
        min-height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        font: 600 13px/1 var(--sans);
        cursor: pointer;
      }
      .tema-kabi button[aria-pressed='true'] {
        background: rgba(var(--ink-rgb), 0.14);
        color: var(--ink);
      }

      .sahne {
        display: flex;
        justify-content: center;
        padding: 36px 20px 64px;
      }

      /* 390 × 844 iPhone */
      .telefon {
        position: relative;
        width: 390px;
        height: 844px;
        border-radius: 44px;
        overflow: hidden;
        background-color: var(--bg);
        border: 1px solid var(--border);
        box-shadow: 0 32px 84px rgba(0, 0, 0, 0.44);
        isolation: isolate;
      }

      /* Üç katmanlı zemin: 1) Doku, 2) Tablo halesi, 3) Gerçek dönem desen karosu */
      .zemin-doku {
        position: absolute;
        inset: 0;
        z-index: 0;
        background-image: var(--doku);
        background-size: 3px 3px;
        pointer-events: none;
      }
      .zemin-hale {
        position: absolute;
        inset: 0;
        z-index: 1;
        mix-blend-mode: var(--hale-karisim);
        background:
          radial-gradient(125% 50% at 0% 0%, rgba(var(--hale-1-rgb), var(--hale-1-op)) 0%, rgba(var(--hale-1-rgb), 0.08) 48%, transparent 84%),
          radial-gradient(96% 42% at 100% 100%, rgba(var(--hale-2-rgb), var(--hale-2-op)) 0%, rgba(var(--hale-2-rgb), 0.05) 44%, transparent 80%);
        transition: background 500ms ease;
        pointer-events: none;
      }
      .zemin-desen {
        position: absolute;
        inset: 0;
        z-index: 2;
        background-color: var(--ink);
        opacity: var(--desen-opaklik);
        -webkit-mask-image: var(--desen-url);
        mask-image: var(--desen-url);
        -webkit-mask-size: 96px 96px;
        mask-size: 96px 96px;
        -webkit-mask-repeat: repeat;
        mask-repeat: repeat;
        transition: opacity 350ms ease;
        pointer-events: none;
      }

      .telefon-kaydir {
        position: relative;
        z-index: 3;
        height: 100%;
        overflow-y: auto;
        overflow-x: clip;
        scrollbar-width: none;
      }
      .telefon-kaydir::-webkit-scrollbar {
        display: none;
      }

      .durum-cubugu {
        position: sticky;
        top: 0;
        z-index: 14;
        height: 46px;
        padding: 14px 26px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font: 600 14px/1 var(--sans);
        color: var(--ink);
        pointer-events: none;
      }
      .durum-simgeler {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .ekran-ic {
        padding: 4px 20px 116px;
      }

      /* =====================================================================
         Galeri üstü: Başlık + Arama hapı + Kalp + 4 bölüm sekmesi
         ===================================================================== */
      .galeri-ust-satir {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
      }
      .galeri-ust-satir h2 {
        margin: 0;
        font: 400 32px/1 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
        flex: none;
      }
      .arama-hapi {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 0 13px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        -webkit-backdrop-filter: blur(22px) saturate(1.5);
        backdrop-filter: blur(22px) saturate(1.5);
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: var(--ink-2);
        font: 400 14px/1 var(--sans);
      }
      .arama-hapi span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kalp-btn {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        -webkit-backdrop-filter: blur(22px) saturate(1.5);
        backdrop-filter: blur(22px) saturate(1.5);
        display: grid;
        place-items: center;
        color: var(--pirinc);
        text-decoration: none;
      }

      /* Bölüm sekmeleri: tek cam kap, yazılı, ikonsuz */
      .bolumler {
        margin-top: 12px;
        padding: 4px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        -webkit-backdrop-filter: blur(22px) saturate(1.5);
        backdrop-filter: blur(22px) saturate(1.5);
        display: grid;
        grid-template-columns: 1fr 1.24fr 1fr 0.92fr;
        gap: 2px;
      }
      .bolumler button {
        min-height: 44px;
        padding: 0 6px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        font: 500 13.5px/1 var(--sans);
        cursor: pointer;
        white-space: nowrap;
      }
      .bolumler button[aria-current='page'] {
        background: rgba(var(--ink-rgb), 0.14);
        color: var(--ink);
        font-weight: 600;
      }

      /* Konum özeti: nerede olduğumu tek bakışta göster */
      .konum-seridi {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .konum-ust {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }
      .ust-yazi {
        font: 600 13px/1.3 var(--sans);
        color: var(--pirinc);
      }
      .konum-not {
        font: 400 13px/1.3 var(--sans);
        color: var(--ink-2);
      }
      .konum-cubuk {
        height: 3px;
        border-radius: 999px;
        background: rgba(var(--ink-rgb), 0.12);
        overflow: hidden;
      }
      .konum-cubuk i {
        display: block;
        width: 35.7%;
        height: 100%;
        border-radius: inherit;
        background: var(--pirinc);
      }

      /* =====================================================================
         Dönem Atlama Şeridi (Çarkın yerine: alt çizgili metin sekmeleri)
         ===================================================================== */
      .donem-seridi {
        margin: 14px -20px 0;
        padding: 0 20px;
        display: flex;
        gap: 18px;
        overflow-x: auto;
        overflow-y: hidden;
        border-bottom: 1px solid var(--border);
        scrollbar-width: none;
      }
      .donem-seridi::-webkit-scrollbar {
        display: none;
      }
      .donem-sekme {
        flex: none;
        position: relative;
        min-height: 44px;
        padding: 0 2px;
        border: 0;
        background: transparent;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--ink-2);
        font: 500 13.5px/1 var(--sans);
        cursor: pointer;
        white-space: nowrap;
      }
      .donem-sekme.kilitli {
        color: var(--ink-3);
      }
      .donem-sekme[aria-selected='true'] {
        color: var(--ink);
        font-weight: 600;
      }
      .donem-sekme[aria-selected='true']::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        border-radius: 2px;
        background: var(--pirinc);
      }
      .donem-sembol {
        width: 15px;
        height: 15px;
        color: var(--pirinc);
        opacity: 0.78;
        flex: none;
      }
      .donem-sekme.kilitli .donem-sembol {
        color: var(--ink-3);
        opacity: 0.55;
      }

      /* =====================================================================
         Kemerli Salon Şeridi (Yatay doğal kaydırma, dikey kaydırmayı engellemez)
         ===================================================================== */
      .salon-sahne {
        margin-top: 20px;
      }

      .kemer-serit {
        margin: 0 -20px;
        padding: 6px 81px 14px;
        display: flex;
        gap: 16px;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-padding-inline: 81px;
        scrollbar-width: none;
        touch-action: pan-x pan-y;
      }
      .kemer-serit::-webkit-scrollbar {
        display: none;
      }

      .kemer-oge {
        flex: 0 0 228px;
        scroll-snap-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        transition: transform 280ms cubic-bezier(0.2, 0.7, 0.2, 1), opacity 280ms ease;
      }
      .kemer-oge:not(.secili) {
        transform: scale(0.88) translateY(14px);
        opacity: 0.58;
      }

      .kemer-kutu {
        position: relative;
        width: 228px;
        height: 282px;
        border-radius: 114px 114px 18px 18px;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--kart-golge);
      }
      .kemer-oge.secili .kemer-kutu {
        border-color: rgba(var(--pirinc-rgb), 0.75);
      }
      .kemer-kutu img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: filter 280ms ease;
      }
      /* Kilitli akımlarda soğuk gri yerine merak uyandıran sıcak buğu + hafif renk */
      .kemer-oge.kilitli .kemer-kutu img {
        filter: saturate(0.32) sepia(0.26) brightness(0.66) blur(1.4px);
        transform: scale(1.04);
      }
      .kemer-kutu::after {
        content: '';
        position: absolute;
        inset: auto 0 0;
        height: 92px;
        background: linear-gradient(180deg, transparent 0%, rgba(18, 17, 16, 0.62) 100%);
        pointer-events: none;
      }
      .kemer-sembol-rozet {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(18, 17, 16, 0.54);
        border: 1px solid rgba(244, 240, 232, 0.22);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        display: grid;
        place-items: center;
        color: #ebd295;
      }
      .kemer-alt-etiket {
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 12px;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font: 500 12px/1.2 var(--sans);
        color: rgba(244, 240, 232, 0.88);
      }
      .kemer-kilit-halka {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: #f2ece2;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      }
      .kemer-kilit-halka span {
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(18, 17, 16, 0.58);
        border: 1px solid rgba(244, 240, 232, 0.22);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        font: 600 12.5px/1 var(--sans);
      }

      /* Seçili salonun metin ve eylem bloğu */
      .odak-bilgi {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 6px;
      }
      .odak-ust {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font: 600 13px/1.3 var(--sans);
        color: var(--pirinc);
      }
      .odak-ad {
        margin: 0;
        font: 500 34px/1.06 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
        text-wrap: balance;
      }
      .odak-durum {
        margin: 0;
        font: 400 14.5px/1.35 var(--sans);
        color: var(--ink-2);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .odak-eser {
        margin: 0;
        font: italic 400 13.5px/1.3 var(--okuma);
        color: var(--ink-3);
      }

      /* EKRANDAKİ TEK DOLU DÜĞME */
      .salona-gir {
        margin-top: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 24px 0 26px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--bg);
        font: 600 15px/1 var(--sans);
        text-decoration: none;
        cursor: pointer;
      }
      .kilit-eylem {
        margin-top: 10px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 46px;
        padding: 0 20px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        color: var(--ink-2);
        font: 500 14px/1 var(--sans);
      }

      /* Sıra gezinti çubuğu: önceki / sıra / sonraki (çarksız keskin geçiş) */
      .gezinme-satir {
        margin-top: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .ok-dugme {
        min-width: 44px;
        min-height: 44px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--overlay-btn);
        color: var(--ink-2);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font: 500 12.5px/1 var(--sans);
        cursor: pointer;
      }
      .ok-dugme:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .gezinme-orta {
        font: 500 13px/1.2 var(--sans);
        color: var(--ink-2);
        text-align: center;
      }

      /* =====================================================================
         Bütün akımlar dizini (28 akım, 9 dönem grubu, gruplu listeler)
         ===================================================================== */
      .dizin-bolum {
        margin-top: 38px;
      }
      .dizin-ust {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .dizin-ust h3 {
        margin: 0;
        font: 500 26px/1.1 var(--serif);
        letter-spacing: -0.01em;
      }
      .dizin-ac-btn {
        min-height: 44px;
        padding: 0 8px;
        border: 0;
        background: transparent;
        color: var(--pirinc);
        font: 600 13.5px/1 var(--sans);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }

      .donem-grup + .donem-grup {
        margin-top: 22px;
      }
      .donem-grup-bas {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
        padding: 0 2px;
      }
      .donem-grup-sol {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .donem-grup-sol b {
        font: 600 13px/1.2 var(--sans);
        color: var(--pirinc);
      }
      .donem-grup-sag {
        font: 400 12.5px/1.2 var(--sans);
        color: var(--ink-3);
      }

      .gruplu-liste {
        margin: 0;
        padding: 0;
        list-style: none;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 22px;
        overflow: hidden;
      }
      .gruplu-liste > li + li {
        border-top: 1px solid var(--border-ince);
      }
      .dizin-satir {
        width: 100%;
        border: 0;
        background: transparent;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 62px;
        padding: 11px 14px;
        text-align: left;
        cursor: pointer;
        color: var(--ink);
      }
      .dizin-satir.secili {
        background: rgba(var(--pirinc-rgb), 0.09);
      }
      .dizin-pul {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        overflow: hidden;
        background: var(--bg);
        border: 1px solid var(--border-ince);
      }
      .dizin-pul img {
        width: 100%;

        function sembolSvg(id, cls) {
          return (
            '<svg class="' +
            (cls || 'donem-sembol') +
            '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            DONEMLER[id].svg +
            '</svg>'
          );
        }

        var secili = 9; // Hollanda Altın Çağı (kullanıcının güncel açık salonu)
        var donemSeridi = document.getElementById('donem-seridi');
        var kemerSerit = document.getElementById('kemer-serit');
        var odakBilgi = document.getElementById('odak-bilgi');
        var oncekiBtn = document.getElementById('onceki-btn');
        var sonrakiBtn = document.getElementById('sonraki-btn');
        var oncekiAd = document.getElementById('onceki-ad');
        var sonrakiAd = document.getElementById('sonraki-ad');
        var gezinmeOrta = document.getElementById('gezinme-orta');
        var dizinGovde = document.getElementById('dizin-govde');

        /* Dönem atlama şeridini oluştur */
        DONEM_SIRA.forEach(function (id) {
          var akimlar = AKIMLAR.filter(function (a) {
            return a.donem === id;
          });
          var hepsiKilit = akimlar.every(function (a) {
            return !a.acik;
          });
          var ilkIdx = AKIMLAR.findIndex(function (a) {
            return a.donem === id;
          });
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'donem-sekme' + (hepsiKilit ? ' kilitli' : '');
          btn.setAttribute('role', 'tab');
          btn.dataset.donem = id;
          btn.innerHTML = sembolSvg(id) + '<span>' + DONEMLER[id].kisa + '</span>';
          btn.addEventListener('click', function () {
            sec(ilkIdx, true);
          });
          donemSeridi.appendChild(btn);
        });

        /* 28 kemerli salon kartını oluştur */
        AKIMLAR.forEach(function (a, i) {
          var d = DONEMLER[a.donem];
          var el = document.createElement('article');
          el.className = 'kemer-oge' + (a.acik ? '' : ' kilitli');
          el.dataset.idx = String(i);
          el.innerHTML =
            '<div class="kemer-kutu">' +
            '<img src="' +
            d.gorsel +
            '" style="object-position:' +
            a.poz +
            '" alt="' +
            a.ad +
            '" />' +
            '<span class="kemer-sembol-rozet">' +
            sembolSvg(a.donem, '') +
            '</span>' +
            (a.acik
              ? ''
              : '<span class="kemer-kilit-halka"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Konu ' +
                bulunma(a.konu) +
                ' açılır</span></span>') +
            '<span class="kemer-alt-etiket"><span>' +
            d.kisa +
            '</span><span>' +
            a.yillar +
            '</span></span>' +
            '</div>';
          el.addEventListener('click', function () {
            sec(i, true);
          });
          kemerSerit.appendChild(el);
        });

        /* Bütün akımlar dizinini dönem gruplarıyla oluştur */
        DONEM_SIRA.forEach(function (id) {
          var d = DONEMLER[id];
          var grup = AKIMLAR.map(function (a, i) {
            return { a: a, i: i };
          }).filter(function (x) {
            return x.a.donem === id;
          });
          var acikAdet = grup.filter(function (x) {
            return x.a.acik;
          }).length;
          var secEl = document.createElement('div');
          secEl.className = 'donem-grup';
          secEl.innerHTML =
            '<div class="donem-grup-bas"><span class="donem-grup-sol">' +
            sembolSvg(id) +
            '<b>' +
            d.ad +
            '</b></span><span class="donem-grup-sag">' +
            (acikAdet ? acikAdet + ' açık salon' : 'Konu ' + bulunma(grup[0].a.konu) + ' açılır') +
            '</span></div>';
          var ul = document.createElement('ul');
          ul.className = 'gruplu-liste';
          grup.forEach(function (x) {
            var a = x.a;
            var li = document.createElement('li');
            var durumYazi = a.acik
              ? a.acikS === a.toplam
                ? a.toplam + ' sanatçının hepsi açık'
                : a.acikS + ' / ' + a.toplam + ' sanatçı açık'
              : 'Konu ' + bulunma(a.konu) + ' açılır';
            li.innerHTML =
              '<button type="button" class="dizin-satir' +
              (a.acik ? '' : ' kilitli') +
              '" data-dizin-idx="' +
              x.i +
              '">' +
              '<span class="dizin-pul"><img src="' +
              d.gorsel +
              '" style="object-position:' +
              a.poz +
              '" alt="" /></span>' +
              '<span class="dizin-orta"><b>' +
              a.ad +
              '</b><small>' +
              a.yillar +
              ' · ' +
              durumYazi +
              '</small></span>' +
              '<span class="dizin-sag' +
              (a.acik ? ' acik' : '') +
              '">' +
              (a.acik
                ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'
                : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>') +
              '</span></button>';
            li.querySelector('button').addEventListener('click', function () {
              sec(x.i, true);
              document.getElementById('kaydir').scrollTo({ top: 0, behavior: 'smooth' });
            });
            ul.appendChild(li);
          });
          secEl.appendChild(ul);
          dizinGovde.appendChild(secEl);
        });

        function sec(idx, kaydir) {
          secili = Math.max(0, Math.min(AKIMLAR.length - 1, idx));
          var a = AKIMLAR[secili];
          var d = DONEMLER[a.donem];

          /* Arka plan halesi ve gerçek dönem desen karosu canlı güncellenir */
          root.setAttribute('data-donem', a.donem);
          root.style.setProperty('--hale-1-rgb', d.hale1);
          root.style.setProperty('--hale-2-rgb', d.hale2);
          root.style.setProperty('--desen-url', "url('../../NoraSanat/Ekranlar/Galeri/Desenler/desen-" + a.donem + "@3x.png')");

          /* Dönem şeridi */
          donemSeridi.querySelectorAll('.donem-sekme').forEach(function (b) {
            var aktif = b.dataset.donem === a.donem;
            b.setAttribute('aria-selected', String(aktif));
            if (aktif && kaydir) {
              donemSeridi.scrollTo({ left: Math.max(0, b.offsetLeft - 24), behavior: 'smooth' });
            }
          });

          /* Kemerli kartlar */
          var ogeler = kemerSerit.querySelectorAll('.kemer-oge');
          ogeler.forEach(function (el, i) {
            el.classList.toggle('secili', i === secili);
          });
          if (kaydir) {
            var hedef = ogeler[secili];
            if (hedef) kemerSerit.scrollTo({ left: hedef.offsetLeft - 81, behavior: 'smooth' });
          }

          /* Odak metni ve tek dolu düğme */
          var durum = a.acik
            ? a.acikS === a.toplam
              ? a.toplam + ' sanatçının hepsi açık'
              : a.acikS + ' / ' + a.toplam + ' sanatçı açık'
            : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Konu ' +
              bulunma(a.konu) +
              ' açılır · ' +
              a.toplam +
              ' sanatçı';

          odakBilgi.innerHTML =
            '<span class="odak-ust">' +
            sembolSvg(a.donem) +
            '<span>' +
            d.ad +
            ' · ' +
            a.yillar +
            '</span></span>' +
            '<h3 class="odak-ad">' +
            a.ad +
            '</h3>' +
            '<p class="odak-durum">' +
            durum +
            '</p>' +
            '<p class="odak-eser">' +
            d.eser +
            '</p>' +
            (a.acik
              ? '<a class="salona-gir" href="#salon">Salona gir<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></a>'
              : '<span class="kilit-eylem">Konu ' + bulunma(a.konu) + ' gelince açılır</span>');

          /* Alt gezinti okları */
          oncekiBtn.disabled = secili === 0;
          sonrakiBtn.disabled = secili === AKIMLAR.length - 1;
          oncekiAd.textContent = secili > 0 ? AKIMLAR[secili - 1].ad.split(' ')[0] : 'Baştasın';
          sonrakiAd.textContent = secili < AKIMLAR.length - 1 ? AKIMLAR[secili + 1].ad.split(' ')[0] : 'Sondasın';
          gezinmeOrta.textContent = d.kisa;

          /* Dizin vurgusu */
          dizinGovde.querySelectorAll('.dizin-satir').forEach(function (s) {
            s.classList.toggle('secili', Number(s.dataset.dizinIdx) === secili);
          });
        }

        oncekiBtn.addEventListener('click', function () {
          sec(secili - 1, true);
        });
        sonrakiBtn.addEventListener('click', function () {
          sec(secili + 1, true);
        });

        /* Yatay şerit elle kaydırılınca en yakın kartı seç */
        var kaymaZaman = 0;
        kemerSerit.addEventListener(
          'scroll',
          function () {
            clearTimeout(kaymaZaman);
            kaymaZaman = setTimeout(function () {
              var orta = kemerSerit.scrollLeft + kemerSerit.clientWidth / 2;
              var enYakin = secili;
              var enAz = 99999;
              kemerSerit.querySelectorAll('.kemer-oge').forEach(function (el, i) {
                var fark = Math.abs(el.offsetLeft + el.offsetWidth / 2 - orta);
                if (fark < enAz) {
                  enAz = fark;
                  enYakin = i;
                }
              });
              if (enYakin !== secili) sec(enYakin, false);
            }, 90);
          },
          { passive: true }
        );

        /* Dizin aç/kapa */
        var dizinBtn = document.getElementById('dizin-btn');
        var dizinBtnYazi = document.getElementById('dizin-btn-yazi');
        dizinBtn.addEventListener('click', function () {
          var acik = dizinBtn.getAttribute('aria-expanded') === 'true';
          dizinBtn.setAttribute('aria-expanded', String(!acik));
          dizinGovde.hidden = acik;
          dizinBtnYazi.textContent = acik ? 'Göster' : 'Gizle';
        });

        /* İlk konumlandırma */
        sec(secili, false);
        var ilkHedef = kemerSerit.querySelectorAll('.kemer-oge')[secili];
        if (ilkHedef) kemerSerit.scrollLeft = ilkHedef.offsetLeft - 81;
      })();
    </script>
  </body>
</html>
