<!doctype html>
<html lang="tr" data-tema="gece" data-donem="barok">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galeri · Akımlar · Yön 2 — Yedi yüzyıl duvarı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Archivo:wght@400;500;600;700&display=swap"
    />
    <style>
      @font-face {
        font-family: 'Bodoni Moda';
        src: url('../../NoraSanat/YaziTipleri/BodoniModa.ttf') format('truetype');
        font-weight: 400 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader.ttf') format('truetype');
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader-Italic.ttf') format('truetype');
        font-weight: 200 800;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Archivo';
        src: url('../../NoraSanat/YaziTipleri/Archivo.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      :root,
      :root[data-tema='gece'] {
        --bg: #121110;
        --bg-rgb: 18, 17, 16;
        --surface: #1c1a18;
        --surface-cam: rgba(28, 26, 24, 0.80);
        --border: #2e2b28;
        --border-ince: rgba(235, 229, 218, 0.11);
        --ink: #ebe5da;
        --ink-rgb: 235, 229, 218;
        --ink-2: #aca498;
        --ink-3: #8a8379;
        --ink-soluk: #645e57;
        --pirinc: #c9a45c;
        --pirinc-rgb: 201, 164, 92;
        --right: #6fb487;
        --tab-bg: rgba(24, 22, 20, 0.86);
        --overlay-btn: rgba(18, 17, 16, 0.64);
        --doku: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.04;
        --hale-karisim: normal;
        --hale-1-op: 0.34;
        --hale-2-op: 0.24;
        --kart-golge: 0 20px 44px rgba(0, 0, 0, 0.42);
        --sekme-golge: 0 10px 30px rgba(0, 0, 0, 0.45);
        --sayfa-zemin: #0c0b0a;
        color-scheme: dark;
      }

      :root[data-tema='gunduz'] {
        --bg: #ece8e1;
        --bg-rgb: 236, 232, 225;
        --surface: #f7f5f1;
        --surface-cam: rgba(247, 245, 241, 0.88);
        --border: #d6d0c6;
        --border-ince: rgba(31, 27, 23, 0.10);
        --ink: #1f1b17;
        --ink-rgb: 31, 27, 23;
        --ink-2: #4c463f;
        --ink-3: #5f5850;
        --ink-soluk: #8e867c;
        --pirinc: #8a651c;
        --pirinc-rgb: 138, 101, 28;
        --right: #2a6644;
        --tab-bg: rgba(247, 245, 241, 0.90);
        --overlay-btn: rgba(247, 245, 241, 0.85);
        --doku: radial-gradient(rgba(31, 27, 23, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.045;
        --hale-karisim: multiply;
        --hale-1-op: 0.20;
        --hale-2-op: 0.14;
        --kart-golge: 0 14px 32px rgba(20, 17, 14, 0.11);
        --sekme-golge: 0 10px 28px rgba(20, 17, 14, 0.14);
        --sayfa-zemin: #e2ddd4;
        color-scheme: light;
      }

      :root {
        --serif: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
        --sans: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --okuma: 'Newsreader', 'Iowan Old Style', Georgia, serif;
        --hale-1-rgb: 44, 78, 128;
        --hale-2-rgb: 196, 152, 74;
        --desen-url: url('../../NoraSanat/Ekranlar/Galeri/Desenler/desen-barok@3x.png');
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--sayfa-zemin);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      .onizleme-ust {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 28px;
        background: var(--tab-bg);
        border-bottom: 1px solid var(--border);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
      }
      .onizleme-baslik {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .onizleme-baslik .ust-not {
        font: 600 13px/1.3 var(--sans);
        color: var(--pirinc);
      }
      .onizleme-baslik h1 {
        margin: 0;
        font: 500 23px/1.15 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .tema-kabi {
        display: inline-flex;
        padding: 4px;
        gap: 2px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
      }
      .tema-kabi button {
        min-height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        font: 600 13px/1 var(--sans);
        cursor: pointer;
      }
      .tema-kabi button[aria-pressed='true'] {
        background: rgba(var(--ink-rgb), 0.14);
        color: var(--ink);
      }

      .sahne {
        display: flex;
        justify-content: center;
        padding: 36px 20px 64px;
      }

      .telefon {
        position: relative;
        width: 390px;
        height: 844px;
        border-radius: 44px;
        overflow: hidden;
        background-color: var(--bg);
        border: 1px solid var(--border);
        box-shadow: 0 32px 84px rgba(0, 0, 0, 0.44);
        isolation: isolate;
      }

      .zemin-doku {
        position: absolute;
        inset: 0;
        z-index: 0;
        background-image: var(--doku);
        background-size: 3px 3px;
        pointer-events: none;
      }
      .zemin-hale {
        position: absolute;
        inset: 0;
        z-index: 1;
        mix-blend-mode: var(--hale-karisim);
        background:
          radial-gradient(125% 48% at 0% 0%, rgba(var(--hale-1-rgb), var(--hale-1-op)) 0%, rgba(var(--hale-1-rgb), 0.08) 48%, transparent 84%),
          radial-gradient(96% 40% at 100% 100%, rgba(var(--hale-2-rgb), var(--hale-2-op)) 0%, rgba(var(--hale-2-rgb), 0.05) 44%, transparent 80%);
        pointer-events: none;
      }
      .zemin-desen {
        position: absolute;
        inset: 0;
        z-index: 2;
        background-color: var(--ink);
        opacity: var(--desen-opaklik);
        -webkit-mask-image: var(--desen-url);
        mask-image: var(--desen-url);
        -webkit-mask-size: 96px 96px;
        mask-size: 96px 96px;
        -webkit-mask-repeat: repeat;
        mask-repeat: repeat;
        pointer-events: none;
      }

      .telefon-kaydir {
        position: relative;
        z-index: 3;
        height: 100%;
        overflow-y: auto;
        overflow-x: clip;
        scrollbar-width: none;
      }
      .telefon-kaydir::-webkit-scrollbar {
        display: none;
      }

      .durum-cubugu {
        position: sticky;
        top: 0;
        z-index: 16;
        height: 46px;
        padding: 14px 26px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font: 600 14px/1 var(--sans);
        color: var(--ink);
        pointer-events: none;
      }
      .durum-simgeler {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .ekran-ic {
        padding: 4px 20px 116px;
      }

      /* Üst başlık + arama + kalp + 4 bölüm sekmesi */
      .galeri-ust-satir {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
      }
      .galeri-ust-satir h2 {
        margin: 0;
        font: 400 32px/1 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
        flex: none;
      }
      .arama-hapi {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 0 13px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        -webkit-backdrop-filter: blur(22px) saturate(1.5);
        backdrop-filter: blur(22px) saturate(1.5);
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: var(--ink-2);
        font: 400 14px/1 var(--sans);
      }
      .arama-hapi span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kalp-btn {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        color: var(--pirinc);
        text-decoration: none;
      }

      .bolumler {
        margin-top: 12px;
        padding: 4px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        -webkit-backdrop-filter: blur(22px) saturate(1.5);
        backdrop-filter: blur(22px) saturate(1.5);
        display: grid;
        grid-template-columns: 1fr 1.24fr 1fr 0.92fr;
        gap: 2px;
      }
      .bolumler button {
        min-height: 44px;
        padding: 0 6px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        font: 500 13.5px/1 var(--sans);
        cursor: pointer;
        white-space: nowrap;
      }
      .bolumler button[aria-current='page'] {
        background: rgba(var(--ink-rgb), 0.14);
        color: var(--ink);
        font-weight: 600;
      }

      .ust-yazi {
        font: 600 13px/1.3 var(--sans);
        color: var(--pirinc);
      }

      /* =====================================================================
         1. ŞİMDİ BURADASIN — SEÇİLİ SALON SAHNESİ (Çark yok, tam net odak)
         ===================================================================== */
      .simdi-kart {
        margin-top: 18px;
        border-radius: 28px;
        background: var(--surface);
        border: 1px solid var(--border);
        overflow: hidden;
        box-shadow: var(--kart-golge);
      }
      .simdi-kapak {
        position: relative;
        height: 236px;
        overflow: hidden;
        background: #171513;
      }
      .simdi-kapak img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: filter 300ms ease;
      }
      .simdi-kart.kilitli .simdi-kapak img {
        filter: saturate(0.35) sepia(0.24) brightness(0.68) blur(1.2px);
      }
      .simdi-kapak::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(18, 17, 16, 0.34) 0%, rgba(18, 17, 16, 0) 34%, rgba(18, 17, 16, 0.78) 100%);
        pointer-events: none;
      }
      .simdi-kapak-ust {
        position: absolute;
        top: 14px;
        left: 16px;
        right: 16px;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .cam-etiket {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 11px;
        border-radius: 999px;
        background: rgba(18, 17, 16, 0.54);
        border: 1px solid rgba(244, 240, 232, 0.22);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        font: 600 12px/1 var(--sans);
        color: #f2ece2;
      }
      .cam-etiket svg {
        color: #ebd295;
      }
      .simdi-kapak-alt {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 14px;
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .simdi-kapak-alt .yillar {
        font: 600 12.5px/1.2 var(--sans);
        color: #ecd08f;
      }
      .simdi-kapak-alt h3 {
        margin: 0;
        font: 500 32px/1.05 var(--serif);
        letter-spacing: -0.01em;
        color: #f4f0e8;
      }

      .simdi-govde {
        padding: 16px 18px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .simdi-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .simdi-meta-sol {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .simdi-meta-sol b {
        font: 600 14.5px/1.25 var(--sans);
        color: var(--ink);
      }
      .simdi-meta-sol span {
        font: italic 400 13px/1.3 var(--okuma);
        color: var(--ink-2);
      }

      /* EKRANDAKİ TEK DOLU DÜĞME */
      .salona-gir {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        min-height: 50px;
        padding: 0 18px 0 22px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--bg);
        font: 600 15px/1 var(--sans);
        text-decoration: none;
        cursor: pointer;
      }
      .kilit-eylem {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 48px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
        color: var(--ink-2);
        font: 500 14px/1 var(--sans);
      }

      .siradaki-serit {
        border-top: 1px solid var(--border-ince);
        padding: 12px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font: 400 13px/1.3 var(--sans);
        color: var(--ink-2);
        background: rgba(var(--ink-rgb), 0.025);
        cursor: pointer;
        border-left: 0;
        border-right: 0;
        border-bottom: 0;
        width: 100%;
        text-align: left;
      }
      .siradaki-serit b {
        color: var(--pirinc);
        font-weight: 600;
      }

      /* =====================================================================
         2. YAPIŞKAN HIZLI DÖNEM CETVELİ (9 dönem arası tek dokunuşla atla/süz)
         ===================================================================== */
      .donem-cetveli {
        margin: 26px -20px 0;
        padding: 0 20px;
        display: flex;
        gap: 16px;
        overflow-x: auto;
        overflow-y: hidden;
        border-bottom: 1px solid var(--border);
        scrollbar-width: none;
      }
      .donem-cetveli::-webkit-scrollbar {
        display: none;
      }
      .donem-cetveli button {
        flex: none;
        position: relative;
        min-height: 44px;
        padding: 0 2px;
        border: 0;
        background: transparent;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--ink-2);
        font: 500 13.5px/1 var(--sans);
        cursor: pointer;
        white-space: nowrap;
      }
      .donem-cetveli button[aria-selected='true'] {
        color: var(--ink);
        font-weight: 600;
      }
      .donem-cetveli button[aria-selected='true']::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        border-radius: 2px;
        background: var(--pirinc);
      }

      /* =====================================================================
         3. DİKEY MÜZE DUVARI — 9 DÖNEM GRUBU, 28 AKIM (Sıfır çark çakışması!)
         ===================================================================== */
      .duvar-bolum {
        margin-top: 28px;
      }
      .donem-blok + .donem-blok {
        margin-top: 34px;
      }
      .donem-blok-bas {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .donem-blok-sol {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .donem-muhur {
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        color: var(--pirinc);
      }
      .donem-blok.kilitli .donem-muhur {
        color: var(--ink-3);
      }
      .donem-blok-bas h4 {
        margin: 0;
        font: 500 24px/1.1 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .donem-blok-bas small {
        display: block;
        margin-top: 2px;
        font: 400 12.5px/1.2 var(--sans);
        color: var(--ink-2);
      }
      .donem-durum {
        font: 600 12px/1.2 var(--sans);
        color: var(--pirinc);
        white-space: nowrap;
      }
      .donem-blok.kilitli .donem-durum {
        color: var(--ink-3);
        font-weight: 500;
      }

      .salon-izgara {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px 12px;
      }
      .salon-kart {
        border: 0;
        padding: 0;
        background: transparent;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 8px;
        cursor: pointer;
        color: var(--ink);
      }
      .salon-kart-resim {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3.4;
        border-radius: 16px;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .salon-kart.secili .salon-kart-resim {
        border-color: var(--pirinc);
        box-shadow: 0 0 0 2px rgba(var(--pirinc-rgb), 0.28);
      }
      .salon-kart-resim img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Kilitli kartlar: sıcak buğulu renkli pencere (soğuk gri değil, merak uyandırıcı) */
      .salon-kart.kilitli .salon-kart-resim img {
        filter: saturate(0.38) sepia(0.22) brightness(0.66) blur(1.6px);
        transform: scale(1.06);
      }
      .kilit-fisilti {
        position: absolute;
        inset: auto 8px 8px;
        padding: 5px 8px;
        border-radius: 10px;
        background: rgba(18, 17, 16, 0.56);
        border: 1px solid rgba(244, 240, 232, 0.16);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font: 500 11px/1.1 var(--sans);
        color: rgba(244, 240, 232, 0.92);
      }
      .salon-kart-yazi {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .salon-kart-yazi .yil {
        font: 500 11.5px/1.2 var(--sans);
        color: var(--pirinc);
      }
      .salon-kart.kilitli .salon-kart-yazi .yil {
        color: var(--ink-3);
      }
      .salon-kart-yazi b {
        font: 500 17.5px/1.16 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .salon-kart.kilitli .salon-kart-yazi b {
        color: var(--ink-2);
      }
      .salon-kart-yazi small {
        font: 400 12px/1.3 var(--sans);
        color: var(--ink-2);
      }
      .doluluk-ray {
        margin-top: auto;
        padding-top: 5px;
        height: 8px;
        display: flex;
        align-items: flex-end;
      }
      .doluluk-ray i {
        display: block;
        width: 100%;
        height: 3px;
        border-radius: 999px;
        background: rgba(var(--ink-rgb), 0.12);
        position: relative;
        overflow: hidden;
      }
      .doluluk-ray i::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--oran, 0%);
        background: var(--renk, var(--pirinc));
        border-radius: inherit;
      }

      /* Alt kompakt Bütün Akımlar Dizini */
      .dizin-cekmece {
        margin-top: 38px;
        padding-top: 22px;
        border-top: 1px solid var(--border);
      }
      .dizin-ac {
        width: 100%;
        min-height: 48px;
        padding: 0 16px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font: 600 14px/1 var(--sans);
        cursor: pointer;
      }
      .dizin-liste {
        margin: 12px 0 0;
        padding: 0;
        list-style: none;
        border-radius: 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        overflow: hidden;
      }
      .dizin-liste > li + li {
        border-top: 1px solid var(--border-ince);
      }
      .dizin-liste button {
        width: 100%;
        min-height: 52px;
        padding: 10px 16px;
        border: 0;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        text-align: left;
        color: var(--ink);
        cursor: pointer;

            '<div class="simdi-kapak-alt">' +
            '<span class="yillar">' +
            a.yillar +
            '</span>' +
            '<h3>' +
            a.ad +
            '</h3>' +
            '</div></div>' +
            '<div class="simdi-govde">' +
            '<div class="simdi-meta"><div class="simdi-meta-sol"><b>' +
            durum +
            '</b><span>' +
            d.eser +
            '</span></div></div>' +
            (a.acik
              ? '<a class="salona-gir" href="#salon"><span>Salona gir</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a>'
              : '<span class="kilit-eylem"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Konu ' +
                bulunma(a.konu) +
                ' gelince açılır</span>') +
            '</div>' +
            '<button type="button" class="siradaki-serit" id="siradaki-kilit-btn">' +
            '<span>Sıradaki kilit: <b>Fransız Klasisizmi</b> · Konu 37’de açılır</span>' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m9 6 6 6-6 6"/></svg>' +
            '</button>';

          simdiKart.querySelector('#siradaki-kilit-btn').addEventListener('click', function () {
            secili = 10;
            odakCiz();
            duvarVurgula();
          });
        }

        function duvarVurgula() {
          duvar.querySelectorAll('.salon-kart').forEach(function (k) {
            k.classList.toggle('secili', Number(k.dataset.idx) === secili);
          });
        }

        /* Hızlı dönem cetveli */
        var hepsiBtn = document.createElement('button');
        hepsiBtn.type = 'button';
        hepsiBtn.setAttribute('role', 'tab');
        hepsiBtn.setAttribute('aria-selected', 'true');
        hepsiBtn.dataset.filtre = 'hepsi';
        hepsiBtn.textContent = 'Tümü (28)';
        hepsiBtn.addEventListener('click', function () {
          filtrele('hepsi');
        });
        cetvel.appendChild(hepsiBtn);

        DONEM_SIRA.forEach(function (id) {
          var b = document.createElement('button');
          b.type = 'button';
          b.setAttribute('role', 'tab');
          b.setAttribute('aria-selected', 'false');
          b.dataset.filtre = id;
          b.innerHTML = sembolSvg(id, 14) + '<span>' + DONEMLER[id].kisa + '</span>';
          b.addEventListener('click', function () {
            filtrele(id);
          });
          cetvel.appendChild(b);
        });

        function filtrele(id) {
          filtre = id;
          cetvel.querySelectorAll('button').forEach(function (b) {
            b.setAttribute('aria-selected', String(b.dataset.filtre === id));
          });
          duvarCiz();
        }

        function duvarCiz() {
          duvar.innerHTML = '';
          var gosterilecek = filtre === 'hepsi' ? DONEM_SIRA : [filtre];
          gosterilecek.forEach(function (id) {
            var d = DONEMLER[id];
            var liste = AKIMLAR.map(function (a, i) {
              return { a: a, i: i };
            }).filter(function (x) {
              return x.a.donem === id;
            });
            var acikSay = liste.filter(function (x) {
              return x.a.acik;
            }).length;

            var blok = document.createElement('div');
            blok.className = 'donem-blok' + (acikSay === 0 ? ' kilitli' : '');
            blok.innerHTML =
              '<div class="donem-blok-bas">' +
              '<div class="donem-blok-sol">' +
              '<span class="donem-muhur">' +
              sembolSvg(id, 18) +
              '</span>' +
              '<div><h4>' +
              d.ad +
              '</h4><small>' +
              d.yy +
              '</small></div></div>' +
              '<span class="donem-durum">' +
              (acikSay ? acikSay + ' / ' + liste.length + ' açık' : 'Konu ' + bulunma(liste[0].a.konu)) +
              '</span></div>';

            var izgara = document.createElement('div');
            izgara.className = 'salon-izgara';

            liste.forEach(function (x) {
              var a = x.a;
              var oran = a.acik ? Math.round((a.acikS / a.toplam) * 100) : 0;
              var renk = a.acikS === a.toplam ? 'var(--right)' : 'var(--pirinc)';
              var durum = a.acik
                ? a.acikS === a.toplam
                  ? a.toplam + ' sanatçının hepsi açık'
                  : a.acikS + ' / ' + a.toplam + ' sanatçı açık'
                : a.toplam + ' sanatçı';

              var kart = document.createElement('button');
              kart.type = 'button';
              kart.className = 'salon-kart' + (a.acik ? '' : ' kilitli') + (x.i === secili ? ' secili' : '');
              kart.dataset.idx = String(x.i);
              var siraIc = liste.indexOf(x);
              var yakin =
                siraIc === 0
                  ? ''
                  : siraIc === 1
                    ? 'transform:scale(1.65);transform-origin:84% 22%;'
                    : siraIc === 2
                      ? 'transform:scale(1.75);transform-origin:18% 42%;'
                      : siraIc === 3
                        ? 'transform:scale(1.55);transform-origin:52% 24%;'
                        : 'transform:scale(1.8);transform-origin:68% 72%;';
              kart.innerHTML =
                '<span class="salon-kart-resim">' +
                '<img src="' +
                d.gorsel +
                '" style="object-position:' +
                a.poz +
                ';' +
                (a.acik ? yakin : '') +
                '" alt="' +
                a.ad +
                '" />' +
                (a.acik
                  ? ''
                  : '<span class="kilit-fisilti"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Konu ' +
                    bulunma(a.konu) +
                    ' açılır</span>') +
                '</span>' +
                '<span class="salon-kart-yazi">' +
                '<span class="yil">' +
                a.yillar +
                '</span>' +
                '<b>' +
                a.ad +
                '</b>' +
                '<small>' +
                durum +
                '</small>' +
                '<span class="doluluk-ray" aria-hidden="true"><i style="--oran:' +
                oran +
                '%;--renk:' +
                renk +
                '"></i></span>' +
                '</span>';

              kart.addEventListener('click', function () {
                secili = x.i;
                odakCiz();
                duvarVurgula();
                document.getElementById('kaydir').scrollTo({ top: 0, behavior: 'smooth' });
              });
              izgara.appendChild(kart);
            });

            blok.appendChild(izgara);
            duvar.appendChild(blok);
          });
        }

        /* Hızlı metin dizini (28 akım) */
        AKIMLAR.forEach(function (a, i) {
          var li = document.createElement('li');
          var durum = a.acik
            ? a.acikS + ' / ' + a.toplam + ' sanatçı açık'
            : 'Konu ' + bulunma(a.konu) + ' açılır';
          li.innerHTML =
            '<button type="button"><span><b>' +
            a.ad +
            '</b><small>' +
            DONEMLER[a.donem].ad +
            ' · ' +
            a.yillar +
            ' · ' +
            durum +
            '</small></span>' +
            (a.acik
              ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="color:var(--pirinc)"><path d="m9 6 6 6-6 6"/></svg>'
              : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="color:var(--ink-3)"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>') +
            '</button>';
          li.querySelector('button').addEventListener('click', function () {
            secili = i;
            odakCiz();
            duvarVurgula();
            document.getElementById('kaydir').scrollTo({ top: 0, behavior: 'smooth' });
          });
          dizinListe.appendChild(li);
        });

        var dizinAc = document.getElementById('dizin-ac');
        dizinAc.addEventListener('click', function () {
          var ac = dizinAc.getAttribute('aria-expanded') === 'true';
          dizinAc.setAttribute('aria-expanded', String(!ac));
          dizinListe.hidden = ac;
        });

        odakCiz();
        duvarCiz();
      })();
    </script>
  </body>
</html>
