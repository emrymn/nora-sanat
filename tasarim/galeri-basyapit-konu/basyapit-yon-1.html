<!doctype html>
<html lang="tr" data-tema="gece">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galeri · Başyapıtlar · Yön 1 — Sakin vitrin</title>
    <style>
      @font-face {
        font-family: 'Bodoni Moda';
        src: url('../../NoraSanat/YaziTipleri/BodoniModa.ttf') format('truetype');
        font-weight: 400 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Bodoni Moda';
        src: url('../../NoraSanat/YaziTipleri/BodoniModa-Italic.ttf') format('truetype');
        font-weight: 400 900;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader.ttf') format('truetype');
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../NoraSanat/YaziTipleri/Newsreader-Italic.ttf') format('truetype');
        font-weight: 200 800;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Archivo';
        src: url('../../NoraSanat/YaziTipleri/Archivo.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      :root,
      :root[data-tema='gece'] {
        --bg: #121110;
        --bg-rgb: 18, 17, 16;
        --surface: #1c1a18;
        --surface-2: #24211e;
        --border: #2e2b28;
        --border-ince: rgba(235, 229, 218, 0.10);
        --ink: #ebe5da;
        --ink-rgb: 235, 229, 218;
        --ink-2: #aca498;
        --ink-3: #8a8379;
        --pirinc: #c9a45c;
        --pirinc-rgb: 201, 164, 92;
        --pirinc-yazi: #121110;
        --right: #6fb487;
        --right-rgb: 111, 180, 135;
        --tab-bg: rgba(24, 22, 20, 0.84);
        --overlay-btn: rgba(20, 18, 16, 0.64);
        --doku: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.04;
        --hale-karisim: normal;
        --hale-1: rgba(146, 102, 58, 0.30);
        --hale-1-orta: rgba(146, 102, 58, 0.09);
        --hale-2: rgba(94, 72, 52, 0.22);
        --hale-2-orta: rgba(94, 72, 52, 0.06);
        --sayfa-zemin: #0c0b0a;
        --kart-golge: 0 22px 44px rgba(0, 0, 0, 0.42);
        --sekme-golge: 0 10px 30px rgba(0, 0, 0, 0.45);
        color-scheme: dark;
      }

      :root[data-tema='gunduz'] {
        --bg: #ece8e1;
        --bg-rgb: 236, 232, 225;
        --surface: #f7f5f1;
        --surface-2: #efebe3;
        --border: #d6d0c6;
        --border-ince: rgba(31, 27, 23, 0.09);
        --ink: #1f1b17;
        --ink-rgb: 31, 27, 23;
        --ink-2: #4c463f;
        --ink-3: #5f5850;
        --pirinc: #8a651c;
        --pirinc-rgb: 138, 101, 28;
        --pirinc-yazi: #f7f5f1;
        --right: #2a6644;
        --right-rgb: 42, 102, 68;
        --tab-bg: rgba(247, 245, 241, 0.88);
        --overlay-btn: rgba(247, 245, 241, 0.84);
        --doku: radial-gradient(rgba(31, 27, 23, 0.035) 1px, transparent 1px);
        --desen-opaklik: 0.045;
        --hale-karisim: multiply;
        --hale-1: rgba(164, 114, 62, 0.17);
        --hale-1-orta: rgba(164, 114, 62, 0.05);
        --hale-2: rgba(112, 86, 58, 0.13);
        --hale-2-orta: rgba(112, 86, 58, 0.04);
        --sayfa-zemin: #e2ddd4;
        --kart-golge: 0 16px 34px rgba(20, 17, 14, 0.13);
        --sekme-golge: 0 10px 28px rgba(20, 17, 14, 0.14);
        color-scheme: light;
      }

      :root {
        --serif: 'Bodoni Moda', Georgia, serif;
        --sans: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
        --okuma: 'Newsreader', Georgia, serif;
        --yan: 20px;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--sayfa-zemin);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      /* Önizleme üst çubuğu */
      .onizleme-ust {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 24px;
        background: var(--tab-bg);
        border-bottom: 1px solid var(--border);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
      }
      .onizleme-baslik .ust-not {
        display: block;
        font: 600 12.5px/1.3 var(--sans);
        color: var(--pirinc);
      }
      .onizleme-baslik h1 {
        margin: 2px 0 0;
        font: 500 22px/1.15 var(--serif);
        letter-spacing: -0.01em;
      }
      .tema-kabi {
        display: inline-flex;
        padding: 4px;
        gap: 2px;
        border-radius: 999px;
        background: var(--overlay-btn);
        border: 1px solid var(--border);
      }
      .tema-kabi button {
        min-height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        font: 600 13px/1 var(--sans);
        cursor: pointer;
      }
      .tema-kabi button[aria-pressed='true'] {
        background: var(--ink);
        color: var(--bg);
      }

      .sahne {
        display: flex;
        justify-content: center;
        padding: 32px 16px 56px;
      }

      /* 390×844 Telefon çerçevesi */
      .telefon {
        position: relative;
        width: 390px;
        height: 844px;
        border-radius: 44px;
        overflow: hidden;
        background: var(--bg);
        border: 1px solid var(--border);
        box-shadow: 0 32px 84px rgba(0, 0, 0, 0.44);
        isolation: isolate;
      }

      /* Dışa aktarım kipi (?tek=1) */
      :root[data-tek='1'] body { background: var(--bg); }
      :root[data-tek='1'] .onizleme-ust { display: none; }
      :root[data-tek='1'] .sahne { padding: 0; justify-content: flex-start; }
      :root[data-tek='1'] .telefon {
        height: auto;
        min-height: 844px;
        border-radius: 0;
        border: 0;
        box-shadow: none;
        overflow: visible;
      }
      :root[data-tek='1'] .telefon-kaydir {
        height: auto;
        overflow: visible;
      }
      :root[data-tek='1'] .alt-cubuk {
        position: sticky;
        bottom: 12px;
      }

      /* 3 katmanlı zemin */
      .zemin-doku {
        position: absolute;
        inset: 0;
        z-index: 0;
        background-image: var(--doku);
        background-size: 3px 3px;
        pointer-events: none;
      }
      .zemin-hale {
        position: absolute;
        inset: 0;
        z-index: 1;
        mix-blend-mode: var(--hale-karisim);
        background:
          radial-gradient(120% 42% at 0% 0%, var(--hale-1) 0%, var(--hale-1-orta) 48%, transparent 82%),
          radial-gradient(90% 38% at 100% 100%, var(--hale-2) 0%, var(--hale-2-orta) 44%, transparent 80%);
        pointer-events: none;
        transition: opacity 400ms ease;
      }
      .zemin-desen {
        position: absolute;
        inset: 0;
        z-index: 2;
        background-color: var(--ink);
        opacity: var(--desen-opaklik);
        -webkit-mask-image: url('../../NoraSanat/Ekranlar/Galeri/Desenler/desen-barok@3x.png');
        mask-image: url('../../NoraSanat/Ekranlar/Galeri/Desenler/desen-barok@3x.png');
        -webkit-mask-size: 96px 96px;
        mask-size: 96px 96px;
        -webkit-mask-repeat: repeat;
        mask-repeat: repeat;
        pointer-events: none;
      }

      .telefon-kaydir {
        position: relative;
        z-index: 3;
        height: 100%;
        overflow-y: auto;
        overflow-x: clip;
        scrollbar-width: none;
      }
      .telefon-kaydir::-webkit-scrollbar { display: none; }

      /* Durum çubuğu */
      .durum-cubugu {
        height: 44px;
        padding: 12px 24px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font: 600 14px/1 var(--sans);
        color: var(--ink);
      }
      .durum-simgeler { display: flex; align-items: center; gap: 6px; }

      /* Galeri üstü */
      .galeri-ust {
        padding: 8px var(--yan) 6px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .ust-satir {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 48px;
      }
      .galeri-baslik {
        margin: 0;
        font: 500 32px/1 var(--serif);
        letter-spacing: -0.015em;
        color: var(--ink);
        flex: none;
      }
      .arama-hapi {
        flex: 1;
        min-width: 0;
        height: 46px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--overlay-btn);
        -webkit-backdrop-filter: blur(20px) saturate(1.5);
        backdrop-filter: blur(20px) saturate(1.5);
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-2);
        font: 400 14.5px/1 var(--sans);
        cursor: pointer;
        text-align: left;
      }
      .arama-hapi span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .kalp-dugme {
        width: 46px;
        height: 46px;
        flex: none;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--overlay-btn);
        -webkit-backdrop-filter: blur(20px) saturate(1.5);
        backdrop-filter: blur(20px) saturate(1.5);
        display: grid;
        place-items: center;
        color: var(--pirinc);
        cursor: pointer;
      }

      /* 4 bölüm sekmesi */
      .bolum-kabi {
        display: grid;
        grid-template-columns: 1fr 1.24fr 1fr 0.9fr;
        gap: 2px;
        padding: 4px;
        height: 52px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--overlay-btn);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
      }
      .bolum-sekme {
        height: 44px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        font: 500 13.5px/1 var(--sans);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
      }
      .bolum-sekme[aria-current='page'] {
        background: var(--ink);
        color: var(--bg);
        font-weight: 600;
      }

      /* Yapışkan dönem sekmeleri (TASARIM_DILI: 2px pirinç alt çizgi) */
      .donem-seridi {
        position: sticky;
        top: 0;
        z-index: 12;
        display: flex;
        gap: 18px;
        overflow-x: auto;
        padding: 4px var(--yan) 0;
        background: rgba(var(--bg-rgb), 0.84);
        -webkit-backdrop-filter: blur(20px) saturate(1.4);
        backdrop-filter: blur(20px) saturate(1.4);
        border-bottom: 1px solid var(--border-ince);
        scrollbar-width: none;
      }
      .donem-seridi::-webkit-scrollbar { display: none; }
      .donem-sekme {
        position: relative;
        flex: none;
        height: 44px;
        padding: 0 2px;
        border: 0;
        background: transparent;
        color: var(--ink-2);
        font: 500 14.5px/1 var(--sans);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      .donem-sekme small {
        font: 400 12.5px/1 var(--sans);
        color: var(--ink-3);
      }
      .donem-sekme[aria-pressed='true'] {
        color: var(--ink);
        font-weight: 600;
      }
      .donem-sekme[aria-pressed='true']::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: var(--pirinc);
        border-radius: 2px;
      }

      .icerik {
        padding: 16px var(--yan) 112px;
      }

      /* 1. SIRADAKİ OKUMA — ÖNE ÇIKAN KART */
      .sahne-karti {
        position: relative;
        border-radius: 26px;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border-ince);
        box-shadow: var(--kart-golge);
      }
      .sahne-resim-kutu {
        position: relative;
        height: 286px;
        overflow: hidden;
        background: #171513;
      }
      .sahne-resim-kutu img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 42%;
        display: block;
      }
      .sahne-resim-kutu::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(16, 15, 14, 0.34) 0%,
          rgba(16, 15, 14, 0) 28%,
          rgba(16, 15, 14, 0.15) 56%,
          rgba(16, 15, 14, 0.84) 100%
        );
        pointer-events: none;
      }
      .sahne-ust-rozetler {
        position: absolute;
        top: 14px;
        left: 14px;
        right: 14px;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .rozet-grup {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .cam-rozet {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: rgba(18, 17, 16, 0.72);
        border: 1px solid rgba(243, 238, 228, 0.16);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        color: #f3eee4;
        font: 500 12px/1 var(--sans);
      }
      .cam-rozet.hikaye { color: #f3eee4; }
      .cam-rozet.hikaye svg { color: #e2be76; }
      .cam-rozet.sure { color: rgba(243, 238, 228, 0.9); }

      .sahne-overlay-yazi {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 14px;
        z-index: 2;
      }
      .sahne-ust-yazi {
        font: 600 13px/1.3 var(--sans);
        color: #e6c681;
      }
      .sahne-baslik {
        margin: 4px 0 3px;
        font: 500 30px/1.08 var(--serif);
        letter-spacing: -0.012em;
        color: #f5f0e6;
      }
      .sahne-kunye {
        font: 400 14px/1.3 var(--sans);
        color: rgba(245, 240, 230, 0.84);
      }

      .sahne-alt {
        padding: 15px 18px 14px;
        background: var(--surface);
      }
      .sahne-fisi {
        margin: 0 0 14px;
        font: 400 16px/1.45 var(--okuma);
        color: var(--ink-2);
      }
      /* Ekrandaki TEK dolu hap düğme */
      .birincil-dugme {
        width: 100%;
        min-height: 48px;
        padding: 0 18px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--bg);
        font: 600 15px/1 var(--sans);
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
      }
      .birincil-dugme small {
        font: 400 13px/1 var(--sans);
        opacity: 0.72;
        margin-left: 8px;
      }
      .birincil-sol { display: flex; align-items: baseline; }

      .sahne-noktalar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 8px;
      }
      .nokta-dizi { display: flex; align-items: center; gap: 2px; }
      .nokta-dugme {
        min-width: 44px;
        height: 44px;
        margin: -8px -10px -8px 0;
        border: 0;
        background: transparent;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .nokta-dugme i {
        display: block;
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: rgba(var(--ink-rgb), 0.28);
        transition: width 220ms ease, background 220ms ease;
      }
      .nokta-dugme[aria-pressed='true'] i {
        width: 22px;
        background: var(--pirinc);
      }
      .sahne-ipucu {
        font: 400 12.5px/1.2 var(--sans);
        color: var(--ink-3);
      }

      /* 2. OKUMA İZLERİN + HIZLI SÜZGEÇ */
      .okuma-iz-karti {
        margin-top: 22px;
        padding: 14px 16px;
        border-radius: 20px;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .iz-ust {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .iz-metin strong {
        display: block;
        font: 600 14.5px/1.25 var(--sans);
        color: var(--ink);
      }
      .iz-metin span {
        font: 400 12.5px/1.3 var(--sans);
        color: var(--ink-2);
      }
      .mini-boncuklar {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .mini-boncuk {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(var(--ink-rgb), 0.14);
      }
      .mini-boncuk.dolu { background: var(--right); }
      .mini-boncuk.aktif {
        background: var(--pirinc);
        box-shadow: 0 0 0 3px rgba(var(--pirinc-rgb), 0.24);
      }
      .hizli-suzgec {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--border-ince);
      }
      .suzgec-hap {
        min-height: 44px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--ink-2);
        font: 500 13px/1 var(--sans);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .suzgec-hap[aria-pressed='true'] {
        background: var(--surface-2);
        border-color: var(--border);
        color: var(--ink);
        font-weight: 600;
      }
      .suzgec-hap .nokta-p {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--pirinc);
      }

      /* 3. DÖNEM BÖLÜMLERİ (Yatay şeritler) */
      .bolum {
        margin-top: 34px;
      }
      .bolum-bas {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .bolum-bas h2 {
        margin: 0;
        font: 500 25px/1.1 var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .bolum-alt {
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
        font: 400 13px/1.2 var(--sans);
        color: var(--ink-2);
      }
      .ince-cizgi {
        width: 44px;
        height: 3px;
        border-radius: 999px;
        background: rgba(var(--ink-rgb), 0.14);
        overflow: hidden;
      }
      .ince-cizgi i {
        display: block;
        height: 100%;
        background: var(--right);
        border-radius: 999px;
      }
      .hepsi-dugme {
        min-height: 44px;
        padding: 0 2px;
        border: 0;
        background: transparent;
        color: var(--ink-2);
        font: 600 13.5px/1 var(--sans);
        display: inline-flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        flex: none;
      }

      /* Yatay kart şeridi */
      .serit {
        display: flex;
        gap: 14px;
        overflow-x: auto;
        margin: 0 calc(var(--yan) * -1);
        padding: 0 var(--yan) 6px;
        scroll-snap-type: x proximity;
        scrollbar-width: none;
      }
      .serit::-webkit-scrollbar { display: none; }

      .eser-karti {
        flex: none;
        width: 168px;
        scroll-snap-align: start;
        border: 0;
        padding: 0;
        background: transparent;
        text-align: left;
        cursor: pointer;
        color: inherit;
      }
      .kart-cerceve {
        position: relative;
        width: 168px;
        height: 198px;
        border-radius: 16px;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border-ince);
      }
      .kart-cerceve img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .okundu-rozet {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: rgba(18, 17, 16, 0.78);
        border: 1px solid rgba(111, 180, 135, 0.55);
        color: #8fd0a2;
        display: grid;
        place-items: center;
      }
      .sirada-rozet {
        position: absolute;
        top: 8px;
        right: 8px;
        padding: 0 8px;
        height: 22px;
        border-radius: 999px;
        background: rgba(18, 17, 16, 0.80);
        border: 1px solid rgba(201, 164, 92, 0.55);
        color: #e6c681;
        font: 600 11px/22px var(--sans);
      }
      .kart-alt-rozet {
        position: absolute;
        left: 8px;
        bottom: 8px;
        display: flex;
        gap: 4px;
      }
      .kucuk-rozet {
        display: inline-flex;

      const ikonAra = '<svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
      const ikonIleri = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>';
      const ikonTik = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';

      function toplamOkunan() {
        const temel = 14 - 7; // gösterilmeyen diğer dönem okunanları
        return temel + ESERLER.filter((e) => e.okundu).length;
      }

      function desenGuncelle(donemId) {
        const d = DONEMLER.find((x) => x.id === donemId) || DONEMLER[2];
        const url = `url('../../NoraSanat/Ekranlar/Galeri/Desenler/desen-${d.desen}@3x.png')`;
        const el = document.getElementById('zemin-desen');
        el.style.webkitMaskImage = url;
        el.style.maskImage = url;
      }

      function sekmeleriCiz() {
        const nav = document.getElementById('donem-seridi');
        const ogeler = [{ id: '', ad: 'Hepsi', toplam: 264 }, ...DONEMLER];
        nav.innerHTML = ogeler
          .map(
            (d) =>
              `<button type="button" class="donem-sekme" data-donem="${d.id}" aria-pressed="${d.id === seciliDonem}">${d.ad}<small>${d.toplam}</small></button>`,
          )
          .join('');
      }

      function suzulenEserler(donemId) {
        return ESERLER.filter((e) => {
          if (donemId && e.donem !== donemId) return false;
          if (hizliSuzgec === 'hikaye' && !e.hikaye) return false;
          if (hizliSuzgec === 'okunmamis' && e.okundu) return false;
          return true;
        });
      }

      function kartHtml(e) {
        return `
          <button type="button" class="eser-karti" data-eser="${e.id}">
            <div class="kart-cerceve">
              <img src="${e.gorsel}" alt="${e.ad}" style="object-position:${e.pos}" />
              ${e.okundu ? `<span class="okundu-rozet" aria-label="Okundu">${ikonTik}</span>` : e.sirada ? `<span class="sirada-rozet">Sırada</span>` : ''}
              <div class="kart-alt-rozet">
                ${e.hikaye ? `<span class="kucuk-rozet hikaye">${ikonKitap}<span>Hikâye</span></span>` : ''}
                <span class="kucuk-rozet">${ikonAra}<span>${e.ayrinti} ayrıntı</span></span>
              </div>
            </div>
            <div class="kart-yazi">
              <div class="kart-ad">${e.ad}</div>
              <div class="kart-meta">${e.sanatci} · <span style="white-space:nowrap">${e.yil} · ~${e.dk} dk</span></div>
              <div class="kart-akim">${e.akim}</div>
            </div>
          </button>`;
      }

      function satirHtml(e) {
        return `
          <button type="button" class="liste-satir" data-eser="${e.id}">
            <div class="liste-thumb"><img src="${e.gorsel}" alt="${e.ad}" style="object-position:${e.pos}" /></div>
            <div class="liste-orta">
              <div class="liste-ad">${e.ad}</div>
              <div class="liste-kunye">${e.sanatci} · ${e.yil} · ${e.akim}</div>
              <div class="liste-etiketler">
                ${e.hikaye ? '<span class="etiket-hikaye">Hikâye</span>' : ''}
                <span>${e.ayrinti} ayrıntı</span>
                <span>~${e.dk} dk</span>
                ${e.okundu ? '<span class="etiket-okundu">Okundu</span>' : e.sirada ? '<span class="etiket-hikaye">Sırada</span>' : ''}
              </div>
            </div>
            <span class="liste-sag">${e.okundu ? `<span style="color:var(--right)">${ikonTik}</span>` : ''}${ikonIleri}</span>
          </button>`;
      }

      function ciz() {
        sekmeleriCiz();
        desenGuncelle(seciliDonem || ESERLER.find((x) => x.id === ONE_CIKAN[slayt]).donem);
        const icerik = document.getElementById('icerik');

        const oneListesi = seciliDonem
          ? ESERLER.filter((e) => e.donem === seciliDonem).slice(0, 3)
          : ONE_CIKAN.map((id) => ESERLER.find((e) => e.id === id));
        if (slayt >= oneListesi.length) slayt = 0;
        const aktif = oneListesi[slayt] || ESERLER[0];

        const sahneHtml = `
          <section class="sahne-karti" aria-label="Sıradaki okuma">
            <div class="sahne-resim-kutu">
              <img src="${aktif.gorsel}" alt="${aktif.ad}" style="object-position:${aktif.pos}" />
              <div class="sahne-ust-rozetler">
                <div class="rozet-grup">
                  ${aktif.hikaye ? `<span class="cam-rozet hikaye">${ikonKitap}<span>Hikâye</span></span>` : ''}
                  <span class="cam-rozet">${ikonAra}<span>${aktif.ayrinti} ayrıntı</span></span>
                </div>
                <span class="cam-rozet sure">~${aktif.dk} dk</span>
              </div>
              <div class="sahne-overlay-yazi">
                <div class="sahne-ust-yazi">${aktif.sirada ? 'Sıradaki okuma' : aktif.okundu ? 'Tekrar oku' : 'Öne çıkan'} · ${aktif.akim}</div>
                <h2 class="sahne-baslik">${aktif.kisaAd || aktif.ad}</h2>
                <div class="sahne-kunye">${aktif.sanatci} · ${aktif.yil}</div>
              </div>
            </div>
            <div class="sahne-alt">
              <p class="sahne-fisi">${aktif.ozet}</p>
              <button type="button" class="birincil-dugme" data-eser="${aktif.id}">
                <span class="birincil-sol">
                  <span>${aktif.okundu ? 'Okumayı tekrar aç' : 'Okumaya başla'}</span>
                  <small>~${aktif.dk} dk · ${aktif.ayrinti} ayrıntı</small>
                </span>
                ${ikonIleri}
              </button>
              ${
                oneListesi.length > 1
                  ? `<div class="sahne-noktalar">
                      <div class="nokta-dizi" role="group" aria-label="Öne çıkan eser seçimi">
                        ${oneListesi
                          .map(
                            (o, i) =>
                              `<button type="button" class="nokta-dugme" data-slayt="${i}" aria-pressed="${i === slayt}" aria-label="${o.ad}"><i></i></button>`,
                          )
                          .join('')}
                      </div>
                      <span class="sahne-ipucu">${aktif.hikaye ? 'Hikâyeli yakın okuma' : 'Rehberli inceleme'}</span>
                    </div>`
                  : ''
              }
            </div>
          </section>`;

        const okunanSayi = toplamOkunan();
        const izHtml = `
          <section class="okuma-iz-karti" aria-label="Okuma izlerin">
            <div class="iz-ust">
              <div class="iz-metin">
                <strong>${okunanSayi} başyapıt okudun</strong>
                <span>264 eser · 4 hikâyeli · 6 dönemden iz</span>
              </div>
              <div class="mini-boncuklar" aria-hidden="true">
                ${DONEMLER.map((d) => `<span class="mini-boncuk ${d.id === 'barok' ? 'aktif' : d.okunan > 0 ? 'dolu' : ''}" title="${d.ad}"></span>`).join('')}
              </div>
            </div>
            <div class="hizli-suzgec" role="group" aria-label="Hızlı süzgeç">
              <button type="button" class="suzgec-hap" data-suzgec="tumu" aria-pressed="${hizliSuzgec === 'tumu'}">Tümü</button>
              <button type="button" class="suzgec-hap" data-suzgec="hikaye" aria-pressed="${hizliSuzgec === 'hikaye'}"><span class="nokta-p"></span>Hikâyeliler (4)</button>
              <button type="button" class="suzgec-hap" data-suzgec="okunmamis" aria-pressed="${hizliSuzgec === 'okunmamis'}">Okunmamış</button>
            </div>
          </section>`;

        let listeHtml = '';
        if (seciliDonem) {
          const d = DONEMLER.find((x) => x.id === seciliDonem);
          const l = suzulenEserler(seciliDonem);
          const oran = Math.min(100, Math.round((d.okunan / d.toplam) * 100));
          listeHtml = `
            <section class="bolum">
              <div class="bolum-bas">
                <div>
                  <h2>${d.ad}</h2>
                  <div class="bolum-alt">
                    <span>${d.yy}</span>
                    <span>·</span>
                    <span>${d.okunan} / ${d.toplam} okundu</span>
                    <span class="ince-cizgi"><i style="width:${Math.max(oran, d.okunan ? 14 : 0)}%"></i></span>
                  </div>
                </div>
                <button type="button" class="hepsi-dugme" data-donem="">Hepsi</button>
              </div>
              <div class="gruplu-liste">
                ${l.length ? l.map(satirHtml).join('') : '<div style="padding:18px;color:var(--ink-2);font-size:14px">Bu süzgece uyan eser bulunmadı.</div>'}
              </div>
            </section>`;
        } else {
          listeHtml = DONEMLER.map((d) => {
            const l = suzulenEserler(d.id);
            if (!l.length) return '';
            const oran = Math.min(100, Math.round((d.okunan / d.toplam) * 100));
            return `
              <section class="bolum">
                <div class="bolum-bas">
                  <div>
                    <h2>${d.ad}</h2>
                    <div class="bolum-alt">
                      <span>${d.yy}</span>
                      <span>·</span>
                      <span>${d.okunan ? `${d.okunan} okundu` : 'Henüz başlanmadı'}</span>
                      ${d.okunan ? `<span class="ince-cizgi"><i style="width:${Math.max(oran, 16)}%"></i></span>` : ''}
                    </div>
                  </div>
                  <button type="button" class="hepsi-dugme" data-donem="${d.id}">${d.toplam} eser${ikonIleri}</button>
                </div>
                <div class="serit">${l.map(kartHtml).join('')}</div>
              </section>`;
          }).join('');
        }

        icerik.innerHTML = sahneHtml + izHtml + listeHtml;
      }

      function cekmeceAc(id) {
        const e = ESERLER.find((x) => x.id === id);
        if (!e) return;
        const ic = document.getElementById('cekmece-ic');
        ic.innerHTML = `
          <div class="cekmece-ust">
            <img src="${e.gorsel}" alt="${e.ad}" style="object-position:${e.pos}" />
            <div style="flex:1;min-width:0">
              <div style="font:600 12.5px/1.3 var(--sans);color:var(--pirinc)">${e.akim} · ~${e.dk} dk</div>
              <div style="margin-top:3px;font:500 22px/1.12 var(--serif)">${e.ad}</div>
              <div style="margin-top:4px;font:400 13.5px/1.3 var(--sans);color:var(--ink-2)">${e.sanatci} · ${e.yil}</div>
              <div style="margin-top:6px;display:flex;gap:8px;font:500 12px/1 var(--sans);color:var(--ink-3)">
                ${e.hikaye ? '<span style="color:var(--pirinc)">Hikâye</span>' : ''}
                <span>${e.ayrinti} rehberli ayrıntı</span>
              </div>
            </div>
            <button type="button" class="cekmece-kapat" id="cekmece-kapat" aria-label="Kapat">×</button>
          </div>
          <p class="cekmece-ozet">${e.ozet}</p>
          <div class="cekmece-eylemler">
            <button type="button" class="ikincil-dugme" data-okundu-degis="${e.id}">${e.okundu ? 'Okunmadı yap' : 'Okundu işaretle'}</button>
            <button type="button" class="birincil-dugme" style="flex:1.2;justify-content:center" id="cekmece-tamam">Yakın okumayı aç</button>
          </div>`;
        document.getElementById('cekmece-perde').classList.add('acik');
      }

      document.addEventListener('click', (ev) => {
        const temaBtn = ev.target.closest('[data-tema-sec]');
        if (temaBtn) {
          const t = temaBtn.dataset.temaSec;
          document.documentElement.dataset.tema = t;
          document.querySelectorAll('[data-tema-sec]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.temaSec === t)));
          return;
        }
        const donemBtn = ev.target.closest('[data-donem]');
        if (donemBtn) {
          seciliDonem = donemBtn.dataset.donem;
          slayt = 0;
          ciz();
          return;
        }
        const suzBtn = ev.target.closest('[data-suzgec]');
        if (suzBtn) {
          hizliSuzgec = suzBtn.dataset.suzgec;
          ciz();
          return;
        }
        const slaytBtn = ev.target.closest('[data-slayt]');
        if (slaytBtn) {
          slayt = Number(slaytBtn.dataset.slayt);
          ciz();
          return;
        }
        const okunduBtn = ev.target.closest('[data-okundu-degis]');
        if (okunduBtn) {
          const e = ESERLER.find((x) => x.id === okunduBtn.dataset.okunduDegis);
          if (e) {
            e.okundu = !e.okundu;
            document.getElementById('cekmece-perde').classList.remove('acik');
            ciz();
          }
          return;
        }
        if (ev.target.id === 'cekmece-kapat' || ev.target.id === 'cekmece-tamam' || ev.target.id === 'cekmece-perde') {
          document.getElementById('cekmece-perde').classList.remove('acik');
          return;
        }
        const eserBtn = ev.target.closest('[data-eser]');
        if (eserBtn) {
          cekmeceAc(eserBtn.dataset.eser);
        }
      });

      // URL parametreleri (?tek=1&tema=gunduz)
      const q = new URLSearchParams(location.search);
      if (q.get('tek') === '1') document.documentElement.dataset.tek = '1';
      if (q.get('tema') === 'gunduz' || q.get('tema') === 'gece') {
        document.documentElement.dataset.tema = q.get('tema');
        document.querySelectorAll('[data-tema-sec]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.temaSec === q.get('tema'))));
      }
      ciz();
    </script>
  </body>
</html>
